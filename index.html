/* Layout: telefon uchun bitta ustun. Bosh sahifa: maqsad, davom etish kartasi, takrorlash, darslar yo'li. Dars ichida: kartochkalar, keyin mashq, pastda qimirlamas tugma paneli. */
:root {
  --bg: #F1F4F9;
  --surface: #FFFFFF;
  --field: #E8EDF6;
  --ink: #0F1B2D;
  --muted: #566679;
  --line: #D3DCE8;
  --accent: #2748C8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E8FB;
  --good: #14735A;
  --good-bg: #DCF2E9;
  --bad: #B93526;
  --bad-bg: #FBE3DF;
  --warm: #A85F08;
  --serif: 'Literata', 'PT Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B121C;
    --surface: #131D2B;
    --field: #1A2638;
    --ink: #E8EEF6;
    --muted: #93A3B8;
    --line: #25344A;
    --accent: #8AA0FF;
    --accent-ink: #0A1330;
    --accent-soft: #1B2650;
    --good: #4FD1A0;
    --good-bg: #12322A;
    --bad: #FF9385;
    --bad-bg: #3A1D1A;
    --warm: #F0A25C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B121C;
  --surface: #131D2B;
  --field: #1A2638;
  --ink: #E8EEF6;
  --muted: #93A3B8;
  --line: #25344A;
  --accent: #8AA0FF;
  --accent-ink: #0A1330;
  --accent-soft: #1B2650;
  --good: #4FD1A0;
  --good-bg: #12322A;
  --bad: #FF9385;
  --bad-bg: #3A1D1A;
  --warm: #F0A25C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 18px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ru { font-family: var(--serif); }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Tepa qism */
.top { display: flex; flex-direction: column; gap: 10px; }
.top h1 { font-family: var(--serif); font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.warm { color: var(--warm); border-color: var(--warm); }
.chip.done { color: var(--good); border-color: var(--good); }

/* Progress chiziqlari */
.bar { height: 10px; border-radius: 6px; background: var(--field); overflow: hidden; flex: 1 1 auto; min-width: 0; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.25s ease; }

/* Maqsad */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.goal .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.goal .row b { font-weight: 650; }

/* Asosiy karta */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.hero .eyebrow { color: var(--accent-ink); opacity: 0.8; }
.hero h2 { font-family: var(--serif); font-size: 26px; line-height: 1.15; font-weight: 700; text-wrap: balance; }
.hero p { opacity: 0.9; font-size: 15px; }
.btn {
  min-height: 50px; padding: 0 20px; border-radius: 14px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 650; font-size: 16px;
}
.btn.light { background: var(--accent-ink); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.wide { width: 100%; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: default; }

/* Takrorlash */
.review { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.review div { min-width: 0; }
.review h3 { font-size: 16px; font-weight: 650; }
.review p { font-size: 14px; color: var(--muted); }

/* Darslar yo'li */
.sect-h { font-family: var(--serif); font-size: 20px; font-weight: 700; }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lrow { width: 100%; text-align: left; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.lrow .n { width: 40px; height: 40px; border-radius: 12px; background: var(--field); display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.lrow.done .n { background: var(--good-bg); color: var(--good); }
.lrow .t { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.lrow .t b { font-weight: 650; font-size: 16px; }
.lrow .t span { font-size: 13px; color: var(--muted); }
.lrow .t .ru { font-size: 14px; }
.lrow.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.sec { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 2px 2px; }
.sec b { font-family: var(--serif); font-size: 17px; font-weight: 700; display: block; }
.sec span.d { font-size: 13px; color: var(--muted); display: block; }
.bubble { width: 100%; text-align: left; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.bubble.q { background: var(--field); }
.bubble.a { background: var(--accent-soft); }
.bubble .who { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.bubble .b2 { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.25; margin: 0; }
.bubble .s2 { font-size: 16px; color: var(--accent); font-weight: 600; margin: 0; }
.bubble .note { text-align: left; }
.bubble .play { margin-top: 6px; }
.bigru.small { font-size: 28px; }
.pnote { font-size: 14px; color: var(--warm); font-weight: 500; text-wrap: balance; }
.foot { display: flex; flex-direction: column; gap: 10px; color: var(--muted); font-size: 13px; }
.foot .btn { min-height: 44px; font-size: 14px; align-self: flex-start; }

/* Dars ichi: tepa panel */
.qhead { display: flex; align-items: center; gap: 12px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; display: grid; place-items: center; flex: none; }
.cnt { font-size: 14px; color: var(--muted); font-weight: 600; flex: none; }

/* Kartochka */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.card .intro { font-size: 14px; color: var(--muted); white-space: pre-line; text-align: left; }
.bigru { font-family: var(--serif); font-weight: 650; font-size: 38px; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.bigletter { font-family: var(--serif); font-weight: 600; font-size: 112px; line-height: 1; }
.say { font-size: 20px; color: var(--accent); font-weight: 600; }
.uz { font-size: 20px; font-weight: 500; text-wrap: balance; }
.note { font-size: 14px; color: var(--muted); text-wrap: balance; }
.exbox { width: 100%; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }
.exbox .ru { font-size: 24px; font-weight: 600; }
.exbox span { font-size: 15px; color: var(--muted); }
.audio-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.play { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 650; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.play svg { width: 18px; height: 18px; fill: currentColor; }
.play.big { min-height: 76px; padding: 0 28px; font-size: 17px; }
.play.big svg { width: 30px; height: 30px; }

/* Mashq */
.qlabel { font-size: 15px; color: var(--muted); font-weight: 500; text-wrap: balance; }
.qprompt { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-block: 4px; }
.qprompt .bigru { text-align: left; }
.qprompt .uzp { font-size: 26px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.qprompt .bigletter { font-size: 84px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.opt.ru { font-size: 20px; }
.opt.centered { text-align: center; font-size: 28px; font-family: var(--serif); font-weight: 650; }
.opt:active { transform: scale(0.99); }
.opt.good { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 650; }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt:disabled { cursor: default; opacity: 1; }
.opt.dim { opacity: 0.55; }
.fb { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.fb.good { background: var(--good-bg); color: var(--good); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.fb b { font-weight: 700; }
.fb .more { color: var(--ink); font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.fb .more .ru { font-size: 18px; font-weight: 600; }
.reveal { background: var(--surface); border: 1px dashed var(--accent); border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

/* Natija */
.result { align-items: center; text-align: center; }
.result .score { font-family: var(--serif); font-size: 64px; font-weight: 700; line-height: 1; }
.result .msg { font-size: 18px; font-weight: 600; text-wrap: balance; }
.xpline { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* Pastki panel */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.dock-in .btn { flex: 1 1 0; }
.dock-in .btn.ghost { flex: 0 0 auto; }

@media (prefers-reduced-motion: reduce) {
  .bar span { transition: none; }
  .btn:active, .opt:active { transform: none; }
}
@media (max-width: 360px) {
  .bigru { font-size: 32px; }
  .bigletter { font-size: 92px; }
}
</style>

      D('Вам на какую улицу?', 'vam na kakuyu ulitsu', 'Qaysi ko‘chaga kerak?', 'На улицу Мира, дом семь.', 'na ulitsu mira dom syem', 'Mira ko‘chasi, yettinchi uy.'),
      D('Идите прямо, потом направо.', 'idite pryama patom naprava', 'To‘g‘ri yuring, keyin o‘ngga.', 'Повторите, пожалуйста, помедленнее.', 'paftarite pazhalusta pamyedlenneye', 'Takrorlang, iltimos, sekinroq.'),
      D('Вы заблудились?', 'vy zabludilis', 'Adashdingizmi?', 'Да, я не знаю, где я.', 'da ya nye znayu gde ya', 'Ha, qayerdaligimni bilmayman.')
    ] },
    { id: 'd9', type: 'D', title: 'Suhbat 9: kafe va ovqat', sub: 'Диалог · Кафе', items: [
      D('Здравствуйте! Вы готовы заказать?', 'zdrastvuyte vy gatovy zakazat', 'Salom! Buyurtma berishga tayyormisiz?', 'Да, мне борщ и котлету, пожалуйста.', 'da mnye borsh i katlyetu pazhalusta', 'Ha, menga borsh va kotlet, iltimos.'),
      D('Что на гарнир: рис или гречка?', 'shto na garnir ris ili grechka', 'Garnirga nima: guruchmi yoki grechka?', 'Гречку, пожалуйста.', 'grechku pazhalusta', 'Grechka, iltimos.'),
      D('Что будете пить?', 'shto budite pit', 'Nima ichasiz?', 'Чай без сахара.', 'chay byes sakhara', 'Shakarsiz choy.'),
      D('Заказ принят. Минут пятнадцать.', 'zakas prinyat minut pyatnatsat', 'Buyurtma qabul qilindi. O‘n besh daqiqa.', 'Хорошо, я подожду.', 'xarasho ya padazhdu', 'Yaxshi, kutaman.'),
      D('Вот ваш заказ. Приятного аппетита!', 'vot vash zakas priyatnava apitita', 'Mana buyurtmangiz. Yoqimli ishtaha!', 'Спасибо!', 'spasiba', 'Rahmat!'),
      D('Всё понравилось?', 'vsyo panravilas', 'Hammasi yoqdimi?', 'Да, очень вкусно.', 'da ochen fkusna', 'Ha, juda mazali.'),
      D('Что-нибудь ещё?', 'shto-nibut yeshyo', 'Yana biror narsa?', 'Нет, счёт, пожалуйста.', 'nyet shyot pazhalusta', 'Yo‘q, hisob, iltimos.'),
      D('Оплата вместе или раздельно?', 'aplata vmyeste ili razdyelna', 'To‘lov birgami yoki alohida-alohidami?', 'Вместе, пожалуйста.', 'vmyeste pazhalusta', 'Birga, iltimos.')
    ] },
    { id: 'd10', type: 'D', title: 'Suhbat 10: hujjat tekshiruvi', sub: 'Диалог · Проверка документов', intro: 'Hujjat so‘ralganda xotirjam va xushmuomala javob bering.', items: [
      D('Ваши документы, пожалуйста.', 'vashi dakumenty pazhalusta', 'Hujjatlaringiz, iltimos.', 'Пожалуйста, вот паспорт.', 'pazhalusta vot paspart', 'Marhamat, mana pasport.'),
      D('Где вы живёте?', 'gde vy zhivyote', 'Qayerda yashaysiz?', 'Я живу на улице Мира, дом семь.', 'ya zhivu na ulitse mira dom syem', 'Men Mira ko‘chasi, 7-uyda yashayman.'),
      D('Где вы работаете?', 'gde vy rabotayete', 'Qayerda ishlaysiz?', 'Я работаю на стройке.', 'ya rabotayu na stroyke', 'Men qurilishda ishlayman.'),
      D('Регистрация есть?', 'rigistratsiya yest', 'Ro‘yxatga olinganmisiz?', 'Да, вот она.', 'da vot ana', 'Ha, mana u.'),
      D('Патент оплачен?', 'patent aplachen', 'Patent to‘langanmi?', 'Да, вот чек.', 'da vot chek', 'Ha, mana chek.'),
      D('Вы понимаете по-русски?', 'vy panimayete pa-ruski', 'Ruscha tushunasizmi?', 'Немного. Говорите медленнее, пожалуйста.', 'nimnoga gavarite myedlennee pazhalusta', 'Ozgina. Sekinroq gapiring, iltimos.'),
      D('Куда вы идёте?', 'kuda vy idyote', 'Qayerga ketyapsiz?', 'Домой, с работы.', 'damoy s raboty', 'Uyga, ishdan.'),
      D('Всё в порядке. Можете идти.', 'vsyo v paryatke mozhete idti', 'Hammasi joyida. Ketishingiz mumkin.', 'Спасибо. До свидания.', 'spasiba da svidaniya', 'Rahmat. Xayr.')
    ] },
    { id: 'd11', type: 'D', title: 'Suhbat 11: telefonda', sub: 'Диалог · По телефону', items: [
      D('Алло, слушаю.', 'alo slushayu', 'Allo, eshitaman.', 'Здравствуйте, это Али. Можно Сергея?', 'zdrastvuyte eta ali mozhna sirgeya', 'Salom, bu Ali. Sergeyni chaqirsangiz bo‘ladimi?'),
      D('Его сейчас нет. Что передать?', 'yevo sichas nyet shto piridat', 'U hozir yo‘q. Nima deb aytay?', 'Передайте, что я звонил.', 'piridayte shto ya zvanil', 'Qo‘ng‘iroq qilganimni ayting.'),
      D('Алло, вас плохо слышно.', 'alo vas plokha slyshna', 'Allo, sizni yomon eshityapman.', 'Я на улице. Сейчас перезвоню.', 'ya na ulitse sichas pirizvanyu', 'Ko‘chadaman. Hozir qayta qo‘ng‘iroq qilaman.'),
      D('Ты где? Мы уже ждём.', 'ty gde my uzhe zhdyom', 'Qayerdasan? Biz kutyapmiz.', 'Я скоро буду, десять минут.', 'ya skora budu disyat minut', 'Tez orada yetib boraman, o‘n daqiqa.'),
      D('Ты можешь говорить?', 'ty mozhish gavarit', 'Gaplasha olasanmi?', 'Не сейчас, я на работе. Перезвоню вечером.', 'nye sichas ya na rabote pirizvanyu vyecheram', 'Hozir emas, ishdaman. Kechqurun qo‘ng‘iroq qilaman.'),
      D('Скинь мне свой номер.', 'skin mnye svoy nomer', 'Raqamingni tashla.', 'Сейчас скину в сообщении.', 'sichas skinu v saabshenii', 'Hozir xabarda tashlayman.', 'Скинуть — tashlab yuborish (so‘zlashuv).'),
      D('Ты получил моё сообщение?', 'ty paluchil mayo saabsheniye', 'Xabarimni oldingmi?', 'Да, получил, спасибо.', 'da paluchil spasiba', 'Ha, oldim, rahmat.'),
      D('Ладно, позвони мне вечером.', 'ladna pazvoni mnye vyecheram', 'Mayli, kechqurun menga qo‘ng‘iroq qil.', 'Хорошо, обязательно позвоню.', 'xarasho abizatilna pazvonyu', 'Yaxshi, albatta qo‘ng‘iroq qilaman.')
    ] }
  );

  var TALKS = {
    p1: [['A', 'Привет!', 'privyet', 'Salom!'], ['B', 'Привет! Как дела?', 'privyet kak dila', 'Salom! Ishlar qalay?'], ['A', 'Нормально, спасибо. А у тебя?', 'narmalna spasiba a u tibya', 'Yaxshi, rahmat. O‘zingdachi?'], ['B', 'Тоже хорошо. Ладно, пока!', 'tozhe xarasho ladna paka', 'Menda ham yaxshi. Mayli, xayr!'], ['A', 'Пока, до завтра!', 'paka da zavtra', 'Xayr, ertagacha!']],
    p2: [['A', 'Привет, меня зовут Алексей. А тебя?', 'privyet minya zavut aliksey a tibya', 'Salom, mening ismim Aleksey. Seniki?'], ['B', 'Я Али. Приятно познакомиться.', 'ya ali priyatna paznakomitsa', 'Men Aliman. Tanishganimdan xursandman.'], ['A', 'Ты откуда?', 'ty atkuda', 'Qayerdansan?'], ['B', 'Из Узбекистана, из Ташкента. А ты?', 'iz uzbekistana iz tashkenta a ty', 'O‘zbekistondan, Toshkentdan. O‘zing-chi?'], ['A', 'Я из Москвы. Давно здесь?', 'ya iz maskvy davno zdyes', 'Men Moskvadanman. Bu yerda ko‘pdan beri bormisan?'], ['B', 'Нет, недавно. Три месяца.', 'nyet nidavna tri myesyatsa', 'Yo‘q, yaqinda. Uch oy.']],
    p3: [['A', 'Сколько стоит?', 'skolka stoit', 'Qancha turadi?'], ['B', 'Сто двадцать рублей.', 'sto dvatsat rublyey', 'Bir yuz yigirma rubl.'], ['A', 'Дорого. Давай за сто.', 'doroga davay za sto', 'Qimmat. Yuzga bering.'], ['B', 'Ладно, сто десять.', 'ladna sto disyat', 'Mayli, bir yuz o‘n.'], ['A', 'Хорошо, беру.', 'xarasho biru', 'Yaxshi, olaman.']],
    p4: [['A', 'Сколько с меня?', 'skolka s minya', 'Mendan qancha?'], ['B', 'Триста пятьдесят рублей.', 'trista pidisyat rublyey', 'Uch yuz ellik rubl.'], ['A', 'Картой можно?', 'kartoy mozhna', 'Karta bilan bo‘ladimi?'], ['B', 'Да, прикладывайте.', 'da prikladyvayte', 'Ha, tegizing.'], ['A', 'Спасибо. Чек не нужен.', 'spasiba chek nye nuzhen', 'Rahmat. Chek kerak emas.']],
    p5: [['A', 'Здравствуйте, я новенький. Что мне делать?', 'zdrastvuyte ya novenkiy shto mnye dyelat', 'Salom, men yangiman. Nima qilishim kerak?'], ['B', 'Иди на склад, там помогут.', 'idi na sklat tam pamogut', 'Omborga bor, u yerda yordam berishadi.'], ['A', 'А когда зарплата?', 'a kagda zarplata', 'Oylik qachon?'], ['B', 'Пятнадцатого и в конце месяца.', 'pitnatsatava i v kantse myesyatsa', 'O‘n beshinchi kuni va oy oxirida.'], ['A', 'Понятно, спасибо.', 'panyatna spasiba', 'Tushunarli, rahmat.']],
    p6: [['A', 'Извините, как доехать до метро?', 'izvinite kak dayekhat da mitro', 'Kechirasiz, metroga qanday borsam bo‘ladi?'], ['B', 'Идите прямо, потом налево.', 'idite pryama patom naleva', 'To‘g‘ri yuring, keyin chapga.'], ['A', 'Это далеко?', 'eta daleko', 'Uzoqmi?'], ['B', 'Нет, пять минут пешком.', 'nyet pyat minut pishkom', 'Yo‘q, besh daqiqa piyoda.'], ['A', 'Спасибо большое!', 'spasiba bolshoye', 'Katta rahmat!']],
    p7: [['A', 'Помогите, пожалуйста!', 'pamagite pazhalusta', 'Yordam bering, iltimos!'], ['B', 'Что случилось?', 'shto sluchilas', 'Nima bo‘ldi?'], ['A', 'Мне плохо. Вызовите скорую.', 'mnye plokha vizovite skoruyu', 'Menga yomon. Tez yordam chaqiring.'], ['B', 'Сейчас, сейчас. Сядьте, не волнуйтесь.', 'siychas siychas syadte nye valnuytes', 'Hozir, hozir. O‘tiring, xavotir olmang.']],
    p8: [['A', 'Что будете заказывать?', 'shto budite zakazyvat', 'Nima buyurtma berasiz?'], ['B', 'Мне суп и чай, пожалуйста.', 'mnye sup i chay pazhalusta', 'Menga sho‘rva va choy, iltimos.'], ['A', 'Хлеб нужен?', 'xlyep nuzhen', 'Non kerakmi?'], ['B', 'Да, и без сахара, пожалуйста.', 'da i byes sakhara pazhalusta', 'Ha, choy shakarsiz bo‘lsin.'], ['A', 'Хорошо, минут десять.', 'xarasho minut disyat', 'Yaxshi, o‘n daqiqa.']],
    p9: [['A', 'Ты русский?', 'ty ruskiy', 'Sen ruschamisan?'], ['B', 'Нет, я узбек. А ты?', 'nyet ya uzbek a ty', 'Yo‘q, men o‘zbekman. O‘zing-chi?'], ['A', 'Я русский. Это твой друг?', 'ya ruskiy eta tvoy druk', 'Men ruslikman. Bu do‘sting-mi?'], ['B', 'Да, он тоже из Ташкента.', 'da on tozhe iz tashkenta', 'Ha, u ham Toshkentdan.'], ['A', 'А она кто?', 'a ana kto', 'U (ayol) kim?'], ['B', 'Это моя сестра.', 'eta maya sistra', 'Bu mening singlim/opam.']],
    p10: [['A', 'Где ты живёшь?', 'gde ty zhivyosh', 'Qayerda yashaysan?'], ['B', 'Рядом с метро.', 'ryadam s mitro', 'Metro yonida.'], ['A', 'Как ты едешь на работу?', 'kak ty yedyesh na rabotu', 'Ishga qanday borasan?'], ['B', 'На автобусе.', 'na aftobuse', 'Avtobusda.'], ['A', 'Сколько это занимает?', 'skolka eta zanimayet', 'Bu qancha vaqt oladi?'], ['B', 'Около часа.', 'okala chasa', 'Taxminan bir soat.']],
    p11: [['A', 'Ты хочешь кофе?', 'ty xochish kofye', 'Qahva xohlaysanmi?'], ['B', 'Да, хочу. Можно с молоком?', 'da khachu mozhna s malakom', 'Ha, xohlayman. Sut bilan bo‘ladimi?'], ['A', 'Можно. Тебе надо что-нибудь ещё?', 'mozhna tibye nada shto-nibut yeshyo', 'Bo‘ladi. Yana biror narsa kerakmi?'], ['B', 'Нет. Мне надо идти на работу.', 'nyet mnye nada idti na rabotu', 'Yo‘q. Menga ishga borish kerak.'], ['A', 'Тогда держи.', 'tagda dyerzhi', 'Unda mana ol.']],
    p12: [['A', 'Алло, ты где? Что делаешь?', 'alo ty gde shto dyelayesh', 'Allo, qayerdasan? Nima qilyapsan?'], ['B', 'Я иду домой. А ты?', 'ya idu damoy a ty', 'Uyga ketyapman. O‘zing-chi?'], ['A', 'Я готовлю ужин.', 'ya gatovlyu uzhin', 'Kechki ovqat tayyorlayapman.'], ['B', 'Здорово! Я скоро буду.', 'zdarova ya skora budu', 'Zo‘r! Tez orada yetib boraman.']],
    p13: [['A', 'Что ты вчера делал?', 'shto ty vchira dyelal', 'Kecha nima qilding?'], ['B', 'Работал, потом отдыхал дома.', 'rabotal patom atdykhal doma', 'Ishladim, keyin uyda dam oldim.'], ['A', 'А я ходил в магазин.', 'a ya khadil v magazin', 'Men esa do‘konga bordim.'], ['B', 'Что купил?', 'shto kupil', 'Nima oldingiz?'], ['A', 'Купил хлеб и молоко.', 'kupil xlyep i malako', 'Non va sut oldim.']],
    p14: [['A', 'Что делаешь завтра?', 'shto dyelayesh zavtra', 'Ertaga nima qilasan?'], ['B', 'Пока не знаю. А что?', 'paka nye znayu a shto', 'Hozircha bilmayman. Nima edi?'], ['A', 'Давай встретимся вечером.', 'davay vstretimsya vyecheram', 'Keling, kechqurun uchrashaylik.'], ['B', 'Давай. Во сколько?', 'davay va skolka', 'Mayli. Soat nechada?'], ['A', 'В семь, у метро.', 'v syem u mitro', 'Yettida, metro oldida.'], ['B', 'Договорились!', 'dagavarilis', 'Kelishdik!']],
    p15: [['A', 'Который час?', 'katoriy chas', 'Soat necha bo‘ldi?'], ['B', 'Половина третьего.', 'palavina tretyevo', 'Ikki yarim (2:30).'], ['A', 'А во сколько автобус?', 'a va skolka aftobus', 'Avtobus soat nechada?'], ['B', 'В три пятнадцать.', 'v tri pitnatsat', 'Uch o‘n beshda (3:15).'], ['A', 'Значит, ещё успеем.', 'znachit yeshyo uspeyem', 'Demak, hali ulguramiz.']],
    p16: [['A', 'Здорово! Как жизнь?', 'zdarova kak zhizn', 'Qalay! Hayot qalay?'], ['B', 'Нормально, потихоньку. Ты как?', 'narmalna patikhonku ty kak', 'Yaxshi, sekin-asta. O‘zing qalaysan?'], ['A', 'Тоже ничего. Давно не виделись!', 'tozhe nichivo davno nye vidilis', 'Menda ham yomon emas. Anchadan beri ko‘rishmadik!'], ['B', 'Да, давно. Надо встретиться.', 'da davno nada vstretitsa', 'Ha, anchadan. Uchrashish kerak.'], ['A', 'Обязательно. Ну, давай!', 'abizatilna nu davay', 'Albatta. Xo‘p, xayr!']],
    p17: [['A', 'Ну что, как сам?', 'nu shto kak sam', 'Xo‘sh, o‘zing qalaysan?'], ['B', 'Да нормально. Вчера устал, весь день работал.', 'da narmalna vchira ustal vyes dyen rabotal', 'Yaxshi. Kecha charchadim, kun bo‘yi ishladim.'], ['A', 'Понятно. Слушай, займи сто рублей.', 'panyatna slushay zaymi sto rublyey', 'Tushunarli. Eshit, yuz rubl qarz ber.'], ['B', 'Без проблем. Держи.', 'byes prablyem dyerzhi', 'Muammo yo‘q. Mana.'], ['A', 'Класс, спасибо!', 'klas spasiba', 'Zo‘r, rahmat!']],
    p18: [['A', 'Пойдём в кино?', 'paydyom v kino', 'Kinoga boramizmi?'], ['B', 'Не, не хочу. Устал.', 'nye nye khachu ustal', 'Yo‘q, xohlamayman. Charchadim.'], ['A', 'Ну давай, будет весело!', 'nu davay budet vyesela', 'Qani, qiziq bo‘ladi!'], ['B', 'Ладно, уговорил. Пойдём.', 'ladna ugavaril paydyom', 'Mayli, ko‘ndirding. Boramiz.'], ['A', 'Супер!', 'super', 'Ajoyib!']],
    p19: [['A', 'Здравствуйте, сколько стоят помидоры?', 'zdrastvuyte skolka stoyat pamidory', 'Salom, pomidor qancha turadi?'], ['B', 'Девяносто рублей килограмм.', 'divinosta rublyey kilagram', 'Kilosi to‘qson rubl.'], ['A', 'Дайте, пожалуйста, два килограмма.', 'dayte pazhalusta dva kilagrama', 'Iltimos, ikki kilo bering.'], ['B', 'Что-нибудь ещё?', 'shto-nibut yeshyo', 'Yana biror narsa?'], ['A', 'Нет, это всё. Сколько с меня?', 'nyet eta vsyo skolka s minya', 'Yo‘q, hammasi shu. Mendan qancha?']],
    p20: [['A', 'Добрый вечер. Куда едем?', 'dobriy vyecher kuda yedyem', 'Xayrli kech. Qayerga boramiz?'], ['B', 'На улицу Ленина, дом пять.', 'na ulitsu lenina dom pyat', 'Lenin ko‘chasi, beshinchi uy.'], ['B', 'Сколько ехать?', 'skolka yekhat', 'Qancha yuramiz?'], ['A', 'Минут двадцать, если не будет пробок.', 'minut dvatsat yesli nye budet probak', 'Yigirma daqiqa, tirbandlik bo‘lmasa.'], ['B', 'Остановите у магазина, пожалуйста.', 'astanavite u magazina pazhalusta', 'Do‘kon oldida to‘xtating, iltimos.'], ['A', 'Приехали.', 'priyekhali', 'Yetib keldik.']],
    p21: [['A', 'Ты сегодня на смене?', 'ty sivodnya na smyene', 'Bugun smenadamisan?'], ['B', 'Да, с восьми до шести.', 'da s vasmi da shesti', 'Ha, sakkizdan oltigacha.'], ['A', 'Начальник уже пришёл?', 'nachalnik uzhe prishol', 'Boshliq kelib bo‘ldimi?'], ['B', 'Нет, он будет позже.', 'nyet on budet pozhe', 'Yo‘q, u keyinroq bo‘ladi.'], ['A', 'Ладно. Я пошёл работать.', 'ladna ya pashol rabotat', 'Mayli. Men ishga ketdim.']],
    p22: [['A', 'Алло, здравствуйте! Это Али.', 'alo zdrastvuyte eta ali', 'Allo, salom! Bu Ali.'], ['B', 'Здравствуйте. Слушаю вас.', 'zdrastvuyte slushayu vas', 'Salom. Eshitaman.'], ['A', 'Простите, я плохо слышу. Повторите, пожалуйста.', 'prastite ya plokha slyshu paftarite pazhalusta', 'Kechirasiz, yomon eshityapman. Takrorlang, iltimos.'], ['B', 'Я говорю, перезвоните через час.', 'ya gavaryu pirizvanite chiryes chas', 'Aytyapman, bir soatdan keyin qayta qo‘ng‘iroq qiling.'], ['A', 'Хорошо, до свидания.', 'xarasho da svidaniya', 'Yaxshi, xayr.']],

  intro: 'Нужно, надо — kerak (D.k.: мне нужно).\nДолжен (-на, -ны) — burchli, majbur.\nПридётся — "to‘g‘ri keladi", ixtiyorsiz majburiyat.\nНельзя — mumkin emas; разрешено — ruxsat etilgan; запрещено — taqiqlangan.\nНе нужно / не надо — shart emas.\nO‘tgan zamon: нужно было, пришлось.',
  items: [
    P('Мне нужно оформить регистрацию в течение семи дней после приезда', 'mnye nuzhna aformit rigistratsiyu v tichyeniye simi dnyey posle priyezda', 'Kelganimdan keyin yetti kun ichida ro‘yxatdan o‘tishim kerak'),
    P('Ты должен показать паспорт на входе, иначе тебя не пропустят', 'ty dolzhen pakazat pasport na fxode inache tibya ni prapustyat', 'Kirishda pasportni ko‘rsatishing shart, aks holda seni o‘tkazishmaydi'),
    P('Придётся выйти пораньше, потому что на дорогах сегодня много снега', 'pridyotsya vyyti paranshe patamu shto na darogax sivodnya mnoga snyega', 'Erta chiqishga to‘g‘ri keladi, chunki bugun yo‘llarda qor ko‘p', 'Придётся — ixtiyorsiz majburiyat.'),
    P('В метро нельзя курить и бросать мусор на пол', 'v mitro nilzya kurit i brasat musar na pol', 'Metroda chekish va yerga axlat tashlash mumkin emas'),
    P('Здесь нельзя парковаться, видите знак? Вам придётся переставить машину', 'zdyes nilzya parkavatsya vidite znak vam pridyotsya pirestavit mashinu', 'Bu yerda to‘xtash mumkin emas, belgini ko‘ryapsizmi? Mashinani boshqa joyga qo‘yishingizga to‘g‘ri keladi'),
    P('На этой территории запрещено фотографировать, это режимный объект', 'na etoy tiritorii zapreshyeno fatagrafiravat eta rizhimny abyekt', 'Bu hududda suratga olish taqiqlangan, bu rejimli obyekt'),
    P('В нашем общежитии разрешено приглашать гостей только до десяти вечера', 'v nashem abshezhitii razreshyeno priglashat gastyey tolka da disyati vechira', 'Bizning yotoqxonada mehmon chaqirish faqat kechki o‘ngacha ruxsat etiladi'),
    P('Мне надо сегодня сдать анализы, поэтому с утра нельзя ничего есть', 'mnye nada sivodnya sdat analizy paetamu s utra nilzya nichivo yest', 'Bugun tahlil topshirishim kerak, shuning uchun ertalabdan hech narsa yeb bo‘lmaydi'),
    P('Ему нужно было срочно вернуться домой, потому что заболела мама', 'yemu nuzhna bylo srochna virnutsya damoy patamu shto zabalela mama', 'Unga onasi kasal bo‘lgani uchun shoshilinch uyga qaytish kerak edi'),
    P('Мне пришлось работать в выходные, потому что не хватало людей', 'mnye prishlos rabotat v vyxadnyye patamu shto ni xvatala lyudey', 'Odam yetishmagani uchun dam olish kunlari ishlashga to‘g‘ri keldi'),
    P('Мы должны вернуть книги в библиотеку до конца месяца', 'my dalzhny virnut knigi v bibliatyeku da kantsa myesyatsa', 'Biz kitoblarni oy oxirigacha kutubxonaga qaytarishimiz shart'),
    P('Можно мне выйти на пять минут? Да, можно, только побыстрее', 'mozhna mnye vyyti na pyat minut da mozhna tolka pabystriye', 'Besh daqiqaga chiqsam bo‘ladimi? Ha, bo‘ladi, faqat tezroq'),
    P('Детям до шести лет проезд бесплатный, документы показывать не нужно', 'dityam da shesti lyet prayezd byesplatny dakumenty pakazyvat ni nuzhna', 'Olti yoshgacha bolalar uchun yo‘l haqi bepul, hujjat ko‘rsatish shart emas'),
    P('Тебе не обязательно приходить рано, но предупредить меня всё-таки надо', 'tibye ni abyazatelna prixodit rana no pridupridit minya vsyo taki nada', 'Erta kelishing shart emas, lekin meni ogohlantirib qo‘yishing kerak')
  ],
  talk: [
    T('A','Добрый день, можно к вам на минуту? Мне надо срочно уйти.','dobry dyen mozhna k vam na minutu mnye nada srochna uyti','Xayrli kun, bir daqiqaga kirsam bo‘ladimi? Menga shoshilinch ketish kerak.'),
    T('B','Что случилось? Ты же должен работать до шести.','shto sluchilas ty zhe dolzhen rabotat da shesti','Nima bo‘ldi? Sen oltigacha ishlashing kerak-ku.'),
    T('A','Мне нужно успеть в банк, он закрывается в пять.','mnye nuzhna uspet v bank on zakryvayetsya v pyat','Bankka ulgurishim kerak, u beshda yopiladi.'),
    T('B','Понятно. Разрешаю, но тебе придётся отработать эти часы в субботу.','panyatna razreshayu no tibye pridyotsya atrabotat eti chasy v subotu','Tushunarli. Ruxsat beraman, lekin bu soatlarni shanba kuni ishlab berishga to‘g‘ri keladi.'),
    T('A','Хорошо, без проблем. А в субботу можно прийти без каски?','xarasho byez prablem a v subotu mozhna priyti byes kaski','Mayli, muammo yo‘q. Shanba kuni kaskasiz kelsam bo‘ladimi?'),
    T('B','Нет, на объекте без каски нельзя, это запрещено, штраф большой.','nyet na abyekte byes kaski nilzya eta zapreshyeno shtraf bolshoy','Yo‘q, obyektda kaskasiz mumkin emas, taqiqlangan, jarima katta.'),
    T('A','Понял, буду помнить. Спасибо, что отпустили.','ponyal budu pomnit spasiba shto atpustili','Tushundim, eslab qolaman. Qo‘yib yuborganingiz uchun rahmat.'),
    T('B','Не за что. Только предупреждай заранее, мне нужно знать, кто на смене.','ni za shto tolka priduprizhday zaraniye mnye nuzhna znat kto na smyene','Arzimaydi. Faqat oldindan ogohlantir, kim smenada ekanini bilishim kerak.')
  ]
});

LESSONS.push({ id: 'b1a-d1', type: 'D', sec: 9, title: 'Suhbat: shart va rejalar', sub: 'Диалог · условия и планы',

    D('Что бы ты купил, если бы получил премию?', 'shto by ty kupil yesli by paluchil primiyu', 'Mukofot olsang, nima sotib olgan bo‘lardingiz?', 'Я бы купил новый телефон, а остальное отправил бы родителям.', 'ya by kupil novy tilifon a astalnoye atpravil by raditelyam', 'Yangi telefon olardim, qolganini ota-onamga jo‘natardim.'),
    D('Ты бы переехал в другой город, если бы там предложили зарплату выше?', 'ty by piriyexal v drugoy gorat yesli by tam pridlazhili zarplatu vyshe', 'U yerda maoshni yuqoriroq taklif qilishsa, boshqa shaharga ko‘chib o‘tarmiding?', 'Да, если бы условия были хорошие, я бы не раздумывал.', 'da yesli by uslaviya byli xarashiye ya by ni razdumyval', 'Ha, sharoit yaxshi bo‘lsa, o‘ylab o‘tirmasdim.'),

    D('Что будем делать, если пойдёт дождь?', 'shto budem dyelat yesli paydyot dozhd', 'Yomg‘ir yog‘sa, nima qilamiz?', 'Если пойдёт дождь, зайдём в кафе и подождём.', 'yesli paydyot dozhd zaydyom v kafe i padazhdyom', 'Yomg‘ir yog‘sa, kafega kirib kutamiz.'),
    D('Ты мог бы помочь мне с переездом, если у тебя будет время?', 'ty mok by pamoch mnye s piriyezdam yesli u tibya budit vremya', 'Vaqting bo‘lsa, ko‘chishimga yordam bera olarmiding?', 'Конечно, помогу, только скажи заранее, в какой день.', 'kanyeshna pamagu tolka skazhi zaraniye v kakoy dyen', 'Albatta yordam beraman, faqat qaysi kuni ekanini oldindan ayt.'),
    D('Что ты сделаешь, если потеряешь паспорт?', 'shto ty sdyelayesh yesli pateryayesh pasport', 'Pasportingni yo‘qotsang, nima qilasan?', 'Сразу пойду в полицию, а потом в консульство за новым.', 'srazu paydu v palitsiyu a patom v konsulstvo za novym', 'Darrov politsiyaga, keyin yangisini olish uchun konsullikka boraman.'),

    D('Зачем ты звонишь маме каждый вечер?', 'zachem ty zvonish mame kazhdy vyecher', 'Nega har kuni kechqurun onangga qo‘ng‘iroq qilasan?', 'Чтобы она не волновалась, и мне самому так спокойнее.', 'shtoby ana ni valnavalas i mnye samamu tak spakoyniye', 'U xavotir olmasligi uchun, menga ham shunday xotirjamroq.'),

  items: [

    P('Мне кажется, ты немного преувеличиваешь, всё не так страшно.', 'mne kazhetsya ty nimnoga priuvilichivaesh vsyo ne tak strashna', 'Menimcha, sen biroz bo‘rttiryapsan, hammasi unchalik qo‘rqinchli emas.'),
    P('Я с тобой не согласен, потому что цены давно выросли.', 'ya s taboy ne saglasen patamu shto tseny davno vyrasli', 'Men sen bilan rozi emasman, chunki narxlar anchadan beri oshgan.'),
    P('С одной стороны, жить в центре удобно, с другой стороны, дорого.', 's adnoy starony zhit v tsentre udobna s drugoy starony daraga', 'Bir tomondan, markazda yashash qulay, ikkinchi tomondan, qimmat.'),
    P('Ты не прав, никто тебя не заставлял соглашаться на такие условия.', 'ty ne prav nikto tibya ne zastavlyal saglashatsya na takie usloviya', 'Sen noto‘g‘risan, seni bunday shartlarga rozi bo‘lishga hech kim majburlamagan.'),
    P('Давай не будем спорить, лучше выслушаем друг друга до конца.', 'davay ne budem sparit luchshe vyslushaem druk druga da kantsa', 'Bahslashmaylik, yaxshisi, bir-birimizni oxirigacha tinglaylik.'),
    P('Я понимаю твою точку зрения, но смотрю на это иначе.', 'ya panimayu tvayu tochku zreniya no smatryu na eta inache', 'Men sening nuqtai nazaringni tushunaman, lekin bunga boshqacha qarayman.'),
    P('Честно говоря, мне этот фильм совсем не понравился, скучный какой-то.', 'chesna gavarya mne etat film sovsem ne panravilsya skuchny kakoy ta', 'To‘g‘risini aytsam, bu film menga umuman yoqmadi, qandaydir zerikarli.', 'Ayol aytsa: «не понравился» o‘rniga «не понравилась» (kino haqida emas, kitob haqida).'),
    P('Ты вообще слушаешь, что я говорю, или просто киваешь?', 'ty vaapshe slushaesh shto ya gavaryu ili prosta kivaesh', 'Sen umuman men aytganni tinglayapsanmi yoki shunchaki bosh irg‘ayapsanmi?'),

    P('Не обижайся, но я считаю, что ты поступил неправильно.', 'ne abizhaysya no ya shitayu shto ty pastupil nipravilna', 'Xafa bo‘lma, lekin men sen noto‘g‘ri qildingki deb hisoblayman.'),
    P('Давай каждый останется при своём мнении, и не будем ссориться.', 'davay kazhdy astanetsya pri svayom mnenii i ne budem ssoritsa', 'Har kim o‘z fikrida qolsin, janjallashmaylik.'),
    P('Это зависит от обстоятельств, одного правильного ответа здесь просто нет.', 'eta zavisit at abstayatelstf adnava pravilnava atveta zdes prosta net', 'Bu sharoitga bog‘liq, bu yerda bitta to‘g‘ri javob yo‘q.'),
    P('Вот именно, я как раз то же самое хотел сказать!', 'vot imenna ya kak ras ta zhe samaye xatel skazat', 'Aynan shu, men ham xuddi shuni aytmoqchi edim!')
  ],
  talk: [
    T('A','Слушай, по-моему, нам надо снять квартиру подальше от центра.','slushay pamayemu nam nada snyat kvartiru padalshe at tsentra','Eshit, menimcha, bizga markazdan uzoqroqda kvartira olish kerak.'),
    T('B','Не знаю, мне кажется, там неудобно: нет ни метро, ни магазинов рядом.','ne znayu mne kazhetsya tam neudobna net ni mitro ni magazinof ryadam','Bilmayman, menimcha, u yerda noqulay: yaqinda na metro, na do‘kon bor.'),
    T('A','С одной стороны, ты прав, а с другой, там вдвое дешевле.','s adnoy starony ty prav a s drugoy tam vdvaye dishevlye','Bir tomondan, sen haqsan, ikkinchi tomondan, u yerda ikki baravar arzon.'),
    T('B','Но я не согласен тратить по два часа на дорогу ради экономии.','no ya ne saglasen tratit pa dva chasa na daragu radi ekanomii','Lekin tejash uchun yo‘lga ikki soatdan sarflashga rozi emasman.'),
    T('A','Давай посчитаем, сколько выйдет в месяц вместе с проездом.','davay pashitaem skolka vyydet v myesyats vmyeste s prayezdam','Keling, yo‘l haqi bilan birga oyiga qancha chiqishini hisoblaymiz.'),
    T('B','Хорошо, только без обид, если цифры будут не в твою пользу.','xarasho tolka bez abit yesli tsifry budut ne v tvayu polzu','Yaxshi, faqat raqamlar sening foydangga bo‘lmasa, xafa bo‘lma.'),
    T('A','Договорились, я не обижусь, главное — решить вместе.','dagavarilis ya ne abizhus glavnaye rishit vmyeste','Kelishdik, xafa bo‘lmayman, asosiysi — birga hal qilish.'),
    T('B','Вот это другой разговор, тогда садись и считаем.','vot eta drugoy razgavor tagda sadis i shitayem','Mana bu boshqa gap, unda o‘tir, hisoblaymiz.')
  ]
});

LESSONS.push({ id: 'b1b-03', type: 'P', sec: 10, title: 'Bank, MFC, idoralar va shikoyat', sub: 'Банк, МФЦ и жалоба',
  intro: 'Bank va idorada kerakli so‘zlar:\nперевод — pul o‘tkazma; талон — navbat talon; заявление — ariza; жалоба — shikoyat; возврат — qaytarish.\nSo‘rash: «Мне нужно...», «Можно оформить...?»\nМФЦ — hujjatlar uchun yagona idora; avval talon oling.',
  items: [
    P('Мне нужно сделать перевод на карту в другой банк.', 'mne nuzhna sdelat pirivod na kartu v drugoy bank', 'Menga boshqa bankdagi kartaga pul o‘tkazish kerak.'),
    P('Возьмите талон в терминале и ждите, пока вызовут вас по номеру.', 'vazmite talon v tirminale i zhdite paka vyzavut vas pa nomiru', 'Terminaldan talon oling va raqamingiz bilan chaqirishlarini kuting.'),
    P('Я хочу подать заявление на замену карты, старая перестала работать.', 'ya xachu padat zayavlenie na zamenu karty staraya pirestala rabotat', 'Kartani almashtirish uchun ariza bermoqchiman, eskisi ishlamay qoldi.'),
    P('С моей карты списали деньги дважды, мне нужен возврат средств.', 's mayey karty spisali dengi dvazhdy mne nuzhen vazvrat sredstf', 'Kartamdan pul ikki marta yechib olingan, menga mablag‘ni qaytarish kerak.'),
    P('Хочу написать жалобу, потому что сотрудница мне нахамила и отказалась помочь.', 'xachu napisat zhalobu patamu shto satrudnitsa mne naxamila i atkazalas pamoch', 'Shikoyat yozmoqchiman, chunki xodima menga qo‘pollik qildi va yordam berishdan bosh tortdi.'),
    P('Какие документы нужны, чтобы получить справку в МФЦ?', 'kakie dakumenty nuzhny shtoby paluchit spravku v em ef tse', 'MFCda ma’lumotnoma olish uchun qanday hujjatlar kerak?'),
    P('Ваша заявка принята, результат придёт на почту в течение пяти рабочих дней.', 'vasha zayafka prinyata rizultat pridyot na pochtu v techenie pyati rabochix dney', 'Arizangiz qabul qilindi, natija besh ish kuni ichida pochtaga keladi.'),
    P('Вам нужно заполнить анкету и приложить копию паспорта с миграционной картой.', 'vam nuzhna zapalnit anketu i prilazhit kopiyu pasparta s migratsionnoy kartay', 'Anketani to‘ldirishingiz va pasport nusxasini migratsion karta bilan ilova qilishingiz kerak.'),
    P('Подождите, пожалуйста, у вас в документах не хватает одной подписи.', 'padazhdite pazhalusta u vas v dakumentax ne xvataet adnoy patpisi', 'Iltimos, kuting, hujjatlaringizda bitta imzo yetishmayapti.'),
    P('Через приложение банка я могу заблокировать карту, если её украдут?', 'chiriz prilazhenie banka ya magu zablakirovat kartu yesli yeyo ukradut', 'Bank ilovasi orqali karta o‘g‘irlansa, uni bloklay olamanmi?'),
    P('Оплатите госпошлину в кассе или через мобильное приложение, квитанцию сохраните.', 'aplatite gasposhlinu f kasse ili chiriz mabilnaye prilazhenie kvitantsiyu saxranite', 'Davlat boji to‘lovini kassada yoki mobil ilova orqali to‘lang, kvitansiyani saqlang.'),
    P('Я звонил на горячую линию три раза, но проблему так и не решили.', 'ya zvanil na garyachuyu liniyu tri raza no problemu tak i ne rishili', 'Men ishonch telefoniga uch marta qo‘ng‘iroq qildim, lekin muammo hal qilinmadi.'),
    P('Банк обязан ответить на мою претензию письменно в течение тридцати дней.', 'bank abyazan atvetit na mayu pretenziyu pismenna v techenie tridtsati dney', 'Bank mening da’vomga o‘ttiz kun ichida yozma javob berishi shart.'),
    P('Можно оформить доверенность, чтобы документы получила моя жена вместо меня?', 'mozhna afarmit daverennast shtoby dakumenty paluchila maya zhena vmyesta minya', 'Hujjatlarni mening o‘rnimga xotinim olishi uchun ishonchnoma rasmiylashtirsa bo‘ladimi?')
  ],
  talk: [
    T('A','Добрый день, слушаю вас. Чем могу помочь?','dobry dyen slushayu vas chem magu pamoch','Xayrli kun, eshitaman. Qanday yordam bera olaman?'),
    T('B','Здравствуйте. Вчера с моей карты списали пять тысяч, а я ничего не покупал.','zdrastvuyte fchira s mayey karty spisali pyat tysyach a ya nichevo ne pakupal','Salom. Kecha kartamdan besh ming yechib olishdi, men esa hech narsa sotib olmaganman.'),
    T('A','Давайте проверим. Покажите, пожалуйста, паспорт и телефон с приложением.','davayte praverim pakazhite pazhalusta pasport i tilifon s prilazheniyem','Tekshiramiz. Iltimos, pasportingiz va ilovali telefoningizni ko‘rsating.'),
    T('B','Вот паспорт. Здесь видно, что операция прошла ночью, в другом городе.','vot pasport zdes vidna shto aperatsiya proshla nochyu v drugom garadye','Mana pasport. Bu yerda ko‘rinib turibdi, operatsiya tunda, boshqa shaharda o‘tgan.'),
    T('A','Понятно. Карту сейчас заблокируем, а вам нужно написать заявление о спорной операции.','panyatna kartu sichas zablakiruyem a vam nuzhna napisat zayavlenie a spornoy aperatsii','Tushunarli. Kartani hozir bloklaymiz, sizga esa bahsli operatsiya haqida ariza yozish kerak.'),
    T('B','А деньги вернут? И сколько времени это займёт?','a dengi virnut i skolka vremeni eta zaymyot','Pulni qaytarishadimi? Bu qancha vaqt oladi?'),
    T('A','Обычно рассматривают до тридцати дней, но чаще быстрее. Вот бланк.','abychna rassmatrivayut da tridtsati dney no chashe bystree vot blank','Odatda o‘ttiz kungacha ko‘rib chiqiladi, lekin ko‘pincha tezroq. Mana blank.'),
    T('B','Хорошо, заполню сейчас. А новую карту можно получить сегодня?','xarasho zapalnyu sichas a novuyu kartu mozhna paluchit sivodnya','Yaxshi, hozir to‘ldiraman. Yangi kartani bugun olsa bo‘ladimi?')
  ]
});

LESSONS.push({ id: 'b1b-04', type: 'P', sec: 10, title: 'Sog‘liq batafsil va sug‘urta', sub: 'Здоровье: полис, анализы, рецепт',
  intro: 'Poliklinikada va shifoxonada ko‘p so‘raladigan so‘zlar:\nполис — sug‘urta polisi (ОМС — majburiy, ДМС — ixtiyoriy); анализы — tahlillar; рецепт — retsept; диагноз — tashxis.\nбольничный — kasallik varaqasi; натощак — och qoringa.\nIbora: «На что жалуетесь?» — nimadan shikoyat qilasiz?',
  items: [
    P('Покажите, пожалуйста, ваш полис ОМС и паспорт в регистратуре.', 'pakazhite pazhalusta vash polis o em es i pasport v registrature', 'Iltimos, registraturada sug‘urta polisingiz va pasportingizni ko‘rsating.'),
    P('Врач назначил мне анализы крови и мочи на завтрашнее утро.', 'vrach naznachil mne analizy krovi i machi na zaftrashnee utro', 'Shifokor menga ertaga ertalabga qon va siydik tahlillarini buyurdi.'),
    P('Сдавать кровь нужно натощак, то есть ничего не есть двенадцать часов.', 'sdavat krov nuzhna natashak ta yest nichevo ne yest dvinadtsat chasof', 'Qonni och qoringa topshirish kerak, ya’ni o‘n ikki soat hech narsa yemaslik.'),
    P('Доктор поставил диагноз и выписал мне рецепт на антибиотики.', 'daktar pastavil diagnaz i vypisal mne ritsept na antibiotiki', 'Shifokor tashxis qo‘ydi va menga antibiotiklarga retsept yozib berdi.'),
    P('Это лекарство нужно принимать три раза в день после еды.', 'eta likarstva nuzhna prinimat tri raza v dyen posle yedy', 'Bu dorini kuniga uch marta ovqatdan keyin ichish kerak.'),
    P('У меня аллергия на пенициллин, поэтому мне его нельзя.', 'u minya allergiya na pinitsillin paetamu mne yevo nilzya', 'Menda penitsillinga allergiya bor, shuning uchun menga uni mumkin emas.'),
    P('С таким полисом можно бесплатно записаться к терапевту в поликлинике.', 's takim polisam mozhna bisplatna zapisatsya k tirapevtu v paliklinike', 'Bunday polis bilan poliklinikada terapevtga bepul yozilsa bo‘ladi.'),
    P('Если нет полиса, можно оформить добровольное медицинское страхование, ДМС.', 'yesli net polisa mozhna afarmit dabravolnaye miditsinskaye straxavanie de em es', 'Polis bo‘lmasa, ixtiyoriy tibbiy sug‘urta, ya’ni DMS rasmiylashtirsa bo‘ladi.', 'Ko‘chada ko‘pincha: «добровольная страховка».'),
    P('Страховая компания оплатит лечение, если случай признают страховым.', 'straxovaya kampaniya aplatit lechenie yesli sluchay priznayut straxovym', 'Sug‘urta kompaniyasi holat sug‘urta hodisasi deb topilsa, davolanishni to‘laydi.'),
    P('Мне нужен больничный лист, у меня температура уже третий день.', 'mne nuzhen balnichny list u minya timperatura uzhe tretiy dyen', 'Menga kasallik varaqasi kerak, haroratim uchinchi kundan beri bor.', 'Ko‘chada ko‘pincha: «больничный».'),
    P('Врач направил меня на рентген и к узкому специалисту.', 'vrach napravil minya na rentgen i k uzkamu spetsialistu', 'Shifokor meni rentgenga va tor mutaxassisga yo‘lladi.'),
    P('Результаты анализов будут готовы через два дня, придут на почту.', 'rizultaty analizaf budut gatovy chiriz dva dnya pridut na pochtu', 'Tahlil natijalari ikki kunda tayyor bo‘ladi, pochtaga keladi.'),
    P('Ничего серьёзного нет, просто нужно больше отдыхать и пить воду.', 'nichevo siryoznava net prosta nuzhna bolshe atdyxat i pit vodu', 'Jiddiy narsa yo‘q, shunchaki ko‘proq dam olib, suv ichish kerak.'),
    P('Скорую вызывайте сразу, если боль сильная или тяжело дышать.', 'skoruyu vyzyvayte srazu yesli bol silnaya ili tyazhelo dyshat', 'Og‘riq kuchli bo‘lsa yoki nafas olish qiyin bo‘lsa, tez yordamni darrov chaqiring.', 'Tez yordam raqami: 103 (mobilda 112).')
  ],
  talk: [
    T('A','Добрый день, проходите. На что жалуетесь?','dobry dyen praxodite na shto zhaluetis','Xayrli kun, kiring. Nimadan shikoyat qilasiz?'),
    T('B','Здравствуйте, доктор. Третий день болит горло, и температура тридцать восемь.','zdrastvuyte daktar tretiy dyen balit gorla i timperatura tridtsat vosim','Salom, shifokor. Uch kundan beri tomog‘im og‘riyapti, harorat o‘ttiz sakkiz.'),
    T('A','Откройте рот. Горло красное. Полис и паспорт у вас с собой?','atkroyte rot gorla krasnaye polis i pasport u vas s saboy','Og‘zingizni oching. Tomoq qizargan. Polis va pasport yoningizdami?'),
    T('B','Да, вот полис ОМС и паспорт. У меня аллергия на пенициллин.','da vot polis o em es i pasport u minya allergiya na pinitsillin','Ha, mana polis va pasport. Menda penitsillinga allergiya bor.'),
    T('A','Хорошо, что сказали. Выпишу другой антибиотик и направлю на анализ крови.','xarasho shto skazali vypishu drugoy antibiotik i napravlyu na analiz krovi','Aytganingiz yaxshi bo‘ldi. Boshqa antibiotik yozaman va qon tahliliga yuboraman.'),
    T('B','А как принимать лекарство и на сколько дней вы дадите больничный?','a kak prinimat likarstva i na skolka dney vy dadite balnichny','Dorini qanday ichaman va kasallik varaqasini necha kunga berasiz?'),
    T('A','Два раза в день после еды, больничный на неделю. Оформим сегодня.','dva raza v dyen posle yedy balnichny na nidelyu afarmim sivodnya','Kuniga ikki marta ovqatdan keyin, varaqa bir haftaga. Bugun rasmiylashtiramiz.'),
    T('B','Спасибо, доктор. Когда мне прийти на повторный приём?','spasibo daktar kagda mne priyti na paftorny priyom','Rahmat, shifokor. Takroriy qabulga qachon kelishim kerak?')
  ]
});

LESSONS.push({ id: 'b1b-05', type: 'P', sec: 10, title: 'Qo‘shnilar, uy egasi, ijara muammolari', sub: 'Соседи, хозяин, аренда',
  intro: 'Ijara va qo‘shnilar bilan muammolar:\nшум — shovqin; залив — suv bosish; депозит / залог — garov puli; коммуналка — kommunal to‘lovlar; счётчик — hisoblagich.\nХозяин — uy egasi; съёмщик — ijarachi.\nMuammoni muloyim, lekin aniq ayt: «Прошу вас...»',
  items: [
    P('Соседи сверху шумят после одиннадцати вечера, спать совершенно невозможно.', 'sasedi sverxu shumyat posle adinnatsati vechira spat savirshenna nivazmozhna', 'Yuqoridagi qo‘shnilar kechqurun soat o‘n birdan keyin shovqin qilishadi, uxlab bo‘lmaydi.'),
    P('Вы нас залили, у меня в ванной вода течёт с потолка.', 'vy nas zalili u minya v vannay vada tichyot s patolka', 'Siz bizni suv bosdingiz, hammomimda shiftdan suv oqyapti.'),
    P('Позвоните, пожалуйста, в управляющую компанию, пусть пришлют сантехника сегодня.', 'pazvanite pazhalusta v upravlyayushuyu kampaniyu pust prishlyut santexnika sivodnya', 'Iltimos, boshqaruv kompaniyasiga qo‘ng‘iroq qiling, bugun santexnik yuborishsin.'),
    P('Хозяин квартиры обещал вернуть депозит при выезде, если всё будет в порядке.', 'xazyain kvartiry abishal virnut dipazit pri vyyezde yesli vsyo budet v paryadke', 'Uy egasi chiqib ketayotganda hammasi joyida bo‘lsa, depozitni qaytarishga va’da berdi.'),
    P('Депозит вернули не полностью, вычли за разбитое окно и испорченные обои.', 'dipazit virnuli ne palnostyu vychli za razbitaye akno i isporchennye abai', 'Depozit to‘liq qaytarilmadi, singan deraza va buzilgan oboy uchun ushlab qolishdi.'),
    P('Коммуналка приходит каждый месяц, свет и воду платим по счётчикам.', 'kamunalka prixodit kazhdy myesyats svyet i vodu platim pa shotchikam', 'Kommunal to‘lov har oy keladi, yorug‘lik va suvni hisoblagich bo‘yicha to‘laymiz.', 'Ko‘chada ko‘pincha: «коммуналка», rasmiy: «коммунальные услуги».'),
    P('Не забудь передать показания счётчиков до двадцать пятого числа.', 'ne zabud piridat pakazaniya shotchikaf da dvadtsat pyatava chisla', 'Hisoblagich ko‘rsatkichlarini yigirma beshinchi sanagacha topshirishni unutma.'),
    P('Мы платим за квартиру пятого числа, а коммунальные услуги отдельно.', 'my platim za kvartiru pyatava chisla a kamunalnye uslugi atdyelna', 'Biz kvartira uchun beshinchi kuni to‘laymiz, kommunal xizmatlar esa alohida.'),
    P('Договор аренды подписали на год, расторгнуть можно, предупредив за месяц.', 'dagavor arendy padpisali na god rastorgnut mozhna pridupridiv za myesyats', 'Ijara shartnomasi bir yilga imzolangan, bir oy oldin ogohlantirib bekor qilsa bo‘ladi.'),
    P('Батареи еле тёплые, в квартире холодно, а хозяин трубку не берёт.', 'batarei yele tyoplye v kvartire xolodna a xazyain trubku ne beryot', 'Batareyalar zo‘rg‘a iliq, kvartira sovuq, uy egasi esa telefonni ko‘tarmayapti.'),
    P('Давайте составим акт о состоянии квартиры при въезде, с фотографиями.', 'davayte sastavim akt a sastayanii kvartiry pri vyezde s fatagrafiyami', 'Kirishda kvartira holati haqida fotosuratlar bilan dalolatnoma tuzaylik.'),
    P('Когда вы вернёте мне залог, если я съеду в субботу?', 'kagda vy virnyote mne zalok yesli ya syedu f subotu', 'Shanba kuni ko‘chib chiqsam, garov pulimni qachon qaytarasiz?'),
    P('Если соседи продолжат шуметь, я вызову участкового и напишу заявление.', 'yesli sasedi pradalzhat shumet ya vyzavu uchastkavava i napishu zayavlenie', 'Qo‘shnilar shovqin qilishda davom etsa, uchastkavoyni chaqiraman va ariza yozaman.'),
    P('В договоре написано, что без разрешения хозяина нельзя пускать жильцов.', 'v dagavore napisana shto bis razrisheniya xazyaina nilzya puskat zhiltsof', 'Shartnomada uy egasining ruxsatisiz yashovchilarni kiritish mumkin emasligi yozilgan.')
  ],
  talk: [
    T('A','Алло, Сергей Иванович, добрый вечер. У нас в ванной течёт с потолка.','alo sirgey ivanavich dobry vyechir u nas v vanay tichyot s patolka','Allo, Sergey Ivanovich, xayrli kech. Bizning hammomda shiftdan suv oqyapti.'),
    T('B','Здравствуйте. Наверное, соседи сверху залили. Вы с ними говорили?','zdrastvuyte navernoye sasedi sverxu zalili vy s nimi gavarili','Salom. Ehtimol, yuqoridagi qo‘shnilar bosgandir. Ular bilan gaplashdingizmi?'),
    T('A','Звонил в дверь, никто не открыл. Вода уже капает на пол.','zvanil v dver nikto ne atkryl vada uzhe kapaet na pol','Eshikni qo‘ng‘iroq qildim, hech kim ochmadi. Suv allaqachon polga tomyapti.'),
    T('B','Понял. Вызовите аварийную службу, я сам приеду через час.','ponyal vyzovite avariynuyu sluzhbu ya sam priyedu chiriz chas','Tushundim. Avariya xizmatini chaqiring, men o‘zim bir soatda yetib boraman.'),
    T('A','Хорошо. И ещё: показания счётчиков я передал, а коммуналку оплачу завтра.','xarasho i yeshyo pakazaniya shotchikaf ya piridal a kamunalku aplachu zaftra','Yaxshi. Yana: hisoblagich ko‘rsatkichlarini topshirdim, kommunalni ertaga to‘layman.'),
    T('B','Ладно. А по депозиту не переживайте, залив — не ваша вина.','ladna a pa dipazitu ne pirizhivayte zaliv ne vasha vina','Mayli. Depozit haqida xavotir olmang, suv bosishi sizning aybingiz emas.'),
    T('A','Спасибо. Тогда сфотографирую повреждения для акта.','spasibo tagda sfatagrafiruyu pavrezhdeniya dlya akta','Rahmat. Unda dalolatnoma uchun shikastlanishlarni suratga olaman.'),
    T('B','Правильно, отправьте мне фото, и я свяжусь с управляющей компанией.','pravilna atpravte mne foto i ya svyazhus s upravlyayushey kampaniyey','To‘g‘ri, menga suratni yuboring, men boshqaruv kompaniyasi bilan bog‘lanaman.')
  ]
});

LESSONS.push({ id: 'b1b-06', type: 'P', sec: 10, title: 'Hikoya qilish', sub: 'Рассказать, что случилось',
  intro: 'Hikoya boshlash: «Слушай, что вчера было!», «Представляешь...»\nBog‘lash: и тут, потом, в общем, короче, в итоге.\nKutilmagan voqea: «оказалось, что...» — ma’lum bo‘ldiki...\nXulosa: «главное, что...» — asosiysi...',
  items: [
    P('Слушай, ты не поверишь, что вчера со мной было!', 'slushay ty ne pavirish shto fchira so mnoy bylo', 'Eshit, ishonmaysan, kecha menga nima bo‘ldi!'),
    P('Представляешь, еду я утром на работу, а автобуса всё нет.', 'pridstavlyaesh yedu ya utram na rabotu a aftobusa vsyo net', 'Tasavvur qil, ertalab ishga ketyapman, avtobus esa hamon yo‘q.'),
    P('И тут ко мне подходит какой-то мужчина и спрашивает дорогу.', 'i tut ka mne padxodit kakoy ta mushina i sprashivaet daragu', 'Shu payt oldimga bir erkak kelib, yo‘lni so‘radi.'),
    P('Оказалось, что он тоже из Ташкента, мы сразу разговорились.', 'akazalas shto on tozhe iz tashkenta my srazu razgavarilis', 'Ma’lum bo‘ldiki, u ham Toshkentdan ekan, darrov gaplashib ketdik.'),
    P('В общем, я опоздал на сорок минут, и начальник был в бешенстве.', 'v opshem ya apazdal na sorok minut i nachalnik byl v bishenstve', 'Xullas, qirq daqiqa kechikdim va boshliq g‘azabda edi.', 'Ko‘chada ko‘pincha: «в общем» o‘rniga «короче».'),
    P('Короче, он накричал на меня, а потом вдруг сам извинился.', 'karoche on nakrichal na minya a potom vdruk sam izvinilsya', 'Qisqasi, u menga baqirdi, keyin birdan o‘zi uzr so‘radi.'),
    P('А я ему говорю: «Да ладно, со всеми бывает».', 'a ya yimu gavaryu da ladna sa vsemi byvaet', 'Men unga aytaman: «Mayli-da, hammada bo‘ladi».'),
    P('Кстати, ты не знаешь, во сколько завтра открывается почта?', 'kstati ty ne znaesh va skolka zaftra atkryvaetsya pochta', 'Aytgancha, ertaga pochta soat nechada ochilishini bilmaysanmi?'),
    P('Я сначала растерялся, а потом понял, что это просто шутка.', 'ya snachala rastiryalsya a potom ponyal shto eta prosta shutka', 'Avval sarosimaga tushdim, keyin bu shunchaki hazil ekanini tushundim.'),
    P('Самое смешное, что он потом оказался нашим новым директором.', 'samaye smishnoye shto on potom akazalsya nashim novym diriktaram', 'Eng kulgilisi, u keyin bizning yangi direktorimiz bo‘lib chiqdi.'),
    P('Ну и вот, в итоге мы вместе пообедали и подружились.', 'nu i vot v itoge my vmyeste paabedali i padruzhilis', 'Xullas, oxiri birga tushlik qildik va do‘st bo‘lib qoldik.'),
    P('Главное, что всё закончилось хорошо, а я ещё и премию получил.', 'glavnaye shto vsyo zakonchilos xarasho a ya yeshyo i premiyu paluchil', 'Asosiysi, hammasi yaxshi tugadi, ustiga-ustak mukofot ham oldim.', 'Ayol aytsa: «получила».'),
    P('Погоди, я не договорил, это ещё не самое интересное!', 'pagadi ya ne dagavaril eta yeshyo ne samaye interesnaye', 'Kutib tur, gapimni tugatmadim, bu hali eng qiziq joyi emas!'),
    P('Ты чего, не веришь? Хочешь, покажу фотографию, я даже снял!', 'ty chevo ne verish xachesh pakazhu fatagrafiyu ya dazhe snyal', 'Nima, ishonmayapsanmi? Xohlasang, suratni ko‘rsataman, hatto suratga ham oldim!')
  ],
  talk: [
    T('A','Слушай, что вчера было! Иду домой, а у подъезда сидит кот.','slushay shto fchira bylo idu damoy a u padyezda sidit kot','Eshit, kecha nima bo‘ldi! Uyga ketyapman, kirish eshigi oldida mushuk o‘tiribdi.'),
    T('B','И что? Кот как кот. Ничего необычного.','i shto kot kak kot nichevo nibychnava','Nima bo‘pti? Mushuk — mushuk-da. G‘ayrioddiy narsa yo‘q.'),
    T('A','Подожди. Оказалось, это кот соседки, она его уже два дня искала.','padazhdi akazalas eta kot sasedki ana yevo uzhe dva dnya iskala','Kutib tur. Ma’lum bo‘ldiki, bu qo‘shni ayolning mushugi, u ikki kundan beri qidirayotgan ekan.'),
    T('B','Ничего себе! И ты его вернул?','nichevo sibye i ty yevo virnul','Voy-bo‘! Va sen uni qaytardingmi?'),
    T('A','В общем, позвонил в дверь, она аж расплакалась от радости.','v opshem pazvanil v dver ana azh rasplakalas at radasti','Xullas, eshikni qo‘ng‘iroq qildim, u quvonchdan yig‘lab yubordi.'),
    T('B','Представляю, как она переживала. А дальше что?','pridstavlyayu kak ana pirizhivala a dalshe shto','Qanchalik xavotirda bo‘lganini tasavvur qilaman. Keyin-chi?'),
    T('A','В итоге она угостила меня пловом, настоящим, как дома.','v itoge ana ugastila minya plovam nastoyashim kak doma','Oxirida u meni palov bilan mehmon qildi, uydagidek haqiqiy palov.'),
    T('B','Вот это история! Главное, что кот нашёлся.','vot eta istoriya glavnaye shto kot nashalsya','Mana bu voqea! Asosiysi, mushuk topildi.')
  ]
});

LESSONS.push({ id: 'b1b-07', type: 'P', sec: 10, title: 'His-tuyg‘u va munosabatlar', sub: 'Чувства и отношения',
  intro: 'His-tuyg‘ularni ayt:\nскучать по кому — kimnidir sog‘inmoq; переживать — xavotir olmoq; обидеться на кого — xafa bo‘lmoq.\nпоссориться — janjallashmoq; помириться — yarashmoq; извиниться — uzr so‘ramoq.\nIbora: «Не злись на меня».',
  items: [
    P('Я очень скучаю по семье, особенно по маме и сестре.', 'ya ochin skuchayu pa simye asobenna pa mame i sistrye', 'Men oilamni juda sog‘inaman, ayniqsa onam va opamni.'),
    P('Не переживай, всё обязательно будет хорошо, я тебе обещаю.', 'ne pirizhivay vsyo abyazatelna budet xarasho ya tibye abishayu', 'Xavotir olma, hammasi albatta yaxshi bo‘ladi, va’da beraman.'),
    P('Я так переживаю за экзамен, что вторую ночь не сплю.', 'ya tak pirizhivayu za ekzamen shto vtoruyu noch ne splyu', 'Imtihondan shunchalik xavotirdaman-ki, ikkinchi tun uxlamayapman.'),
    P('Он на меня обиделся, потому что я забыл поздравить его.', 'on na minya abidelsya patamu shto ya zabyl pazdravit yevo', 'U mendan xafa bo‘ldi, chunki uni tabriklashni unutdim.'),
    P('Мы с ней поссорились из-за ерунды и теперь не разговариваем.', 'my s ney passorilis iz za yirundy i tipir ne razgavarivaem', 'Biz u bilan arzimas narsa uchun janjallashdik va endi gaplashmaymiz.'),
    P('Я первым позвонил и извинился, и мы помирились.', 'ya pyervym pazvanil i izvinilsya i my pamirilis', 'Men birinchi bo‘lib qo‘ng‘iroq qilib uzr so‘radim va yarashdik.'),
    P('Мне очень обидно, что ты даже не спросил, как я себя чувствую.', 'mne ochin abidna shto ty dazhe ne sprasil kak ya sibya chustvuyu', 'O‘zimni qanday his qilayotganimni so‘ramaganing menga juda alam qiladi.'),
    P('Я тебя понимаю, на твоём месте я бы тоже расстроился.', 'ya tibya panimayu na tvayom myeste ya by tozhe rasstroilsya', 'Seni tushunaman, sening o‘rningda men ham xafa bo‘lardim.', 'Ayol aytsa: «расстроилась».'),
    P('Не злись на меня, я правда не хотел тебя обидеть.', 'ne zlis na minya ya pravda ne xatel tibya abidet', 'Mendan jahling chiqmasin, rostdan ham seni xafa qilmoqchi emasdim.'),
    P('Мне одиноко в чужом городе, хочется просто поговорить с кем-нибудь.', 'mne adinoka v chuzhom garadye xachetsya prosta pagavarit s kem nibud', 'Begona shaharda o‘zimni yolg‘iz his qilaman, shunchaki kimdir bilan gaplashgim keladi.'),
    P('Я так рад за тебя, ты это заслужил своим трудом!', 'ya tak rat za tibya ty eta zasluzhil svaim trudam', 'Men sen uchun juda xursandman, bunga o‘z mehnating bilan erishding!'),
    P('Давай не будем ссориться, мы же друзья и столько прошли вместе.', 'davay ne budem ssoritsa my zhe druzya i stolka prashli vmyeste', 'Janjallashmaylik, axir biz do‘stmiz va birga juda ko‘p narsani boshdan kechirdik.'),
    P('Мне стыдно за то, что я вчера так грубо с тобой говорил.', 'mne stydna za ta shto ya fchira tak gruba s taboy gavaril', 'Kecha sen bilan shunday qo‘pol gaplashganim uchun uyalaman.'),
    P('Ты меня очень поддержал, без тебя я бы не справился.', 'ty minya ochin paddirzhal bis tibya ya by ne spravilsya', 'Sen meni juda qo‘llab-quvvatlading, sensiz uddalay olmasdim.', 'Ayol aytsa: «справилась».')
  ],
  talk: [
    T('A','Привет! Ты какой-то грустный сегодня, что случилось?','privyet ty kakoy ta grustny sivodnya shto sluchilos','Salom! Bugun qandaydir xafasan, nima bo‘ldi?'),
    T('B','Да так, скучаю по дому, вчера долго разговаривал с мамой по видео.','da tak skuchayu pa domu fchira dolga razgavarival s mamoy pa vidio','Shunchaki, uyni sog‘indim, kecha onam bilan video orqali uzoq gaplashdim.'),
    T('A','Понимаю тебя. Я в первый год тоже очень сильно скучал.','panimayu tibya ya v pervy god tozhe ochin silna skuchal','Tushunaman. Men ham birinchi yili juda qattiq sog‘inganman.'),
    T('B','Ещё и с Рустамом поссорились, он обиделся на мои слова.','yeshyo i s rustamam passorilis on abidelsya na mai slava','Yana Rustam bilan janjallashdik, u gaplarimdan xafa bo‘ldi.'),
    T('A','Из-за чего? Может, лучше позвонить ему и помириться?','iz za chevo mozhet luchshe pazvanit yemu i pamiritsa','Nima uchun? Balki unga qo‘ng‘iroq qilib yarashgan yaxshidir?'),
    T('B','Боюсь, он не захочет разговаривать, мне так стыдно.','baysya on ne zaxochet razgavarivat mne tak stydna','Qo‘rqaman, u gaplashishni xohlamaydi, menga juda uyat.'),
    T('A','Не переживай, он отходчивый. Позвони, извинись, и всё наладится.','ne pirizhivay on atxodchivy pazvani izvinis i vsyo naladitsa','Xavotir olma, u tez qaytadi. Qo‘ng‘iroq qil, uzr so‘ra, hammasi joyiga tushadi.'),
    T('B','Спасибо, что выслушал. Ты настоящий друг.','spasibo shto vyslushal ty nastayashy druk','Tinglaganing uchun rahmat. Sen haqiqiy do‘stsan.')
  ]
});

LESSONS.push({ id: 'b1b-08', type: 'P', sec: 10, title: 'Internet, ijtimoiy tarmoq, yangiliklar', sub: 'Интернет, соцсети и новости',
  intro: 'Internet tili juda jonli:\nскинуть ссылку — havolani tashlab yubormoq; голосовое — ovozli xabar; подписаться — obuna bo‘lmoq.\nфейк — soxta xabar; скриншот — ekran surati.\nIbora: «Не верь всему, что пишут».',
  items: [
    P('Скинь мне ссылку на это видео, я потом посмотрю.', 'skin mne ssylku na eta vidio ya potom pasmatryu', 'Menga shu videoning havolasini tashlab yubor, keyin ko‘raman.', 'Rasmiy: «отправь ссылку».'),
    P('Я тебе отправил голосовое, послушай, когда будет время.', 'ya tibye atpravil galasavoye paslushay kagda budet vremya', 'Senga ovozli xabar yubordim, vaqting bo‘lganda eshit.'),
    P('Подпишись на мой канал, там каждый день новые ролики.', 'patpishis na moy kanal tam kazhdy dyen novye raliki', 'Mening kanalimga obuna bo‘l, u yerda har kuni yangi roliklar bor.'),
    P('Раздай мне вайфай, пожалуйста, у меня закончился мобильный интернет.', 'razday mne vayfay pazhalusta u minya zakonchilsya mabilny intirnet', 'Iltimos, menga wifi tarqat, mobil internetim tugab qoldi.'),
    P('Это фейк, я проверил, такой новости нигде нет.', 'eta feyk ya pravyeril takoy navosti nigdye net', 'Bu soxta xabar, tekshirdim, bunday yangilik hech qayerda yo‘q.'),
    P('Не верь всему, что пишут в интернете, сначала проверяй источник.', 'ne ver vsemu shto pishut v intirnete snachala pravyaray istochnik', 'Internetda yozilgan hamma narsaga ishonma, avval manbani tekshir.'),
    P('Выложи фото в сторис и отметь меня, пожалуйста.', 'vylazhi foto v storis i atmet minya pazhalusta', 'Suratni storisga joylab, meni belgilab qo‘y, iltimos.'),
    P('Напиши мне в мессенджере, а то звонки у меня не проходят.', 'napishi mne v misindzhere a to zvonki u minya ne praxodyat', 'Menga messenjerda yoz, bo‘lmasa qo‘ng‘iroqlar menga o‘tmayapti.'),
    P('Я отключил уведомления в чате, потому что там слишком много сообщений.', 'ya atklyuchil uvidamleniya v chate patamu shto tam slishkam mnoga saabsheniy', 'Chatdagi bildirishnomalarni o‘chirdim, chunki u yerda xabarlar juda ko‘p.'),
    P('Вчера в новостях сказали, что завтра ожидается сильный снегопад.', 'fchira v novastyax skazali shto zaftra azhidaetsya silny snigapad', 'Kecha yangiliklarda ertaga kuchli qor yog‘ishi kutilayotganini aytishdi.'),
    P('Сделай скриншот и перешли его мне, я сам разберусь.', 'sdelay skrinshot i pirishli yevo mne ya sam razbirus', 'Ekran suratini olib, menga jo‘nat, o‘zim tushunib olaman.'),
    P('Интернет-магазин обманул меня: заказ не пришёл, а деньги списали.', 'intirnet magazin abmanul minya zakaz ne prishol a dengi spisali', 'Internet-do‘kon meni aldadi: buyurtma kelmadi, pul esa yechib olindi.'),
    P('Берегись мошенников: никому не называй код из смс и пароль.', 'birigis mashennikaf nikamu ne nazyvay kod is esemes i parol', 'Firibgarlardan ehtiyot bo‘l: smsdagi kodni va parolni hech kimga aytma.'),
    P('Мне пришло странное сообщение со ссылкой, я не стал открывать.', 'mne prishlo strannaye saabshenie so ssylkoy ya ne stal atkryvat', 'Menga havolali g‘alati xabar keldi, men ochmadim.')
  ],
  talk: [
    T('A','Ты видел новость про закрытие метро в воскресенье?','ty vidil navost pra zakrytie mitro v vaskrisenye','Yakshanba kuni metro yopilishi haqidagi yangilikni ko‘rdingmi?'),
    T('B','Нет, где написали? Скинь ссылку, пожалуйста.','net gdye napisali skin ssylku pazhalusta','Yo‘q, qayerda yozishibdi? Havolani tashlab yubor, iltimos.'),
    T('A','Сейчас. Хотя подожди, это, кажется, фейк, в официальной группе ничего нет.','sichas xatya padazhdi eta kazhetsya feyk v afitsialnoy gruppe nichevo net','Hozir. Yo‘q, kutib tur, bu soxta bo‘lsa kerak, rasmiy guruhda hech narsa yo‘q.'),
    T('B','Надо проверить. Подпишись на их канал, там всегда быстро пишут.','nada pravirit patpishis na ix kanal tam vsigda bystra pishut','Tekshirish kerak. Ularning kanaliga obuna bo‘l, u yerda doim tez yozishadi.'),
    T('A','Уже подписан. Вот, они опровергли, никакого закрытия не будет.','uzhe patpisan vot ani aprovergli nikakova zakrytiya ne budet','Allaqachon obunaman. Mana, ular rad etishibdi, hech qanday yopilish bo‘lmaydi.'),
    T('B','Фух, а то я уже хотел ехать на автобусе. Пришли мне скриншот.','fux a to ya uzhe xatel yexat na aftobuse prishli mne skrinshot','Uf, bo‘lmasa avtobusda ketmoqchi edim. Menga ekran suratini yubor.'),
    T('A','Отправил. Кстати, я записал тебе голосовое, а оно не дошло.','atpravil kstati ya zapisal tibye galasavoye a ano ne dashlo','Yubordim. Aytgancha, senga ovozli xabar yozgandim, u yetib bormabdi.'),
    T('B','Наверное, интернет плохой. Напиши лучше в мессенджере.','navernoye intirnet plaxoy napishi luchshe v misindzhere','Ehtimol, internet yomon. Yaxshisi, messenjerda yoz.')
  ]
});

LESSONS.push({ id: 'b1b-d1', type: 'D', sec: 10, title: 'Suhbat: ish suhbati', sub: 'Диалог · Собеседование',
  items: [
    D('Расскажите немного о себе и о том, откуда вы приехали.', 'rasskazhite nimnoga a sibye i a tom atkuda vy priyexali', 'O‘zingiz haqingizda va qayerdan kelganingiz haqida ozgina gapirib bering.',
      'Я приехал из Самарканда два года назад и живу в Москве с семьёй.', 'ya priyexal iz samarkanda dva goda nazat i zhivu v maskve s simyoy', 'Men Samarqanddan ikki yil oldin kelganman va Moskvada oilam bilan yashayman.'),
    D('Почему вы хотите работать именно в нашей компании?', 'pachemu vy xatite rabotat imenna v nashey kampanii', 'Nega aynan bizning kompaniyada ishlamoqchisiz?',
      'Мне нравится, что у вас стабильный график и есть возможность расти.', 'mne nravitsya shto u vas stabilny grafik i yest vazmozhnast rasti', 'Menga sizda grafik barqaror va o‘sish imkoniyati borligi yoqadi.'),
    D('Какие у вас сильные стороны, и в чём вы слабее?', 'kakie u vas silnye starony i v chyom vy slabye', 'Kuchli tomonlaringiz qanday va nimada kuchsizroqsiz?',
      'Я ответственный и быстро учусь, но писать по-русски мне пока трудно.', 'ya atvetstvenny i bystra uchus no pisat pa russki mne paka trudna', 'Men mas’uliyatliman va tez o‘rganaman, lekin ruscha yozish hozircha qiyin.'),
    D('Какую зарплату вы ожидаете и готовы ли начать с испытательного срока?', 'kakuyu zarplatu vy azhidaete i gatovy li nachat s ispytatelnava sroka', 'Qancha maosh kutasiz va sinov muddatidan boshlashga tayyormisiz?',
      'Я рассчитываю на семьдесят тысяч, но готов обсудить после испытательного срока.', 'ya rashitivayu na simdisyat tysyach no gatof absudit posle ispytatelnava sroka', 'Yetmish mingga umid qilaman, lekin sinov muddatidan keyin muhokama qilishga tayyorman.'),
    D('У вас есть разрешение на работу или патент?', 'u vas yest razreshenie na rabotu ili patent', 'Sizda ish uchun ruxsatnoma yoki patent bormi?',
      'Да, патент действует ещё восемь месяцев, и я продлю его вовремя.', 'da patent dyeystvuet yeshyo vosim myesyatsef i ya pradlyu yevo vavremya', 'Ha, patent yana sakkiz oy amal qiladi va uni o‘z vaqtida uzaytiraman.', 'Patent muddati tugashidan oldin to‘lovni unutmang.'),
    D('Вы готовы иногда работать по выходным и в вечернюю смену?', 'vy gatovy inogda rabotat pa vyxadnym i v vechirnyuyu smenu', 'Ba’zan dam olish kunlari va kechki smenada ishlashga tayyormisiz?',
      'Да, если предупредят заранее и оплатят переработку, то без проблем.', 'da yesli pridupridyat zaranie i aplatyat pirirabotku ta bis problem', 'Ha, oldindan ogohlantirib, qo‘shimcha ishni to‘lashsa, muammo yo‘q.'),
    D('Как вы решаете конфликты, если коллега с вами не согласен?', 'kak vy rishaete kanflikty yesli kalyega s vami ne saglasen', 'Hamkasbingiz siz bilan rozi bo‘lmasa, nizolarni qanday hal qilasiz?',
      'Я спокойно выслушиваю и пытаюсь найти решение, которое подойдёт обоим.', 'ya spakoyna vyslushivayu i pytayus nayti rishenie katoraye padoydyot abaim', 'Men xotirjam tinglayman va ikkalamizga ham mos yechim topishga harakat qilaman.'),
    D('Где вы видите себя через пять лет работы в России?', 'gdye vy vidite sibya chiriz pyat let raboty v rassii', 'Rossiyada besh yildan keyin o‘zingizni qayerda ko‘rasiz?',
      'Хочу стать бригадиром, получить гражданство и купить квартиру для семьи.', 'xachu stat brigadiram paluchit grazhdanstva i kupit kvartiru dlya simyi', 'Brigadir bo‘lishni, fuqarolik olishni va oila uchun kvartira sotib olishni xohlayman.'),
    D('Есть ли у вас вопросы к нам, прежде чем мы закончим?', 'yest li u vas vaprosy k nam prezhde chem my zakonchim', 'Tugatishdan oldin bizga savollaringiz bormi?',
      'Да, подскажите, пожалуйста, когда будет известно решение и кто мой начальник?', 'da patskazhite pazhalusta kagda budet izvestna rishenie i kto moy nachalnik', 'Ha, iltimos, qaror qachon ma’lum bo‘ladi va mening boshlig‘im kim?'),
    D('Когда вы сможете приступить к работе, если мы вас возьмём?', 'kagda vy smozhete pristupit k rabote yesli my vas vazmyom', 'Agar sizni olsak, qachon ishga kirisha olasiz?',
      'Смогу выйти через неделю, мне нужно только уволиться с прежнего места.', 'smogu vyyti chiriz nyedilyu mne nuzhna tolka uvolitsa s prezhnyava mesta', 'Bir haftadan keyin chiqa olaman, faqat oldingi ish joyimdan ketishim kerak.')
  ]
});

LESSONS.push({ id: 'b1b-d2', type: 'D', sec: 10, title: 'Suhbat: idora va bankda muammo', sub: 'Диалог · Решаем проблему',
  items: [
    D('Здравствуйте, что у вас случилось и чем я могу помочь?', 'zdrastvuyte shto u vas sluchilos i chem ya magu pamoch', 'Salom, sizda nima bo‘ldi va qanday yordam bera olaman?',
      'Мою карту заблокировали вчера, а мне срочно нужно отправить деньги семье.', 'mayu kartu zablakirovali fchira a mne srochna nuzhna atpravit dengi simye', 'Kartamni kecha bloklashdi, menga esa oilaga shoshilinch pul yuborish kerak.'),
    D('Вы знаете причину блокировки, вам приходило сообщение из банка?', 'vy znaete prichinu blakirofki vam prixodilo saabshenie iz banka', 'Bloklanish sababini bilasizmi, bankdan xabar kelganmidi?',
      'Приходило, что нужно подтвердить личность, но я не понял, как это сделать.', 'prixodilo shto nuzhna patvirdit lichnast no ya ne ponyal kak eta sdelat', 'Shaxsni tasdiqlash kerakligi haqida xabar kelgan, lekin buni qanday qilishni tushunmadim.'),
    D('Тогда принесите паспорт и миграционную карту, мы обновим ваши данные.', 'tagda prinisite pasport i migratsionnuyu kartu my abnovim vashi dannye', 'Unda pasport va migratsion kartani olib keling, ma’lumotlaringizni yangilaymiz.',
      'Паспорт со мной, а миграционная карта осталась дома, можно завтра принести?', 'pasport sa mnoy a migratsionnaya karta astalas doma mozhna zaftra prinisti', 'Pasport yonimda, migratsion karta uyda qoldi, ertaga olib kelsam bo‘ladimi?'),
    D('Без неё мы не сможем завершить проверку, но я могу записать вас на завтра.', 'bis niyo my ne smozhem zavirshit proverku no ya magu zapisat vas na zaftra', 'Usiz tekshiruvni tugata olmaymiz, lekin sizni ertaga yozib qo‘yishim mumkin.',
      'Запишите, пожалуйста, на утро, я возьму выходной, чтобы успеть.', 'zapishite pazhalusta na utro ya vazmu vyxadnoy shtoby uspet', 'Iltimos, ertalabga yozing, ulgurish uchun dam olish kuni olaman.'),
    D('Принтер в офисе не работает, вы можете отправить документы на почту?', 'printir v ofise ne rabotaet vy mozhete atpravit dakumenty na pochtu', 'Idorada printer ishlamayapti, hujjatlarni pochtaga yubora olasizmi?',
      'Конечно, пришлю сейчас скан, а оригинал принесу, когда будет возможность.', 'kanyeshna prishlyu sichas skan a ariginal prinisu kagda budet vazmozhnast', 'Albatta, hozir skanini yuboraman, asl nusxani imkon bo‘lganda olib kelaman.'),
    D('Вы подали заявку, но она пока в обработке, нужно подождать три дня.', 'vy padali zayafku no ana paka v abrabotke nuzhna padazhdat tri dnya', 'Ariza topshirdingiz, lekin u hozircha ko‘rib chiqilmoqda, uch kun kutish kerak.',
      'Три дня слишком долго, можно ускорить, если я доплачу или принесу справку?', 'tri dnya slishkam dolga mozhna uskorit yesli ya daplachu ili prinisu spravku', 'Uch kun juda uzoq, qo‘shimcha to‘lasam yoki ma’lumotnoma olib kelsam, tezlashtirsa bo‘ladimi?'),
    D('Мы выставили вам неверный счёт, приносим извинения, сейчас пересчитаем сумму.', 'my vystavili vam nivyerny shot prinosim izvinyeniya sichas pirishitaem summu', 'Sizga noto‘g‘ri hisob chiqarib yuboribmiz, uzr, hozir summani qayta hisoblaymiz.',
      'Спасибо, а можно получить новый чек и письменное подтверждение исправления?', 'spasibo a mozhna paluchit novy chek i pismennae patverzhdenie ispravleniya', 'Rahmat, yangi chek va tuzatilganligi haqida yozma tasdiq olsam bo‘ladimi?'),
    D('Если вас не устроит ответ, куда вы будете обращаться дальше?', 'yesli vas ne ustroit atvet kuda vy budete abrashatsya dalshe', 'Javob sizni qoniqtirmasa, keyin qayerga murojaat qilasiz?',
      'Напишу в центральный офис, а потом в Роспотребнадзор, если проблему не решат.', 'napishu v tsintralny ofis a potom v raspatrebnadzor yesli problemu ne rishat', 'Markaziy ofisga, keyin Rospotrebnadzorga yozaman, agar muammo hal qilinmasa.', 'Rospotrebnadzor — iste’molchilar huquqlarini himoya qiluvchi davlat organi.'),
    D('Давайте подведём итог: что мы сделали и что осталось сделать?', 'davayte padvidyom itok shto my sdelali i shto astalas sdelat', 'Xulosa qilaylik: nimalarni qildik va nima qilish qoldi?',
      'Карту разблокировали, документы приняли, осталось только дождаться ответа до пятницы.', 'kartu razblakirovali dakumenty prinyali astalas tolka dazhdatsya atveta da pyatnitsy', 'Karta blokdan chiqarildi, hujjatlar qabul qilindi, faqat juma kunigacha javobni kutish qoldi.'),
    D('Вам удобнее получить ответ по телефону или сообщением в приложении?', 'vam udobnee paluchit atvet pa tilifonu ili saabsheniyem v prilazhenii', 'Javobni telefon orqali olgan qulayroqmi yoki ilovada xabar bilan?',
      'Лучше сообщением, потому что днём я на работе и не могу говорить.', 'luchshe saabsheniyem patamu shto dnyom ya na rabote i ne magu gavarit', 'Xabar bilan yaxshiroq, chunki kunduzi ishdaman va gaplasha olmayman.')
  ]
});

LESSONS.push({ id: 'b2a-01', type: 'P', sec: 11, title: 'Sifatdosh va ravishdosh', sub: 'Причастие и деепричастие',
  intro: 'Sifatdosh — predmetning belgisi: читающий (o‘qiyotgan), прочитанный (o‘qilgan).\nRavishdosh — ikkinchi harakat: прочитав (o‘qib), сидя (o‘tirib), не зная (bilmay).\nSifatdosh otga jins, son, kelishik bo‘yicha mos keladi; ravishdosh o‘zgarmaydi.\nRavishdosh va asosiy fe’lning bajaruvchisi bir xil bo‘lishi kerak.\nMisol: Девушка, читающая книгу, — qiz, kitob o‘qiyotgan.',
  items: [
    P('Девушка, читающая книгу у окна, оказалась моей новой соседкой по общежитию.', 'dyevushka chitayushaya knigu u akna azalas mayey novoy sasyedkoy pa abshezhitiyu', 'Deraza yonida kitob o‘qib o‘tirgan qiz yotoqxonadagi yangi qo‘shnim bo‘lib chiqdi.', 'Читающая — «o‘qiyotgan», faol sifatdosh; qizga mos, ayol jinsida.'),
    P('Документы, подписанные директором ещё вчера вечером, нужно обязательно отнести в налоговую до обеда.', 'dakumyenty patpisannyye diryektaram yishyo fchira vyechiram nuzhna abizatilna atnesti v nalogovuyu da abyeda', 'Direktor kecha kechqurunoq imzolagan hujjatlarni tushlikkacha albatta soliq idorasiga olib borish kerak.', 'Подписанные — majhul sifatdosh: «imzolangan».'),
    P('Прочитанное письмо лежало на столе, а ответа от хозяина квартиры всё не было.', 'prachitannaye pismo lezhalo na stolye a atvyeta at xazyaina kvartiry vsyo nye bylo', 'O‘qib bo‘lingan xat stol ustida yotardi, kvartira egasidan esa javob hamon yo‘q edi.'),
    P('Прочитав объявление, я сразу позвонил по номеру и договорился о встрече на завтра.', 'prachitav abyavlyeniye ya srazu pazvanil pa nomiru i dagavorilsya a fstryechye na zaftra', 'E’lonni o‘qib chiqib, men darhol raqamga qo‘ng‘iroq qildim va ertaga uchrashishga kelishdim.', 'Прочитав = после того как прочитал. Ravishdosh -в bilan tugaydi.'),
    P('Сидя в маршрутке, он всю дорогу смотрел в телефон и чуть не проехал свою остановку.', 'sidya v marshrutkye on vsyu daragu smatryel f tilifon i chut nye prayexal svayu astanofku', 'Marshrutkada o‘tirib, u butun yo‘l telefonga qaradi va bekatidan o‘tib ketishiga oz qoldi.', 'Сидя, стоя, лёжа — «o‘tirib, turib, yotib»: tez-tez uchraydi.'),
    P('Не зная русского языка, в первые месяцы я боялся даже заказать еду в кафе.', 'nye znaya ruskava yazyka v pyervyye myesyatsy ya bayalsya dazhe zakazat yedu f kafye', 'Rus tilini bilmay, birinchi oylarda kafeda ovqat buyurtma qilishdan ham qo‘rqardim.'),
    P('Люди, говорящие на двух языках, обычно быстрее переключаются между задачами и лучше запоминают слова.', 'lyudi gavaryashiye na dvux yazykax abychna bystryeye pirikluchayutsa myezhdu zadachami i luchshe zapaminayut slova', 'Ikki tilda gaplashadigan odamlar odatda vazifalar orasida tezroq o‘tadi va so‘zlarni yaxshiroq eslab qoladi.'),
