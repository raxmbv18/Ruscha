    T('A','Здравствуйте, у меня заканчивается патент через две недели, и я хочу узнать, как его продлить.','zdrastvuyte u minya zakanchivayetsya patent chiriz dvye nidyeli i ya xachu uznat kak yevo pradlit','Assalomu alaykum, patentim ikki haftadan keyin tugaydi, uni qanday uzaytirishni bilmoqchiman.'),
    T('B','Здравствуйте. Для начала скажите, оплачивали ли вы налог за все предыдущие месяцы.','zdrastvuyte dlya nachala skazhite aplachivali li vy nalok za vsye pridydushiye myesyatsy','Assalomu alaykum. Avval ayting-chi, oldingi barcha oylar uchun soliqni to‘lab kelganmisiz.'),
    T('A','Да, все квитанции у меня с собой. Вот чеки за последние одиннадцать месяцев.','da vsye kvitantsii u minya s saboy vot cheki za paslednie adinatsat myesyatsev','Ha, barcha kvitansiyalar o‘zimda. Mana, oxirgi o‘n bir oy uchun cheklar.'),
    T('B','Хорошо. Тогда принесите паспорт, договор с работодателем и полис, а остальное мы проверим по базе сами.','xarasho tagda prinisite pasport dagavor s rabatadatilem i polis a astalnoye my pravyerim pa bazye sami','Yaxshi. Unda pasport, ish beruvchi bilan shartnoma va polisni olib keling, qolganini o‘zimiz bazadan tekshiramiz.'),
    T('A','А если я опоздаю на один-два дня, мне придётся платить штраф или всё обойдётся?','a yesli ya apazdayu na adin dva dnya mnye pridyotsya platit shtraf ili vsyo abaydyotsya','Agar bir-ikki kunga kechiksam, jarima to‘lashga to‘g‘ri keladimi yoki hammasi tinch o‘tadimi?'),
    T('B','Лучше не рисковать. За просрочку могут выписать штраф, а потом ещё и ограничить въезд.','luchshe nye riskavat za prasrochku mogut vypisat shtraf a potom yeshyo i agranichit vyezt','Tavakkal qilmagan yaxshi. Kechikkani uchun jarima yozishlari, keyin esa kirishni ham cheklashlari mumkin.'),
    T('A','Понял, спасибо. Тогда я сегодня же запишусь на приём и принесу всё необходимое.','ponyal spasibo tagda ya sivodnya zhe zapishus na priyom i prinisu vsyo nibxadimaye','Tushundim, rahmat. Unda bugunoq qabulga yozilaman va hamma kerakli narsani olib kelaman.'),
    T('B','Отлично. Если возникнут вопросы, звоните по номеру на сайте или заходите, мы работаем до шести.','atlichna yesli vaznyknut vaprosy zvonite pa nomiru na sayte ili zaxodite my rabotayem da shesti','Ajoyib. Savollar tug‘ilsa, saytdagi raqamga qo‘ng‘iroq qiling yoki kirib o‘ting, biz soat oltigacha ishlaymiz.'),
  ]
});

LESSONS.push({ id: 'b2b-04', type: 'P', sec: 12, title: 'Hazil, maqol va matallar', sub: 'Юмор и пословицы',
  intro: 'Maqol va hazil jonli nutqning bezagi. Maqolni ko‘pincha to‘liq emas, yarmini aytib qo‘yishadi.\nIroniya: gapning aksi nazarda tutiladi, ma‘no ohangdan bilinadi.\nMisol: «Ну и погодка!» — yomon havoda kinoya bilan.\n«Любишь кататься — люби и саночки возить» — huzur uchun mehnat ham qil.',
  items: [
    P('Русская пословица говорит: любишь кататься — люби и саночки возить, то есть за удовольствие надо платить трудом.', 'ruskaya paslovitsa gavarit lyubish katatsya lyubi i sanachki vazit ta yest za udavolstviye nada platit trudam', 'Rus maqoli aytadi: sirg‘alishni yaxshi ko‘rsang, chanangni tortishni ham yaxshi ko‘r, ya‘ni huzur uchun mehnat bilan to‘lash kerak.', 'Ma‘nosi: nimani istasang, uning mashaqqatini ham ko‘tar.'),
    P('Мама всегда говорит: в гостях хорошо, а дома лучше, и я с ней полностью согласен.', 'mama vsigda gavarit v gostyax xarasho a doma luchshe i ya s nyey palnastyu saglasyen', 'Onam doim aytadi: mehmonda yaxshi, uyda esa yaxshiroq, men u bilan butunlay roziman.'),
    P('Семь раз отмерь, один раз отрежь — так говорят, когда не стоит торопиться с решением.', 'syem raz atmyer adin raz atryezh tak gavaryat kagda nye stoit tarapitsya s rishyeniyem', 'Yetti marta o‘lchab, bir marta kes — qaror bilan shoshilmaslik kerak bo‘lganda shunday deyishadi.'),
    P('Когда сосед в третий раз за день просит соль, мы шутим: пора открывать магазин.', 'kagda sasyet v tryetiy raz za dyen prosit sol my shutim para atkryvat magazin', 'Qo‘shni bir kunda uchinchi marta tuz so‘raganda, biz hazillashamiz: do‘kon ochish payti keldi.'),
    P('Русские любят иронию: если на улице ливень, они могут сказать «ну и погодка, просто красота!».', 'ruskiye lyubyat ironiyu yesli na ulitse livyen ani magut skazat nu i pagodka prosta krasata', 'Ruslar ironiyani yaxshi ko‘radi: ko‘chada jala quyayotgan bo‘lsa, «voy-bo‘, ob-havo zo‘r-ku!» deyishi mumkin.', 'Ironiya: aytilgan gap aksini bildiradi.'),
    P('Если человек опоздал на час, друзья скажут с иронией: ну ты прямо вовремя пришёл!', 'yesli chilavyek apazdal na chas druzya skazhut s ironiyey nu ty pryama vavrimya prishyol', 'Agar odam bir soat kechiksa, do‘stlari kinoya bilan aytadi: voy, sen aynan vaqtida kelding-ku!'),
    P('Не имей сто рублей, а имей сто друзей — эту пословицу в нашей семье знают все.', 'nye imyey sto rublyey a imyey sto druzyey etu paslovitsu v nashey simye znayut vsye', 'Yuz so‘ming bo‘lmasin, yuzta do‘sting bo‘lsin — bu maqolni bizning oilada hamma biladi.'),
    P('Кто не работает, тот не ест, — говорил мой дед, когда звал нас помогать на огороде.', 'kto nye rabotayet tot nye yest gavaril moy dyet kagda zval nas pamagat na agarodye', 'Kim ishlamasa, o‘sha yemaydi, — derdi bobom, bizni poliz-bog‘da yordamga chaqirganda.'),
    P('Когда мы случайно встретились после десяти лет, он сказал: гора с горой не сходится!', 'kagda my sluchayna vstryetilis posle disyati lyet on skazal gara s garoy nye sxoditsya', 'Biz o‘n yildan keyin tasodifan uchrashganimizda, u dedi: tog‘ tog‘ bilan uchrashmaydi!', 'Maqol: dunyo tor, odamlar albatta uchrashadi.'),
    P('Говорят, что русский человек сначала долго запрягает, а потом очень быстро едет.', 'gavaryat shto ruskiy chilavyek snachala dolga zapryagayet a potom ochin bystra yedyet', 'Aytishlaricha, rus odami avval uzoq vaqt qo‘shadi, keyin esa juda tez ketadi.', 'Maqol: ruslar sekin boshlaydi, keyin tez ishlaydi.'),
    P('Шутка из жизни: на работе спрашивают «как дела?», а коллега отвечает «лучше всех, только никто не завидует».', 'shutka iz zhizni na rabotye sprashivayut kak dila a kalyega atvyechayet luchshe vsyex tolka nikto nye zaviduyet', 'Hayotdan hazil: ishda «ishlar qalay?» deb so‘rashadi, hamkasb esa «hammadan yaxshi, faqat hech kim hasad qilmayapti» deb javob beradi.'),
    P('Чтобы поддержать друга после неудачи, русские часто говорят: не боги горшки обжигают.', 'shtoby paddyerzhat druga posle niudachi ruskiye chasto gavaryat nye bogi garshki abzhigayut', 'Do‘stni muvaffaqiyatsizlikdan keyin qo‘llab-quvvatlash uchun ruslar ko‘pincha aytadi: ko‘zani xudolar pishirmagan, ya‘ni xato qilish tabiiy.', 'Hamma o‘rganadi, xato qilsa bo‘ladi.'),
    P('Когда всё валится из рук, я смеюсь и говорю: чем дальше в лес, тем больше дров.', 'kagda vsyo valitsya iz ruk ya smiyus i gavaryu chem dalshe v lyes tem bolshe drov', 'Hamma narsa qo‘ldan tushib ketayotganda kulaman va aytaman: o‘rmonga chuqur kirgan sari o‘tin ko‘proq.', 'Ya‘ni ish borgan sari murakkablashadi.'),
  ],
  talk: [
    T('A','Привет! Ты что такой мрачный, опять начальник заставил работать в выходные?','privyet ty shto takoy mrachniy apyat nachalnik zastavil rabotat v vyxodnyye','Salom! Nega bunchalik tund, yana boshliq dam olish kunlari ishlashga majbur qildimi?'),
    T('B','Да, пришлось помогать с переездом офиса. Ну что поделаешь, любишь кататься — люби и саночки возить.','da prishlos pamagat s pirieyezdam ofisa nu shto padyelayesh lyubish katatsya lyubi i sanachki vazit','Ha, ofis ko‘chishida yordam berishga to‘g‘ri keldi. Nima ham qilardik, sirg‘alishni yaxshi ko‘rsang, chanani ham tort.'),
    T('A','Зато тебе обещали премию, так что не жалуйся, а то я тоже захочу к вам.','zata tibye abyeshali primiyu tak shto nye zhaluysya a to ya tozhe zaxachu k vam','Buning evaziga senga mukofot va‘da qilishdi, shuning uchun shikoyat qilma, bo‘lmasa men ham sizlarga qo‘shilgim kelib qoladi.'),
    T('B','Обещанного три года ждут, так что я пока ничего не планирую тратить.','abishanava tri goda zhdut tak shto ya paka nichivo nye planiruyu tratit','Va‘da qilingan narsani uch yil kutishadi, shuning uchun hozircha hech narsa sarflashni rejalashtirmayapman.'),
    T('A','Ха-ха, у тебя прямо чувство юмора включилось, значит, не всё потеряно. Пойдём в субботу к Лене, там отдохнёшь.','xa xa u tibya pryama chustva yumora vklyuchilas znachit nye vsyo patiryano paydyom v subotu k lyene tam atdaxnyosh','Xa-xa, hazil tuyg‘ung qaytib keldi, demak hammasi yo‘qolmagan. Shanba kuni Lenaning oldiga boramiz, o‘sha yerda dam olasan.'),
    T('B','Пойдём, в гостях хорошо, а дома лучше, но после такой недели мне нужна компания.','paydyom v gostyax xarasho a doma luchshe no posle takoy nidyeli mnye nuzhna kampaniya','Boramiz, mehmonda yaxshi, uyda esa yaxshiroq, lekin shunday haftadan keyin menga davra kerak.'),
    T('A','Тогда решено. Только не опаздывай, а то опять скажу: ну ты прямо вовремя пришёл!','tagda rishyeno tolka nye apazdyvay a to apyat skazhu nu ty pryama vavrimya prishyol','Unda kelishildi. Faqat kechikma, bo‘lmasa yana aytaman: voy, sen aynan vaqtida kelding-ku!'),
    T('B','Ладно, не язви, я приду ровно в шесть, как швейцарские часы.','ladna nye yazvi ya pridu rovna v shest kak shveytsarskiye chasy','Mayli, nish urma, aniq soat oltida kelaman, shveytsariya soatiday.'),
  ]
});

LESSONS.push({ id: 'b2b-05', type: 'P', sec: 12, title: 'Yoshlar nutqi va slang', sub: 'Молодёжная речь',
  intro: 'Yoshlar slengi do‘stlar orasida va chatda ishlatiladi: норм (yaxshi), зашло (yoqdi), душнила (zerikarli nasihatchi), го (boramiz), жиза (hayotiy), кринж (noqulaylik).\nBoshliq, kattalar va rasmiy joyda bunday so‘zlardan saqlan.\nSleng tez eskiradi. Bu yerda faqat mat‘siz so‘zlar.',
  items: [
    P('Фильм был вполне норм, но концовка мне вообще не зашла, если честно.', 'film byl vpalnye norm no kantsofka mnye vapshe nye zashla yesli chestna', 'Film ancha yaxshi edi, lekin rostini aytsam, oxiri menga umuman yoqmadi.', '«Норм» — «нормально»ning qisqasi; «зашло» — yoqdi.'),
    P('Эта песня так зашла мне, что я слушаю её уже третий день подряд.', 'eta pesnya tak zashla mnye shto ya slushayu yeyo uzhe tryetiy dyen padryat', 'Bu qo‘shiq menga shunchalik yoqdiki, uni uchinchi kundan beri ketma-ket tinglayapman.'),
    P('Не будь душнилой, мы просто хотим посидеть, а ты читаешь лекцию про вредную еду.', 'nye bud dushnilay my prosta xatim pasidyet a ty chitayesh lyektsiyu pro vridnuyu yedu', 'Zerikarli bo‘lma, biz shunchaki o‘tirmoqchimiz, sen esa zararli ovqat haqida ma‘ruza o‘qiyapsan.', 'Душнила — hammaga nasihat qiladigan odam; do‘stlar orasida hazil bilan aytiladi.'),
    P('Го в кино после работы? Я уже посмотрел расписание, ближайший сеанс в восемь.', 'go v kina posle raboty ya uzhe pasmatryel raspisaniye blizhayshiy siyans v vosyem', 'Ishdan keyin kinoga boramizmi? Men jadvalni ko‘rib qo‘ydim, eng yaqin seans soat sakkizda.', '«Го» — inglizcha go; «пошли», «поехали» o‘rniga.'),
    P('Это такая жиза: приходишь домой уставший, а в холодильнике только майонез и одно яйцо.', 'eta takaya zhiza prixodish damoy ustavshiy a v xaladilnike tolka mayanes i adno yaytso', 'Bu juda hayotiy: charchab uyga kelasan, muzlatgichda esa faqat mayonez va bitta tuxum bor.', '«Жиза» — «bu menda ham shunday» degani.'),
    P('Когда он начал петь при всех, мне стало так кринж, что я вышел на улицу.', 'kagda on nachal pyet pri vsyex mnye stalo tak krinzh shto ya vyshel na ulitsu', 'U hammaning oldida qo‘shiq ayta boshlaganda, menga shunchalik noqulay bo‘ldiki, ko‘chaga chiqib ketdim.', 'Кринж — o‘ng‘aysizlik, uyat tuyg‘usi.'),
    P('Ничего себе, ты за неделю закрыл все долги? Красавчик, я бы так не смог!', 'nichivo sibye ty za nidyelyu zakryl vsye dolgi krasafchik ya by tak nye smok', 'Voy-bo‘, sen bir haftada hamma qarzlaringni yopdingmi? Barakalla, men bunday qila olmasdim!', 'Красавчик — maqtov, «barakalla» ma‘nosida.'),
    P('Ты чего завис? Отвечай уже, мы ждём, а то всё остынет.', 'ty chivo zavis atvyechay uzhe my zhdyom a to vsyo astynyet', 'Nega qotib qolding? Tezroq javob ber, kutyapmiz, bo‘lmasa hammasi sovib qoladi.', 'Завис — kompyuterdek «qotib qoldi».'),
    P('Мы с ребятами скинулись и купили ему подарок, а он такой: не надо было.', 'my s ribyatami skinulis i kupili yemu padarak a on takoy nye nada byla', 'Biz yigitlar bilan pul yig‘ib unga sovg‘a oldik, u esa «shart emasdi» deydi.', 'Скинуться — pul yig‘ib birga to‘lash; «он такой» — «u shunday dedi».'),
    P('Сленг подходит для друзей и чата, а начальнику лучше сказать «хорошо» вместо «норм».', 'slyeng padxodit dlya druzyey i chata a nachalniku luchshe skazat xarasho vmesta norm', 'Sleng do‘stlar va chat uchun mos, boshliqqa esa «norm» o‘rniga «yaxshi» deyish durustroq.'),
    P('Я не понял, это шутка или серьёзно? Объясни, пожалуйста, а то я немного потерялся.', 'ya nye ponyal eta shutka ili siryozna abyasni pazhalusta a to ya nimnoga patiryalsya', 'Tushunmadim, bu hazilmi yoki jiddiymi? Tushuntirib ber, iltimos, bo‘lmasa biroz adashib qoldim.', 'Notanish slengni so‘rashdan uyalma.'),
    P('Сегодня я в ауте: проспал, опоздал, а ещё телефон сел, поэтому просто ложусь пораньше.', 'sivodnya ya v aute praspal apazdal a yeshyo tilifon syel paetomu prosta lazhus paranshe', 'Bugun juda holdan toydim: uxlab qoldim, kechikdim, telefon ham o‘chib qoldi, shuning uchun erta yotaman.', '«В ауте» — juda charchagan; «телефон сел» — batareya tugadi.'),
    P('Сленг быстро меняется, и слово, которое было модным год назад, уже звучит устаревшим.', 'slyeng bystra minyayetsya i slova katoraye bylo modnym got nazat uzhe zvuchit ustarevshim', 'Sleng tez o‘zgaradi, bir yil oldin modada bo‘lgan so‘z hozir eskirgan eshitiladi.'),
  ],
  talk: [
    T('A','Слушай, ты вчера ходила на концерт? Как всё прошло, зашло?','slushay ty vchira xadila na kantsert kak vsyo proshlo zashlo','Eshit, kecha kontsertga bordingmi? Qanday o‘tdi, yoqdimi?'),
    T('B','Да, норм, но один парень всё время снимал себя и такой кринж устроил!','da norm no adin paryen vsyo vryemya snimal sibya i takoy krinzh ustroil','Ha, yaxshi, lekin bitta yigit doim o‘zini suratga olib, juda noqulay holat qilib qo‘ydi!'),
    T('A','Ха, жиза. А я весь вечер просидел дома, потому что реферат писал.','xa zhiza a ya ves vyecher prosidyel doma patamu shto rifirat pisal','Xa, hayotiy. Men esa butun kechqurun uyda o‘tirdim, chunki referat yozdim.'),
    T('B','Не душни, сегодня пятница! Го с нами в кафе, там все наши будут.','nye dushni sivodnya pyatnitsa go s nami v kafe tam vsye nashi budut','Zerikarli bo‘lma, bugun juma-ku! Biz bilan kafega bor, hamma o‘zimizinikilar bo‘ladi.'),
    T('A','Ладно, уговорила, только ненадолго, мне завтра рано вставать.','ladna ugavarila tolka nenadolga mnye zaftra rano vstavat','Mayli, ko‘ndirding, faqat uzoq o‘tirmayman, ertaga erta turishim kerak.'),
    T('B','Вот и отлично! Только при преподавателе лучше не говорить «норм» и «го», это всё-таки не друзья.','vot i atlichna tolka pri prepadavatilye luchshe nye gavarit norm i go eta vsyo taki nye druzya','Ana xolos, ajoyib! Faqat o‘qituvchi oldida «norm» va «go» demagan yaxshi, ular baribir do‘st emas.'),
    T('A','Согласен. С ребятами можно, а с преподавателями говорю как положено.','saglasyen s ribyatami mozhna a s prepadavatilyami gavaryu kak palozheno','Roziman. Yigitlar bilan mumkin, o‘qituvchilar bilan esa odob bilan gaplashaman.'),
    T('B','Ну всё, тогда в семь у входа, а то я опять буду стоять одна, и мне будет кринж.','nu vsyo tagda v syem u vxoda a to ya apyat budu stayat adna i mnye budit krinzh','Xo‘p, unda soat yettida kirish joyida, bo‘lmasa yana yolg‘iz turaman va menga noqulay bo‘ladi.'),
  ]
});

LESSONS.push({ id: 'b2b-06', type: 'P', sec: 12, title: 'Uzun hikoya va xotira', sub: 'Рассказ и воспоминания',
  intro: 'Uzun hikoyada bog‘lovchi iboralar kerak: я помню, когда… (esimda…), сначала… потом… (avval… keyin), в конце концов (oxir-oqibat), как выяснилось (ma‘lum bo‘lishicha), в итоге (natijada).\nHikoya o‘tgan zamonda: приехал, жил, нашёл.\nMisol: Как выяснилось, он всё знал.',
  items: [
    P('Я помню, когда я приехал в Москву, всё вокруг казалось мне огромным и очень шумным.', 'ya pomnyu kagda ya priyexal v maskvu vsyo vakrug kazalas mnye agromnym i ochin shumnym', 'Esimda, Moskvaga kelganimda atrofdagi hamma narsa menga ulkan va juda shovqinli tuyulgan edi.'),
    P('Сначала я жил в общежитии, потом снял комнату, а в конце концов нашёл квартиру.', 'snachala ya zhil v apshezhitii potom snyal komnatu a v kantse kantsov nashol kvartiru', 'Avval yotoqxonada yashadim, keyin xona ijaraga oldim, oxir-oqibat esa kvartira topdim.', '«В конце концов» — oxir-oqibat, nihoyat.'),
    P('Как выяснилось позже, хозяин квартиры вообще не имел права сдавать её без договора.', 'kak vyyasnilas pozzhe xazyain kvartiry vapshe nye imyel prava zdavat yeyo byez dagavora', 'Keyin ma‘lum bo‘lishicha, kvartira egasi uni shartnomasiz ijaraga berishga umuman haqli emas ekan.', '«Как выяснилось» — keyin ma‘lum bo‘lishicha.'),
    P('Однажды зимой я чуть не опоздал на самолёт, потому что такси застряло в пробке.', 'adnazhdy zimoy ya chut nye apazdal na samalyot patamu shto taksi zastryalo v probkye', 'Bir kuni qishda taksi tirbandlikda qolib ketgani uchun samolyotga deyarli kech qoldim.'),
    P('Тогда я ещё плохо говорил по-русски, поэтому мне приходилось объяснять всё жестами и улыбкой.', 'tagda ya yeshyo plokha gavaril pa ruski paetomu mnye prixadilas abyasnyat vsyo zhestami i ulybkoy', 'O‘shanda men hali rus tilida yomon gapirardim, shuning uchun hamma narsani imo-ishora va tabassum bilan tushuntirishga to‘g‘ri kelardi.'),
    P('Вдруг рядом остановился незнакомый мужчина и на узбекском спросил, не нужна ли мне помощь.', 'vdruk ryadam astanovilsya nyeznakomiy mushina i na uzbyekskam sprasil nye nuzhna li mnye pomash', 'To‘satdan yonimda notanish erkak to‘xtab, o‘zbekcha menga yordam kerakmi, deb so‘radi.'),
    P('Мы разговорились, и оказалось, что он тоже из Самарканда и давно живёт в этом городе.', 'my razgavarilis i akazalas shto on tozhe iz samarkanda i davno zhivyot v etam garadye', 'Gaplashib qoldik va u ham Samarqanddan ekani va bu shaharda anchadan beri yashashi ma‘lum bo‘ldi.'),
    P('С тех пор мы дружим, и он помог мне найти первую нормальную работу на складе.', 's tyex por my druzhim i on pamok mnye nayti pyervuyu narmalnuyu rabotu na skladye', 'O‘shandan beri biz do‘stmiz va u menga omborda birinchi yaxshi ish topishda yordam berdi.'),
    P('Сначала казалось, что всё идёт хорошо, но через полгода склад закрыли, и я остался без работы.', 'snachala kazalas shto vsyo idyot xarasho no chiriz polgoda sklat zakryli i ya astalsya byez raboty', 'Avval hammasi yaxshi ketayotgandek tuyuldi, lekin yarim yildan keyin ombor yopildi va men ishsiz qoldim.'),
    P('В итоге я пошёл на курсы, выучил язык получше и устроился в строительную компанию.', 'v itoge ya pashyol na kursy vyuchil yazyk paluchshe i ustroilsya v stroitilnuyu kampaniyu', 'Natijada kurslarga bordim, tilni yaxshiroq o‘rgandim va qurilish kompaniyasiga ishga joylashdim.', 'Og‘zaki nutqda «в итоге» o‘rniga ko‘pincha «короче» deyishadi.'),
    P('Если вспоминать честно, самым трудным было не язык, а скучать по дому и по маме.', 'yesli vspaminat chestna samym trudnym bylo nye yazyk a skuchat pa damu i pa mame', 'Rostini eslasam, eng qiyini til emas, uy va onam uchun sog‘inish edi.'),
    P('Сейчас я часто рассказываю друзьям об этом времени и смеюсь над тем, чего тогда боялся.', 'syeychas ya chasta raskazyvayu druzyam ab etam vryemeni i smiyus nad tyem chivo tagda bayalsya', 'Hozir do‘stlarimga o‘sha davr haqida tez-tez gapirib beraman va o‘shanda qo‘rqqan narsamdan kulaman.'),
    P('Когда я рассказываю такие истории, меня обычно перебивают вопросом: а что было дальше?', 'kagda ya raskazyvayu takiye istorii minya abychna pirebivayut vaprosam a shto bylo dalshe', 'Bunday hikoyalarni aytsam, meni odatda «keyin nima bo‘ldi?» degan savol bilan to‘xtatishadi.', 'Tinglovchining odatiy savoli: «А что было дальше?»'),
  ],
  talk: [
    T('A','Расскажи, как ты вообще оказался в России? Я никогда не слышал твою историю.','raskazhi kak ty vapshe akazalsya v rasii ya nikagda nye slyshal tvayu istoriyu','Aytib ber-chi, sen umuman Rossiyaga qanday kelib qolding? Men sening hikoyangni hech eshitmaganman.'),
    T('B','Ой, это долгая история. Я приехал в двухтысячном году, мне было восемнадцать, и я почти ничего не знал.','oy eta dolgaya istoriya ya priyexal v dvuxtysyachnam gadu mnye bylo vasimnatsat i ya pochti nichivo nye znal','Oh, bu uzun hikoya. Men ikki mingnchi yilda kelganman, o‘n sakkiz yoshda edim va deyarli hech narsa bilmasdim.'),
    T('A','А почему именно Россия? Тебе кто-то посоветовал или ты просто поехал?','a pachimu imyenna rasiya tibye kto ta pasavetaval ili ty prosta payexal','Nega aynan Rossiya? Senga kimdir maslahat berdimi yoki shunchaki ketaverdingmi?'),
    T('B','Мой дядя уже работал здесь, и, как выяснилось потом, он обещал мне работу, которой не было.','moy dyadya uzhe rabotal zdyes i kak vyyasnilas potom on abyeshal mnye rabotu katoroy nye bylo','Amakim bu yerda allaqachon ishlayotgan edi va keyin ma‘lum bo‘lishicha, menga mavjud bo‘lmagan ish va‘da qilgan ekan.'),
    T('A','Серьёзно? И что ты делал, когда понял, что работы нет?','siryozna i shto ty dyelal kagda ponyal shto raboty nyet','Jiddiymi? Ish yo‘qligini tushunganingda nima qilding?'),
    T('B','Сначала я растерялся, потом пошёл на рынок, и там меня взяли грузчиком на неделю.','snachala ya rastiryalsya potom pashyol na rynak i tam minya vzyali gruzchikam na nidyelyu','Avval garang bo‘ldim, keyin bozorga bordim va u yerda meni bir haftaga yuk tashuvchi qilib olishdi.'),
    T('A','Ничего себе! И как ты потом из грузчика стал начальником участка?','nichivo sibye i kak ty potom iz gruzchika stal nachalnikam uchastka','Voy-bo‘! Keyin yuk tashuvchidan uchastka boshlig‘iga qanday aylanding?'),
    T('B','Шаг за шагом: учил язык, работал по двенадцать часов, а в конце концов меня заметили.','shak za shagam uchil yazyk rabotal pa dvinatsat chasov a v kantse kantsov minya zamyetili','Qadam-baqadam: tilni o‘rgandim, o‘n ikki soatdan ishladim va oxir-oqibat meni payqashdi.'),
    T('A','Круто! Из твоей истории можно сделать целую книгу.','kruta iz tvayey istorii mozhna sdyelat tseluyu knigu','Zo‘r! Sening hikoyangdan butun bir kitob qilish mumkin.'),
  ]
});

    P('После курсов я хочу сдать экзамен по русскому языку и получить сертификат.', 'posle kursov ya xachu sdat ekzamyen pa ruskamu yazyku i paluchit sirtifikat', 'Kurslardan keyin rus tilidan imtihon topshirib, sertifikat olmoqchiman.'),
    P('Летом студенты часто ищут стажировку, чтобы получить опыт и записать его в резюме.', 'lyetam studyenty chasta ishut stazhirovku shtoby paluchit opyt i zapisat yevo v rizyume', 'Yozda talabalar tajriba olib, rezyumega yozish uchun ko‘pincha amaliyot qidiradi.', 'Стажировка — qisqa muddatli amaliyot, ba‘zan haq to‘lanadi.'),

    P('Если получится, я поступлю в магистратуру и займусь исследованием в области экономики.', 'yesli paluchitsya ya pastuplyu v magistraturu i zaymus issledavaniyem v oblasti ekanomiki', 'Agar chiqsa, magistraturaga kiraman va iqtisodiyot sohasida tadqiqot bilan shug‘ullanaman.'),
    P('Чтобы получить грант или скидку на обучение, нужно хорошо учиться и вовремя собрать документы.', 'shtoby paluchit grant ili skidku na abuchenie nuzhno xarasho uchitsya i vavrimya sabrat dakumyenty', 'Grant yoki o‘qishga chegirma olish uchun yaxshi o‘qish va hujjatlarni o‘z vaqtida yig‘ish kerak.'),
    P('Через пять лет я вижу себя руководителем небольшой команды, а может быть, хозяином своей фирмы.', 'chiriz pyat lyet ya vizhu sibya rukavaditilem nibolshoy kamandy a mozhet byt xazyainam svayey firmy', 'Besh yildan keyin o‘zimni kichik jamoa rahbari, balki o‘z firmamning egasi sifatida ko‘raman.'),
    P('Пока я учусь, я откладываю часть зарплаты, чтобы потом оплатить следующий семестр.', 'paka ya uchus ya atkladyvayu chast zarplaty shtoby potom aplatit slyedushiy simestr', 'O‘qiyotgan paytimda keyingi semestr uchun to‘lash maqsadida oylikning bir qismini yig‘ib boraman.'),
    P('На курсах преподаватель советует читать новости и смотреть сериалы, чтобы расширять словарный запас.', 'na kursax prepadavatil savetuyet chitat novosti i smatryet sirialy shtoby rasshiryat slavarniy zapas', 'Kurslarda o‘qituvchi lug‘at boyligini oshirish uchun yangiliklar o‘qish va serial ko‘rishni maslahat beradi.'),

    T('B','Думаю про экономический факультет, но сначала нужно пройти подготовительные курсы.','dumayu pra ekanamichiskiy fakultyet no snachala nuzhno prayti padgatavitilnye kursy','Iqtisodiyot fakultetini o‘ylayapman, lekin avval tayyorlov kurslaridan o‘tish kerak.'),
    T('A','А твой диплом из Ташкента уже признали, или нужна нострификация?','a tvoy diplom iz tashkenta uzhe priznali ili nuzhna nostrifikatsiya','Toshkentdagi diplomingni tan olishdimi yoki nostrifikatsiya kerakmi?'),
    T('B','Пока нет. В университете сказали собрать переводы документов и заплатить пошлину.','paka nyet v universitete skazali sabrat pirivody dakumyentov i zaplatit poshlinu','Hozircha yo‘q. Universitetda hujjatlar tarjimasini yig‘ib, davlat boji to‘lashni aytishdi.'),
    T('A','Понятно. А чем ты хочешь заниматься через пять лет, уже знаешь?','panyatna a chem ty xochyesh zanimatsya chiriz pyat lyet uzhe znayesh','Tushunarli. Besh yildan keyin nima bilan shug‘ullanmoqchisan, bilasanmi?'),

    T('A','Правильно. Я тоже ищу стажировку, давай вместе посмотрим вакансии на сайте университета.','pravilna ya tozhe ishu stazhirovku davay vmyeste pasmatrim vakansii na sayte universiteta','To‘g‘ri. Men ham amaliyot qidiryapman, keling, universitet saytidagi vakansiyalarni birga ko‘raylik.'),

LESSONS.push({ id: 'b2b-08', type: 'P', sec: 12, title: 'Ishontirish, kelishish, murosa', sub: 'Убеждение и компромисс',
  intro: 'Ishontirish: убедить (ishontirmoq), уговорить (ko‘ndirmoq). Kelishish: уступить (yon bermoq), компромисс, договориться (kelishmoq).\nBosim qilmasdan, hurmat bilan: «Я понимаю, но…».\nVazmin rad etish: «К сожалению, не смогу».\nMisol: Давай найдём компромисс.',
  items: [
    P('Я пытался убедить хозяина квартиры снизить цену, но он не согласился даже на небольшую скидку.', 'ya pitalsya ubidit xazyaina kvartiry snizit tsenu no on nye saglasilsya dazhe na nibolshuyu skidku', 'Men kvartira egasini narxni tushirishga ishontirmoqchi bo‘ldim, lekin u kichik chegirmaga ham rozi bo‘lmadi.'),
    P('Давай найдём компромисс: ты платишь за интернет, а я беру на себя коммунальные услуги.', 'davay naydyom kamprames ty platish za intirnet a ya biru na sibya kammunalniye uslugi', 'Keling, murosa topaylik: sen internet uchun to‘lasang, men kommunal xizmatlarni o‘z zimmamga olaman.'),
    P('Я понимаю твою точку зрения, но мне кажется, что мы можем решить этот вопрос иначе.', 'ya panimayu tvayu tochku zryeniya no mnye kazhetsya shto my mozhem rishit etat vapros inache', 'Fikringni tushunaman, lekin menimcha, bu masalani boshqacha hal qilsak ham bo‘ladi.'),
    P('Если хочешь убедить начальника, приведи конкретные цифры и покажи, какую пользу получит компания.', 'yesli xochyesh ubidit nachalnika privedi kankretniye tsifry i pakazhi kakuyu polzu paluchit kampaniya', 'Boshliqni ishontirmoqchi bo‘lsang, aniq raqamlar keltir va kompaniya qanday foyda olishini ko‘rsat.'),
    P('Иногда приходится уступить, чтобы не портить отношения с людьми, с которыми потом долго работать.', 'inogda prixodistsya ustupit shtoby nye partit atnasheniya s lyudmi s katorymi potom dolga rabotat', 'Ba‘zan keyin uzoq ishlashga to‘g‘ri keladigan odamlar bilan munosabatni buzmaslik uchun yon berishga to‘g‘ri keladi.'),
    P('Я не хочу тебя обидеть, но, к сожалению, в эти выходные я никак не смогу помочь с переездом.', 'ya nye xachu tibya abidyet no k sazhalyeniyu v eti vyxodnye ya nikak nye smagu pamoch s pirieyezdam', 'Seni xafa qilishni istamayman, lekin afsuski, bu dam olish kunlari ko‘chishda yordam bera olmayman.', 'Vazmin rad etish: avval uzr, keyin sabab.'),
    P('Спасибо за предложение, но я лучше откажусь, потому что уже договорился с другим клиентом.', 'spasibo za pridlazheniye no ya luchshe atkazhus patamu shto uzhe dagavarilsya s drugim kliyentam', 'Taklif uchun rahmat, lekin rad etganim yaxshi, chunki boshqa mijoz bilan allaqachon kelishib qo‘yganman.'),
    P('Давайте встретимся посередине: я согласен на ваши сроки, если вы повысите оплату на десять процентов.', 'davayte vstryetimsya pasiridinye ya saglasyen na vashi sroki yesli vy pavysite aplatu na dyesyat pratsentov', 'Keling, o‘rtada uchrashaylik: siz to‘lovni o‘n foizga oshirsangiz, men sizning muddatlaringizga roziman.', 'Rasmiy muzokarada «вы» ishlatiladi.'),
    P('Он так долго меня уговаривал, что в итоге я махнул рукой и согласился на его условия.', 'on tak dolga minya ugavarival shto v itoge ya makhnul rukoy i saglasilsya na yevo uslaviya', 'U meni shunchalik uzoq ko‘ndirdiki, oxiri qo‘l siltab uning shartlariga rozi bo‘ldim.', '«Махнуть рукой» — qo‘l siltamoq, taslim bo‘lmoq.'),
    P('Когда спорить бесполезно, лучше сказать: давай вернёмся к этому разговору завтра, когда оба успокоимся.', 'kagda sparit byespolyezna luchshe skazat davay virnyomsya k etamu pagavoru zaftra kagda oba uspakoimsya', 'Bahslashishdan foyda bo‘lmasa, «bu suhbatga ertaga, ikkalamiz ham tinchlanganda qaytaylik» deyish yaxshiroq.'),
    P('Мне не хочется спорить, поэтому предлагаю решить вопрос голосованием, и пусть победит большинство.', 'mnye nye xochitsya sparit paetomu pridlagayu rishit vapros galasavaniyem i pust pabedit bolshinstvo', 'Bahslashgim kelmayapti, shuning uchun masalani ovoz berish bilan hal qilishni taklif qilaman, ko‘pchilik g‘alaba qozonsin.'),
    P('Чтобы вежливо отказаться, можно сказать: мне очень приятно, но, боюсь, это сейчас не для меня.', 'shtoby vezhliva atkazatsya mozhna skazat mnye ochin priyatna no bayus eta syeychas nye dlya minya', 'Xushmuomalalik bilan rad etish uchun «juda yoqimli, lekin qo‘rqamanki, bu hozir men uchun emas» deyish mumkin.', 'Ko‘chada ko‘pincha: «Да нет, я пас».'),
    P('Хороший собеседник не давит, а задаёт вопросы и помогает другому самому прийти к выводу.', 'xarashiy sabisyednik nye davit a zadayot vaprosy i pamagayet drugomu samamu priyti k vyvadu', 'Yaxshi suhbatdosh bosim qilmaydi, savol beradi va boshqaga o‘zi xulosaga kelishiga yordam beradi.'),
  ],
  talk: [
    T('A','Слушай, можно тебя попросить об одной услуге? Мне нужно поменяться сменами на субботу.','slushay mozhna tibya prasit ab adnoy uslugye mnye nuzhno paminyatsya smyenami na subotu','Eshit, senden bitta xizmat so‘rasam bo‘ladimi? Shanba kuniga smenani almashtirishim kerak.'),
    T('B','Вообще-то в субботу у меня планы, мы с семьёй едем на рынок за продуктами.','vapsche ta v subotu u minya plany my s semyoy yedyem na rynak za praduktami','Aslida shanba kuni rejalarim bor, oilam bilan mahsulot olish uchun bozorga boramiz.'),
    T('A','Понимаю, но у меня утром важное собеседование, и я правда не могу его пропустить.','panimayu no u minya utram vazhnaye sabisyedavaniye i ya pravda nye magu yevo prapustit','Tushunaman, lekin ertalab muhim suhbatim bor va uni haqiqatan o‘tkazib yubora olmayman.'),
    T('B','Тогда давай договоримся: я выйду в субботу, а ты за это отработаешь мою смену в воскресенье.','tagda davay dagavorimsya ya vyydu v subotu a ty za eta atrabotayesh mayu smyenu v vaskrisenye','Unda kelishaylik: men shanba kuni chiqaman, sen buning evaziga yakshanba kuni mening smenamni ishlab berasan.'),
    T('A','Отлично, это справедливо. Только воскресенье я возьму с обеда, а не с утра, можно?','atlichna eta spravidlivo tolka vaskrisenye ya vazmu s abyeda a nye s utra mozhna','Ajoyib, bu adolatli. Faqat yakshanbani ertalabdan emas, tushlikdan olsam bo‘ladimi?'),
    T('B','Хорошо, пусть будет с обеда, но предупреди начальника заранее, чтобы потом не было претензий.','xarasho pust budit s abyeda no pridupridi nachalnika zaranee shtoby potom nye bylo pritenziy','Yaxshi, tushlikdan bo‘lsin, lekin keyin e‘tiroz bo‘lmasligi uchun boshliqni oldindan ogohlantir.'),
    T('A','Конечно, я напишу ему прямо сейчас и скажу, что мы уже обо всём договорились.','kanyeshna ya napishu yemu pryama syeychas i skazhu shto my uzhe ab vsyom dagavarilis','Albatta, hozirning o‘zida unga yozaman va hammasini allaqachon kelishib olganimizni aytaman.'),
    T('B','Спасибо, что не стал давить. С тобой приятно договариваться.','spasibo shto nye stal davit s tabay priyatna dagavarivatsya','Bosim qilmaganing uchun rahmat. Sen bilan kelishish yoqimli.'),
  ]
});

LESSONS.push({ id: 'b2b-d1', type: 'D', sec: 12, title: 'Suhbat: ish va biznes muzokaralari', sub: 'Диалог · Работа и переговоры',
  items: [
    D('Расскажите, чем вы занимаетесь и какой у вас опыт работы?', 'raskazhite chem vy zanimayetes i kakoy u vas opyt raboty', 'Ayting-chi, nima bilan shug‘ullanasiz va ish tajribangiz qanday?',
      'Я работаю прорабом на строительных объектах уже шесть лет. Сначала я был простым рабочим, потом освоил чертежи, а теперь руковожу бригадой из десяти человек.', 'ya rabotayu prarabam na stroitilnyx abyektax uzhe shest lyet snachala ya byl prostym rabochim potom asvoil chirtyozhi a tipyer rukavazhu brigadoy iz dyesyati chilavyek', 'Men qurilish obyektlarida olti yildan beri prorab bo‘lib ishlayman. Avval oddiy ishchi edim, keyin chizmalarni o‘rgandim, hozir esa o‘n kishilik brigadani boshqaraman.'),
    D('Почему вы хотите перейти именно в нашу компанию?', 'pachimu vy xatitye piriyti imyenna v nashu kampaniyu', 'Nega aynan bizning kompaniyaga o‘tmoqchisiz?',
      'Мне нравится, что у вас стабильные заказы и официальное оформление. На нынешнем месте мне не хватает перспектив роста, а я хочу развиваться и брать больше ответственности.', 'mnye nravitsya shto u vas stabilniye zakazy i afitsialnaye aformleniye na ninishnem myeste mnye nye xvatayet pirspyektiv rosta a ya xachu razvivatsya i birat bolshe atvyetstvennosti', 'Sizlarda buyurtmalar barqaror va rasmiy rasmiylashtirish borligi menga yoqadi. Hozirgi joyimda o‘sish istiqbollari yetishmaydi, men esa rivojlanib, ko‘proq mas‘uliyat olmoqchiman.'),
    D('Какую зарплату вы ожидаете на этой должности?', 'kakuyu zarplatu vy azhidayete na etoy dalzhnosti', 'Bu lavozimda qancha oylik kutyapsiz?',
      'Исходя из моего опыта и средних цен на рынке, я рассчитываю на сто двадцать тысяч рублей в месяц. Но я готов обсудить, если в пакет входят премии и оплачиваемый отпуск.', 'isxodya iz mayevo opyta i sridnix tsen na rynke ya raschityvayu na sto dvatsat tysyach rublyey v myesyats no ya gatov absudit yesli v pakyet vxodyat primii i aplachivayemiy atpusk', 'Tajribam va bozordagi o‘rtacha narxlardan kelib chiqib, oyiga yuz yigirma ming rubl kutaman. Lekin paketga mukofotlar va haq to‘lanadigan ta‘til kirsa, muhokama qilishga tayyorman.'),
    D('Как вы обычно решаете конфликты внутри бригады?', 'kak vy abychna rishayete kanflikty vnutri brigady', 'Brigada ichidagi nizolarni odatda qanday hal qilasiz?',
      'Сначала я стараюсь выслушать обе стороны наедине, чтобы никто не оправдывался при всех. Потом предлагаю решение, которое устроит всех, а если нужно, обращаюсь к руководству.', 'snachala ya starayus vyslushat obye storony nayedine shtoby nikto nye apravdyvalsya pri vsyex patom pridlagayu rishyeniye katoraye ustroit vsyex a yesli nuzhno abrashchayus k rukavodstvu', 'Avval ikkala tomonni yolg‘iz tinglashga harakat qilaman, hech kim hammaning oldida oqlanmasligi uchun. Keyin hammaga ma‘qul yechim taklif qilaman, kerak bo‘lsa rahbariyatga murojaat qilaman.'),
    D('Что вы будете делать, если клиент недоволен сроками?', 'shto vy budyete dyelat yesli kliyent nidavolen srokami', 'Mijoz muddatlardan norozi bo‘lsa, nima qilasiz?',
      'Я прямо объясню причину задержки и предложу новый реалистичный график. Обещать невозможное не буду, потому что честность важнее, чем быстрое, но пустое «да».', 'ya pryama abyasnyu prichinu zaderzhki i pridlazhu noviy realistichniy grafik abishchat nivazmozhnaye nye budu patamu shto chestnast vazhnee chem bystraye no pustoye da', 'Kechikish sababini ochiq tushuntiraman va yangi real jadval taklif qilaman. Imkonsizni va‘da qilmayman, chunki halollik tez, lekin quruq «ha» dan muhimroq.'),
    D('Как вы относитесь к переработкам и работе в выходные?', 'kak vy atnasitis k pirirabotkam i rabotye v vyxodnye', 'Ortiqcha ishlash va dam olish kunlari ishlashga munosabatingiz qanday?',
      'В срочных случаях я готов выйти, но при условии, что переработку оплатят или дадут отгул. Если это происходит каждую неделю, значит, проблема в планировании, и её нужно решать.', 'v srochnyx sluchayax ya gatov vyyti no pri uslovii shto pirirabotku aplatyat ili dadut atgul yesli eta praisxodit kazhduyu nidyelyu znachit prablema v planirovanii i yeyo nuzhno rishat', 'Shoshilinch hollarda chiqishga tayyorman, lekin ortiqcha ish to‘lansa yoki otgul berilsa. Agar bu har hafta takrorlansa, demak muammo rejalashtirishda va uni hal qilish kerak.', 'Отгул — ortiqcha ishlagan kun evaziga dam olish kuni.'),
    D('Какие условия договора для вас самые важные?', 'kakiye uslaviya dagavora dlya vas samye vazhnye', 'Shartnomaning qaysi shartlari siz uchun eng muhim?',
      'Для меня главное — официальное оформление, чёткий срок выплаты зарплаты и описание обязанностей. Всё остальное, например график, можно обсудить, но эти три пункта я хочу видеть в тексте договора.', 'dlya minya glavnaye afitsialnaye aformleniye chyotkiy srok vyplaty zarplaty i apisaniye abyazannostyey vsyo astalnoye napremer grafik mozhna absudit no eti tri punkta ya xachu videt v tekste dagavora', 'Men uchun asosiysi — rasmiy rasmiylashtirish, oylik to‘lashning aniq muddati va vazifalar tavsifi. Qolganini, masalan jadvalni, muhokama qilsa bo‘ladi, lekin shu uch bandni shartnoma matnida ko‘rishni xohlayman.'),
    D('Вы бы согласились на испытательный срок?', 'vy by saglasilis na ispytatilniy srok', 'Sinov muddatiga rozi bo‘larmidingiz?',
      'Да, я считаю это нормальной практикой, и три месяца меня устраивают. Только прошу, чтобы в этот период зарплата не была ниже обещанной и меня тоже оформили официально.', 'da ya schitayu eta narmalnoy praktikoy i tri myesyatsa minya ustraivayut tolka prashu shtoby v etat piriyot zarplata nye byla nizhe abyeshannoy i minya tozhe aformili afitsialna', 'Ha, buni normal amaliyot deb bilaman va uch oy meni qoniqtiradi. Faqat shu davrda oylik va‘da qilinganidan past bo‘lmasligini va meni ham rasman rasmiylashtirishlarini so‘rayman.'),
    D('Как вы планируете расти в нашей компании в ближайшие годы?', 'kak vy planiruyete rasti v nashey kampanii v blizhayshiye gody', 'Kelgusi yillarda bizning kompaniyada qanday o‘sishni rejalashtiryapsiz?',
      'Через год я хотел бы стать старшим прорабом, а через три-четыре года руководить целым объектом. Для этого я готов пройти курсы по охране труда и по составлению смет.', 'chiriz got ya xatyel by stat starshim prarabam a chiriz tri chityre goda rukavadit tselym abyektam dlya etava ya gatov prayti kursy pa axrane truda i pa sastavlyeniyu smyet', 'Bir yildan keyin katta prorab bo‘lishni, uch-to‘rt yildan keyin esa butun obyektni boshqarishni istardim. Buning uchun mehnat muhofazasi va smeta tuzish kurslaridan o‘tishga tayyorman.'),
    D('У вас есть вопросы к нам?', 'u vas yest vaprosy k nam', 'Sizda bizga savollar bormi?',
      'Да, несколько. Подскажите, пожалуйста, как устроена оплата труда, есть ли обучение за счёт компании и кто будет моим непосредственным руководителем?', 'da nyeskolka padskazhite pazhalusta kak ustroyena aplata truda yest li abuchenie za schyot kampanii i kto budit moim nipasryedstvenniym rukavaditilem', 'Ha, bir nechta. Iltimos, ayting-chi, mehnat haqi qanday tashkil etilgan, o‘qitish kompaniya hisobidanmi va bevosita rahbarim kim bo‘ladi?', 'Savol berish — qiziqish belgisi.'),
  ]
});

LESSONS.push({ id: 'b2b-d2', type: 'D', sec: 12, title: 'Suhbat: madaniyat va turmush', sub: 'Диалог · Культура и жизнь',
  items: [
    D('Что вас больше всего удивило в России, когда вы приехали?', 'shto vas bolshe vsivo udivilo v rasii kagda vy priyexali', 'Rossiyaga kelganingizda sizni eng ko‘p nima hayratga soldi?',
      'Больше всего удивило, что люди на улице редко улыбаются незнакомым, но при этом готовы помочь, если попросить. Ещё я не ожидал, что зимой в магазинах и в метро будет так жарко.', 'bolshe vsivo udivilo shto lyudi na ulitse ryedka ulybayutsya nyeznakomym no pri etom gatovy pamoch yesli paprasit yeshyo ya nye azhidal shto zimoy v magazinax i v mitro budit tak zharka', 'Eng ko‘p hayratga solgani, ko‘chada odamlar notanishlarga kam kulishadi, lekin so‘rasang yordam berishga tayyor. Yana qishda do‘konlar va metroda bunchalik issiq bo‘lishini kutmagandim.'),
    D('Чем узбекское гостеприимство отличается от русского?', 'chem uzbyekskaye gastiprimstvo atlichayetsya at ruskava', 'O‘zbek mehmondo‘stligi ruscha mehmondo‘stlikdan nimasi bilan farq qiladi?',
      'У нас гость почти всегда получает целый дастархан с обильным угощением, даже если пришёл без предупреждения. Русские чаще зовут заранее и угощают проще, но тоже стараются, чтобы гость не ушёл голодным.', 'u nas gost pachti vsigda paluchayet tseliy dastarxan s abilnym ugashchyeniyem dazhe yesli prishol byez pridupryezhdeniya ruskiye chashche zovut zaranee i ugashchayut prashche no tozhe staravtsya shtoby gost nye ushol galadnym', 'Bizda mehmon deyarli doim to‘liq dasturxon va mo‘l-ko‘l ziyofat oladi, hatto ogohlantirmay kelgan bo‘lsa ham. Ruslar ko‘pincha oldindan chaqiradi va soddaroq mehmon qiladi, lekin ular ham mehmon och ketmasligi uchun harakat qiladi.'),
    D('Как вы отмечаете праздники здесь, вдали от семьи?', 'kak vy atmechayete prazdniki zdyes vdali at simi', 'Bu yerda, oilangizdan uzoqda bayramlarni qanday nishonlaysiz?',
      'Обычно мы собираемся с друзьями, готовим плов и звоним родителям по видеосвязи. Праздник получается не такой, как дома, но тёплая компания помогает меньше скучать.', 'abychna my sabiramsya s druzyami gatovim plov i zvonim radityelyam pa vidiasvyazi prazdnik paluchayetsya nye takoy kak doma no tyoplaya kampaniya pamagayet menshe skuchat', 'Odatda do‘stlar bilan yig‘ilamiz, palov pishiramiz va ota-onaga videoaloqa orqali qo‘ng‘iroq qilamiz. Bayram uydagidek bo‘lmaydi, lekin samimiy davra kamroq sog‘inishga yordam beradi.'),
    D('Какие русские традиции вам понравились больше всего?', 'kakiye ruskiye traditsii vam panravilis bolshe vsivo', 'Rus an‘analaridan qaysilari sizga eng ko‘p yoqdi?',
      'Мне понравилось, что на Новый год вся семья собирается за одним столом и дарит друг другу подарки. А ещё я полюбил баню: после неё чувствуешь себя совсем другим человеком.', 'mnye panravilas shto na noviy got vsya simya sabirayetsya za adnim stalom i darit druk drugu padarki a yeshyo ya paliubil banyu posle nyeyo chustvuyesh sibya sovsyem drugim chilavyekam', 'Yangi yilda butun oila bitta dasturxon atrofiga yig‘ilib, bir-biriga sovg‘a berishi menga yoqdi. Yana hammomni yaxshi ko‘rib qoldim: undan keyin o‘zingni butunlay boshqa odamdek his qilasan.'),
    D('Как вы относитесь к тому, что здесь все сидят в телефонах?', 'kak vy atnasitis k tomu shto zdyes vsye sidyat v tilifonax', 'Bu yerda hamma telefonga termulib o‘tirishiga qanday qaraysiz?',
      'Честно говоря, дома то же самое, просто привычки у всех похожи. Но я стараюсь за общим столом убирать телефон, потому что считаю это знаком уважения.', 'chestna gavarya doma to zhe samaye prosta privychki u vsyex pakhozhi no ya starayus za obshchim stalom ubirat tilifon patamu shto schitayu eta znakam uvazheniya', 'Rostini aytsam, uyda ham xuddi shunday, odatlar hammada o‘xshash. Lekin umumiy dasturxonda telefonni olib qo‘yishga harakat qilaman, chunki buni hurmat belgisi deb bilaman.'),
    D('Трудно ли вам было привыкнуть к местной еде?', 'trudna li vam bylo privyknut k myestnoy yede', 'Mahalliy ovqatga ko‘nikish sizga qiyin bo‘ldimi?',

        '<p class="note">' + esc(it.note) + '</p>' +
        '<div class="exbox"><span class="ru">' + esc(it.ex) + '</span><span>' + esc(it.exuz) + '</span></div>' +
        '<div class="audio-row">' + (it.say ? playBtn(it.ru.toLowerCase(), 'Harf') : '') + playBtn(it.ex, 'So‘z') + '</div>';
    } else if (it.kind === 'D') {
      h += '<div class="bubble q"><span class="who">Savol</span><p class="b2">' + esc(it.ru) + '</p><p class="s2">' + esc(it.say) + '</p><p class="note">' + esc(it.uz) + '</p>' + playBtn(it.ru, 'Eshitish') + '</div>' +
        '<div class="bubble a"><span class="who">Javob</span><p class="b2">' + esc(it.ans) + '</p><p class="s2">' + esc(it.asay) + '</p><p class="note">' + esc(it.auz) + '</p>' + playBtn(it.ans, 'Eshitish') + '</div>' +
        (it.note ? '<p class="pnote">' + esc(it.note) + '</p>' : '') +
        '<p class="note">Javobni ovoz chiqarib 3 marta ayting.</p>';
    } else {
      h += '<p class="bigru">' + esc(it.ru) + '</p><p class="say">' + esc(it.say) + '</p><p class="uz">' + esc(it.uz) + '</p>' +
        '<div class="audio-row">' + playBtn(it.ru, 'Eshitish') + '</div>' +
        (it.note ? '<p class="pnote">' + esc(it.note) + '</p>' : '') +
        '<p class="note">Ovoz chiqarib 3 marta ayting.</p>';
    }
    h += '</section>';
    app.innerHTML = h;
    var last = Q.c >= n - 1;
    dock((Q.c > 0 ? '<button type="button" class="btn ghost" data-act="prev">Oldingi</button>' : '') +
      '<button type="button" class="btn" data-act="' + (last ? (l.talk ? 'talk' : 'begin') : 'next') + '">' + (last ? (l.talk ? 'Suhbatni ko‘rish' : 'Mashqni boshlash') : 'Keyingi') + '</button>');
    toTop();
  }
  /* Dars suhbati: haqiqiy gaplashuv namunasi */
  function renderTalk() {
    V = 'talk'; Q.stage = 'talk';
    var l = Q.lesson, h = qhead(l.items.length - 1, l.items.length);
    h += '<section class="card"><p class="intro">Haqiqiy suhbat namunasi. Avval tinglang, keyin B rolini o‘zingiz ayting.</p>';
    l.talk.forEach(function (x, i) {
      h += '<div class="bubble ' + (x.who === 'A' ? 'q' : 'a') + '"><span class="who">' + (x.who === 'A' ? 'A' : 'B') + '</span>' +
        '<p class="b2">' + esc(x.ru) + '</p><p class="s2">' + esc(x.say) + '</p><p class="note">' + esc(x.uz) + '</p>' + playBtn(x.ru, 'Eshitish') + '</div>';
    });
    h += (ttsUsable() ? '<div class="audio-row"><button type="button" class="play big" data-act="playall" aria-label="Butun suhbatni eshitish">' + ICON + '<span>Hammasini eshitish</span></button></div>' : '') +
      '<p class="note">Keyin A rolini tinglab, B ning gaplarini ovoz chiqarib ayting.</p></section>';
    app.innerHTML = h;
    dock('<button type="button" class="btn ghost" data-act="prev">Oldingi</button><button type="button" class="btn" data-act="begin">Mashqni boshlash</button>');
    toTop();
  }
  function playAll() {
    if (!TTS.ok || !Q || !Q.lesson || !Q.lesson.talk) return;
    try {
      var syn = window.speechSynthesis; syn.cancel();
      Q.lesson.talk.forEach(function (x) {
        var u = new window.SpeechSynthesisUtterance(x.ru);
        u.lang = 'ru-RU'; if (TTS.voice) u.voice = TTS.voice;
        u.rate = S.slow ? 0.65 : 0.9; u.pitch = x.who === 'A' ? 1 : 0.8;
        syn.speak(u);
      });
    } catch (e) {}
  }

  /* ---------- Mashq ---------- */
  function beginQuiz() {
    var l = Q.lesson;
    Q.list = buildQuestions(l.items, { cap: 14, speak: l.type === 'P' ? 3 : (l.type === 'D' ? 4 : 0) });
    Q.first = Q.list.length; Q.i = 0; Q.correct = 0; Q.xp = 0; Q.stage = 'quiz';
    renderQuiz();
  }
  function startReview() {
    var items = dueItems();
    if (!items.length) {
      items = ALL.filter(function (it) { var s = S.items[it.id]; return s && s.s; })
        .sort(function (a, b) { return itemState(a).b - itemState(b).b; }).slice(0, 10);
    }
    items = shuffle(items).slice(0, 10);
    if (!items.length) return;
    Q = { kind: 'review', lesson: null, stage: 'quiz', list: [], i: 0, correct: 0, first: 0, xp: 0 };
    Q.list = buildQuestions(items, { cap: items.length, speak: 0 });
    Q.first = Q.list.length;
    renderQuiz();
  }
  function startSpeak() {
    var seen = ALL.filter(function (it) { var s = S.items[it.id]; return it.kind !== 'L' && s && s.s; });
    var items = shuffle(seen).sort(function (a, b) { return itemState(a).b - itemState(b).b; }).slice(0, 8);
    if (!items.length) return;
    Q = { kind: 'speak', lesson: null, stage: 'quiz', list: [], i: 0, correct: 0, first: 0, xp: 0 };
    Q.list = shuffle(items).map(function (it) { return mk(it.kind === 'D' ? 'speakD' : 'speak', it); });
    Q.first = Q.list.length;
    renderQuiz();
  }
  function isSpeak(t) { return t === 'speak' || t === 'speakD'; }
  function renderQuiz() {
    V = 'quiz';
    var q = Q.list[Q.i], total = Q.list.length, it = q.it, h = qhead(Q.i, total), t = q.t;
    var answered = q.ans !== null;
    h += '<section class="qprompt">';
    if (t === 'ru2uz') {
      h += '<p class="qlabel">Bu nima degani?</p><p class="bigru">' + esc(it.ru) + '</p><p class="say">' + esc(it.say) + '</p>' + playBtn(it.ru, 'Eshitish');
    } else if (t === 'uz2ru') {
      h += '<p class="qlabel">Ruscha qaysi?</p><p class="uzp">' + esc(it.uz) + '</p>';
    } else if (t === 'listen') {
      h += '<p class="qlabel">Eshiting va tarjimasini toping</p>' + (playBtn(it.ru, 'Eshitish', true) || '<p class="note">Ovoz mavjud emas.</p>');
    } else if (t === 'Lword') {
      h += '<p class="qlabel">Qaysi so‘zda «' + esc(it.ru) + '» harfi bor?</p><p class="bigletter">' + esc(it.ru) + '</p>';
    } else if (t === 'Lsound') {
      h += '<p class="qlabel">Bu harf qanday o‘qiladi?</p><p class="bigletter">' + esc(it.ru) + '</p>';
    } else if (t === 'Lletter') {
      h += '<p class="qlabel">Qaysi harf «' + esc(it.say) + '» tovushini beradi?</p>';
    } else if (t === 'Llisten') {
      h += '<p class="qlabel">Eshiting: bu so‘z nima degani?</p>' + (playBtn(it.ex, 'Eshitish', true) || '');
    } else if (t === 'speak') {
      h += '<p class="qlabel">Ruscha ovoz chiqarib ayting</p><p class="uzp">' + esc(it.uz) + '</p>';
    } else if (t === 'dia') {
      h += '<p class="qlabel">Savolga mos javobni toping</p><div class="bubble q"><span class="who">Sizdan so‘rashadi</span><p class="b2">' + esc(it.ru) + '</p><p class="note">' + esc(it.uz) + '</p>' + playBtn(it.ru, 'Eshitish') + '</div>';
    } else if (t === 'speakD') {
      h += '<p class="qlabel">Savolga ruscha javob bering (ovoz chiqarib)</p><div class="bubble q"><span class="who">Sizdan so‘rashadi</span><p class="b2">' + esc(it.ru) + '</p><p class="note">' + esc(it.uz) + '</p>' + playBtn(it.ru, 'Eshitish') + '</div>';
    }
    h += '</section>';
    if (isSpeak(t)) {
      if (!q.rev) {
        h += '<button type="button" class="btn wide" data-act="reveal">Javobni ko‘rsatish</button>';
        app.innerHTML = h; dock('');
      } else {
        h += t === 'speakD'
          ? '<section class="reveal"><div class="bubble a"><span class="who">Javob</span><p class="b2">' + esc(it.ans) + '</p><p class="s2">' + esc(it.asay) + '</p><p class="note">' + esc(it.auz) + '</p>' + playBtn(it.ans, 'Eshitish') + '</div></section>'
          : '<section class="reveal"><p class="bigru">' + esc(it.ru) + '</p><p class="say">' + esc(it.say) + '</p>' + playBtn(it.ru, 'Eshitish') + '</section>';
        if (answered) h += feedback(q);
        app.innerHTML = h;
        dock(answered ? nextBtn() : '<button type="button" class="btn ghost" data-act="spk" data-ok="0">Qiynaldim</button><button type="button" class="btn" data-act="spk" data-ok="1">Ayta oldim</button>');
      }
    } else {
      var cls = t === 'Lletter' ? ' centered' : (t === 'uz2ru' || t === 'Lword' || t === 'dia' ? ' ru' : '');
      var grid = t === 'Lletter' || t === 'Lsound';
      h += '<div class="opts' + (grid ? ' grid2' : '') + '" role="group" aria-label="Javoblar">' + q.opts.map(function (o, i) {
        var c = 'opt' + cls;
        if (answered) { if (o.ok) c += ' good'; else if (i === q.ans) c += ' bad'; else c += ' dim'; }
        return '<button type="button" class="' + c + '" data-act="pick" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' + esc(o.label) + '</button>';
      }).join('') + '</div>';
      if (answered) h += feedback(q);
      app.innerHTML = h;
      dock(answered ? nextBtn() : '');
    }
    toTop();
    if (!q.played && !answered && (t === 'listen' || t === 'Llisten')) { q.played = true; speak(t === 'listen' ? it.ru : it.ex); }
  }
  function nextBtn() { return '<button type="button" class="btn" data-act="nextq">Keyingi</button>'; }
  function feedback(q) {
    var it = q.it, ok = isSpeak(q.t) ? q.ans === 1 : q.opts[q.ans].ok, h;
    var more = it.kind === 'P'
      ? '<span class="ru">' + esc(it.ru) + '</span><span>' + esc(it.say) + '</span><span>' + esc(it.uz) + '</span>'
      : (it.kind === 'D'
        ? '<span class="ru">' + esc(it.ru) + '</span><span>' + esc(it.uz) + '</span><span class="ru">' + esc(it.ans) + '</span><span>' + esc(it.auz) + '</span>'
        : '<span class="ru">' + esc(it.ru + it.ru.toLowerCase()) + '</span><span>' + (it.say ? '«' + esc(it.say) + '»' : 'tovush bermaydi') + '</span><span>' + esc(it.ex) + ' — ' + esc(it.exuz) + '</span>');
    if (isSpeak(q.t)) {
      h = '<div class="fb ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? 'Zo‘r!' : 'Hechqisi yo‘q, takrorlaymiz.') + '</b></div>';
    } else if (ok) {
      h = '<div class="fb good"><b>To‘g‘ri!</b><div class="more">' + more + '</div></div>';
    } else {
      var right = q.opts.filter(function (o) { return o.ok; })[0].label;
      h = '<div class="fb bad"><b>To‘g‘ri javob: ' + esc(right) + '</b><div class="more">' + more + '</div></div>';
    }
    return h;
  }
  function settle(ok) {
    var q = Q.list[Q.i];
    q.ans = isSpeak(q.t) ? (ok ? 1 : 0) : q.ans;
    if (!q.retry) {
      recordAnswer(q.it, ok);
      if (ok) { addCorrect(); Q.correct++; Q.xp += 10; }
      else {
        var c = mk(q.t, q.it); c.retry = true; if (isSpeak(q.t)) c.rev = false; Q.list.push(c);
      }
      save();
    }
  }
  function finish() {
    V = 'result'; Q.stage = 'result';
    if (Q.kind === 'lesson') { S.done[Q.lesson.id] = true; S.xp += 20; Q.xp += 20; }
    else { S.xp += 10; Q.xp += 10; }
    touchStreak(); save();
    var pct = Q.first ? Math.round(Q.correct / Q.first * 100) : 0;
    var msg = pct >= 90 ? 'Ajoyib natija!' : pct >= 70 ? 'Yaxshi, davom eting.' : 'Hechqisi yo‘q, takrorlash yordam beradi.';
    var next = Q.kind === 'lesson' ? LESSONS.filter(function (l) { return !S.done[l.id]; })[0] : null;
    var h = '<section class="card result"><p class="eyebrow">' + (Q.kind === 'lesson' ? esc(Q.lesson.title) + ' · tugadi' : (Q.kind === 'speak' ? 'Gapirish mashqi tugadi' : 'Takrorlash tugadi')) + '</p>' +
      '<p class="score num">' + Q.correct + '/' + Q.first + '</p><p class="msg">' + msg + '</p>' +
      '<div class="xpline"><span class="chip num">+' + Q.xp + ' XP</span><span class="chip warm num">' + streakNow() + ' kun ketma-ket</span></div>' +
      '<p class="note">Birinchi urinishdagi to‘g‘ri javoblar hisoblandi.</p></section>';
    app.innerHTML = h;
    dock('<button type="button" class="btn ghost" data-act="home">Bosh sahifa</button>' +
      (next ? '<button type="button" class="btn" data-act="start" data-id="' + next.id + '">Keyingi dars</button>' : '<button type="button" class="btn" data-act="review">Takrorlash</button>'));
    toTop();
  }

  /* ---------- Harakatlar ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b || b.disabled) return;
    var a = b.getAttribute('data-act');
    if (a === 'home') renderHome();
    else if (a === 'start') startLesson(b.getAttribute('data-id'));
    else if (a === 'review') startReview();
    else if (a === 'speakp') startSpeak();
    else if (a === 'next') { Q.c++; renderCards(); }
    else if (a === 'prev') { if (Q.stage === 'talk') { Q.stage = 'cards'; renderCards(); } else { Q.c = Math.max(0, Q.c - 1); renderCards(); } }
    else if (a === 'talk') renderTalk();
    else if (a === 'playall') playAll();
    else if (a === 'begin') beginQuiz();
    else if (a === 'play') speak(b.getAttribute('data-t'));
    else if (a === 'slow') { S.slow = !S.slow; save(); renderHome(); }
    else if (a === 'pick') {
      var q = Q.list[Q.i]; if (q.ans !== null) return;
      q.ans = +b.getAttribute('data-i'); settle(q.opts[q.ans].ok); renderQuiz();
    }
    else if (a === 'reveal') { Q.list[Q.i].rev = true; renderQuiz(); }
    else if (a === 'spk') { var q2 = Q.list[Q.i]; if (q2.ans !== null) return; settle(b.getAttribute('data-ok') === '1'); renderQuiz(); }
    else if (a === 'nextq') { Q.i++; if (Q.i >= Q.list.length) finish(); else renderQuiz(); }
  });

  /* ---------- Hisobga ulanish (db) ---------- */
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })]); }
  async function connect() {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      try { tg.ready(); tg.expand(); } catch (e) {}
      var cs = tg.CloudStorage;
      if (!cs || !tg.initData) return;
      function csGet(keys) { return new Promise(function (res, rej) { cs.getItems(keys, function (e, v) { e ? rej(e) : res(v || {}); }); }); }
      function csSet(k, v) { return new Promise(function (res, rej) { cs.setItem(k, v, function (e) { e ? rej(e) : res(); }); }); }
      var CH = 3000, lastChunks = [];
      dbDoc = { set: function (p) {
        var s = p.state, chunks = [];
        for (var i = 0; i < s.length; i += CH) chunks.push(s.slice(i, i + CH));
        var seq = Promise.resolve();
        chunks.forEach(function (c, i) { if (lastChunks[i] !== c) seq = seq.then(function () { return csSet('rs' + i, c); }); });
        return seq.then(function () { return csSet('rsmeta', JSON.stringify({ n: chunks.length, u: p.updated })); }).then(function () { lastChunks = chunks; });
      } };
      var m = await withTimeout(csGet(['rsmeta']), 8000);
      cloud = true;
      var meta = null; try { meta = m.rsmeta ? JSON.parse(m.rsmeta) : null; } catch (e) {}
      if (meta && meta.n) {
        var keys = []; for (var i = 0; i < meta.n; i++) keys.push('rs' + i);
        var vals = await withTimeout(csGet(keys), 10000);
        var txt = keys.map(function (k) { return vals[k] || ''; }); lastChunks = txt;
        var r = null; try { r = JSON.parse(txt.join('')); } catch (e) {}
        if (valid(r) && (r.updated || 0) >= (S.updated || 0)) { S = norm(r); writeLocal(); if (V === 'home') renderHome(); }
        else if ((S.updated || 0) > 0) queueDb();
      } else if ((S.updated || 0) > 0) queueDb();
      var sn = $('syncNote'); if (sn) sn.textContent = 'Natijalaringiz Telegram hisobingizda saqlanadi.';
      document.addEventListener('visibilitychange', function () { if (document.hidden) { clearTimeout(timer); queueDb(); } });
    } catch (e) { dbDoc = null; cloud = false; }
  }

  var local = readLocal();
  if (valid(local)) S = norm(local);
  renderHome();
  connect();
})();
</script>
</body></html>
