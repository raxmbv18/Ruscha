    P('Разбитая чашка так и осталась лежать на полу, потому что никто не хотел собирать осколки.', 'razbitaya chashka tak i astalas lezhat na palu patamu shto nikto nye xatyel sabirat askolki', 'Singan piyola polda yotaverdi, chunki hech kim siniqlarni yig‘ishtirgisi kelmadi.', 'Разбитая — «singan»: -тая, -нная qo‘shimchalari majhul sifatdosh.'),
    P('Купленные вчера на рынке помидоры оказались такими невкусными, что я отнёс их обратно продавцу.', 'kuplennyye fchira na rynkye pamidory azalis takimi nyevkusnymi shto ya atnyos ix abratna pradavtsu', 'Kecha bozordan sotib olingan pomidorlar shunchalik mazasiz chiqdiki, ularni sotuvchiga qaytarib berdim.'),
    P('Уходя с работы, не забудь выключить свет и закрыть окна, а то начальник опять будет ругаться.', 'uxadya s raboty nye zabut vyklyuchit svyet i zakryt akna a to nachalnik apyat budyet rugatsa', 'Ishdan chiqayotib, chiroqni o‘chirib, derazalarni yopishni unutma, bo‘lmasa boshliq yana jahl qiladi.'),
    P('Человек, опоздавший на собеседование, редко получает работу, даже если у него хорошее резюме.', 'chilavyek apazdavshiy na sabisyedavaniye ryedka paluchayet rabotu dazhe yesli u nyevo xarashiye rizyume', 'Suhbatga kech qolgan odam, hatto yaxshi rezyumesi bo‘lsa ham, kamdan-kam hollarda ishga qabul qilinadi.', 'Опоздавший — «kech qolgan»: -вший o‘tgan zamon faol sifatdoshi.'),
    P('Пришедший вчера курьер оставил посылку у соседей, потому что дома никого не оказалось.', 'prishedshiy fchira kuryer astavil pasylku u sasyedyey patamu shto doma nikavo nye azalas', 'Kecha kelgan kuryer uyda hech kim chiqmagani uchun posilkani qo‘shnilarga qoldirib ketdi.'),
    P('Стоя в очереди в МФЦ, я успел прочитать все объявления на стенде и выучить десять новых слов.', 'stoya v ochiridi v em ef tse ya uspyel prachitat vsye abyavlyeniya na stendye i vyuchit dyesyat novyx slof', 'MFCda navbatda turib, men stenddagi barcha e’lonlarni o‘qib chiqishga va o‘nta yangi so‘z o‘rganishga ulgurdim.'),
  ],
  talk: [
    T('A','Видел человека, сидящего у входа? Это наш новый комендант, он только что приехал.','vidyel chilavyeka sidyashiva u fxoda eta nash novyy kamendant on tolka shto priyexal','Kirish oldida o‘tirgan odamni ko‘rdingmi? Bu bizning yangi komendantimiz, hozirgina kelgan.'),
    T('B','Видел. Читая объявление на двери, он что-то записывал в блокнот.','vidyel chitaya abyavlyeniye na dvyeri on shtota zapisyval v blaknot','Ko‘rdim. Eshikdagi e’lonni o‘qib turib, u daftarchaga nimadir yozayotgan edi.'),
    T('A','Наверное, проверяет документы, оформленные летом. Нам тоже надо всё показать.','naviryna pravyeryayet dakumyenty afarmlyennyye lyetam nam tozhe nada vsyo pakazat','Ehtimol, yozda rasmiylashtirilgan hujjatlarni tekshiryapti. Bizga ham hammasini ko‘rsatish kerak.'),
    T('B','У меня всё готово. Прочитав договор, я сразу сделал копии и подписал.','u minya vsyo gatovo prachitav dagavor ya srazu zdyelal kopii i patpisal','Menda hammasi tayyor. Shartnomani o‘qib chiqib, darhol nusxa ko‘chirdim va imzoladim.'),
    T('A','Молодец! А я, не зная русского, чуть не подписал что-то лишнее.','malodyets a ya nye znaya ruskava chut nye patpisal shtota lishniye','Barakalla! Men esa rus tilini bilmay, ortiqcha narsani imzolab qo‘yishimga oz qoldi.'),
    T('B','Поэтому лучше переспросить, чем потом жалеть о подписанной бумаге.','paetamu luchshe pirispratit chem potom zhalet a patpisannoy bumagye','Shuning uchun qayta so‘ragan yaxshi, keyin imzolangan qog‘ozga afsuslanib yurgandan ko‘ra.'),
    T('A','Согласен. Пойдём вместе, спросим коменданта, пока он не ушёл на обед.','saglasyen paydyom vmyestye sprosim kamendanta paka on nye ushol na abyet','Roziman. Birga boraylik, komendantdan so‘raymiz, u tushlikka chiqib ketmasidan oldin.'),
    T('B','Давай, только дай мне допить чай, остывший ещё полчаса назад.','davay tolka day mnye dapit chay astyvshiy yishyo polchasa nazat','Mayli, faqat yarim soat oldin sovib qolgan choyimni ichib olay.'),
  ]
});

LESSONS.push({ id: 'b2a-02', type: 'P', sec: 11, title: 'Shaxssiz va majhul gaplar', sub: 'Безличные предложения',
  intro: 'Shaxssiz gapda ish bajaruvchi ko‘rsatilmaydi.\nГоворят… — aytishadi; Здесь не курят — bu yerda chekilmaydi.\nМне не спится — uyqum kelmayapti; Мне повезло — omadim keldi.\nПохолодало — sovuq bo‘ldi; Принято… — odat shunday.\nKim qilgani noma’lum yoki muhim emas, shuning uchun 3-shaxs ko‘plikdan yoki dativdan foydalaniladi.',
  items: [
    P('В общежитии после одиннадцати вечера не принято громко разговаривать и включать музыку.', 'v abshezhitii poslye adinatsati vyechira nye prinyata gromka razgavarivat i vklyuchat muzyku', 'Yotoqxonada kechqurun soat o‘n birdan keyin baland ovozda gaplashish va musiqa qo‘yish odat emas.', 'Не принято — «odat emas, yarashmaydi».'),
    P('Говорят, что с первого декабря в нашем районе отменят несколько автобусов.', 'gavaryat shto s pyervava dikabrya v nashem rayonye atminyat nyeskalka aftobusof', 'Aytishlaricha, birinchi dekabrdan bizning tumanda bir nechta avtobus qatnovi bekor qilinar ekan.', 'Говорят = aytishadi, mish-mish. Ko‘chada ko‘pincha: «Говорят, что...»'),
    P('Мне сегодня не спится: завтра первый рабочий день, и я очень волнуюсь.', 'mnye sivodnya nye spitsa zaftra pyervyy rabochiy dyen i ya ochen valnuyus', 'Bugun uyqum kelmayapti: ertaga birinchi ish kuni, juda hayajondaman.'),
    P('Мне повезло: хозяйка сдала комнату недорого и даже разрешила пользоваться кухней.', 'mnye pavizlo xazyayka zdala komnatu nidaroga i dazhe razrishila polzavatsa kuxnyey', 'Menga omad kulib boqdi: uy egasi xonani arzon ijaraga berdi va hatto oshxonadan foydalanishga ruxsat berdi.'),
    P('Здесь не курят, поэтому выйдите, пожалуйста, на улицу, там специальное место для курения.', 'zdyes nye kuryat paetamu vyydite pazhalusta na ulitsu tam spitsialnaye myesta dlya kureniya', 'Bu yerda chekilmaydi, shuning uchun iltimos, ko‘chaga chiqing, u yerda chekish uchun maxsus joy bor.'),
    P('В пятницу вечером в центре так людно, что нам не хватило места в кафе.', 'f pyatnitsu vyechiram v tsentrye tak lyudna shto nam nye xvatila myesta v kafye', 'Juma kuni kechqurun markazda shunchalik gavjumki, kafeda bizga joy yetmadi.', 'Людно — «odam ko‘p»; Нам не хватило — «bizga yetmadi».'),
    P('К вечеру похолодало, и мне стало так холодно, что пришлось зайти в магазин погреться.', 'k vyechiru paxaladala i mnye stala tak xolodna shto prishlos zayti v magazin pagryetsa', 'Kechga borib sovuq tushdi, menga shunchalik sovuq bo‘ldiki, isinish uchun do‘konga kirishga to‘g‘ri keldi.'),
    P('Меня тошнит от этого запаха, давай откроем окно, иначе я долго не выдержу.', 'minya tashnit at etava zapaxa davay atkroyem akno inache ya dolga nye vyderzhu', 'Bu hiddan ko‘nglim aynayapti, keling derazani ochaylik, bo‘lmasa uzoq chidamayman.'),
    P('В этом доме по вечерам слышно, как соседи сверху двигают мебель и спорят.', 'v etam domye pa vyechiram slyshna kak sasyedi sverxu dvigayut myebil i sparyat', 'Bu uyda kechqurunlari tepadagi qo‘shnilar mebel surib, tortishayotgani eshitilib turadi.'),
    P('Вам нужно прийти завтра к девяти, потому что приём документов закончат ровно в одиннадцать.', 'vam nuzhna priyti zaftra k dyevyati patamu shto priyom dakumyentaf zakonchat ravna v adinatsat', 'Siz ertaga to‘qqizgacha kelishingiz kerak, chunki hujjat qabuli roppa-rosa o‘n birda tugatiladi.'),
    P('Нам разрешили оставить велосипеды во дворе, но запретили ставить их у подъезда.', 'nam razrishili astavit vilasipyedy va dvorye no zapritili stavit ix u padyezda', 'Bizga velosipedlarni hovlida qoldirishga ruxsat berishdi, lekin yo‘lak oldiga qo‘yishni taqiqlashdi.', 'Разрешили, запретили — kim ekani muhim emas: «ruxsat berishdi».'),
    P('В нашем офисе по пятницам заказывают пиццу, и никого не заставляют оставаться после шести.', 'v nashem ofise pa pyatnitsam zakazyvayut pitstsu i nikavo nye zastavlyayut astavatsa poslye shesti', 'Bizning ofisda juma kunlari pitsa buyurtma qilinadi va hech kimni oltidan keyin qolishga majburlashmaydi.'),
    P('В субботу нас не пустили в клуб, потому что у друга не оказалось паспорта.', 'f subotu nas nye pustili v klup patamu shto u druga nye azalas pasparta', 'Shanba kuni bizni klubga kiritishmadi, chunki do‘stimda pasport chiqmadi.', 'Не пустили — «kiritishmadi». Kim ekani aytilmaydi.'),
  ],
  talk: [
    T('A','Слушай, говорят, что в понедельник в общежитии отключат воду на целый день.','slushay gavaryat shto v panidyelnik v abshezhitii atklyuchat vodu na tseliy dyen','Eshit, aytishlaricha, dushanba kuni yotoqxonada suvni butun kunga o‘chirishadi.'),
    T('B','Да, уже повесили объявление. Мне теперь не спится из-за этого, надо запасти воды заранее.','da uzhe pavyesili abyavlyeniye mnye tipyer nye spitsa iz za etava nada zapasti vody zaranye','Ha, e’lon osib qo‘yishibdi. Endi shu sababli uyqum kelmayapti, suvni oldindan zaxiralash kerak.'),
    T('A','Давай купим большие бутылки в магазине у дома. Говорят, сегодня там скидки.','davay kupim bolshiye butylki v magazinye u doma gavaryat sivodnya tam skitki','Keling, uy yonidagi do‘kondan katta shishalar olaylik. Aytishlaricha, bugun u yerda chegirmalar bor.'),
    T('B','Отлично! Мне вчера повезло: в аптеке мне продали последний пакет витаминов со скидкой.','atlichna mnye fchira pavizlo v aptyekye mnye pradali paslyedniy pakyet vitaminaf sa skitkay','Zo‘r! Kecha menga omad kulib boqdi: dorixonada oxirgi vitaminlar paketini chegirma bilan sotishdi.'),
    T('A','Давай быстрее: на улице холодает, а курить здесь нельзя.','davay bystryeye na ulitse xaladayet a kurit zdyes nyelzya','Tezroq bo‘laylik: ko‘chada sovuq tushyapti, bu yerda esa chekish mumkin emas.'),
    T('B','Не переживай, нас обслужат быстро, обычно в это время людей мало.','nye pirizhivay nas abslushat bystra abychna v yeta vryemya lyudyey mala','Xavotir olma, bizga tez xizmat ko‘rsatishadi, bu vaqtda odatda odam kam bo‘ladi.'),
    T('A','Ладно, пошли. Всё равно мне сегодня не до сна, лучше займусь делами.','ladna pashli vsyo ravna mnye sivodnya nye da sna luchshe zaymus dyelami','Mayli, ketdik. Baribir bugun uyquga vaqtim yo‘q, yaxshisi ishlarimni qilaman.'),
    T('B','Тогда после магазина зайдём ко мне, у меня остался горячий суп.','tagda poslye magazina zaydyom ka mnye u minya astalsya garyachiy sup','Unda do‘kondan keyin menikiga o‘tamiz, menda issiq sho‘rva qolgan.'),
  ]
});

LESSONS.push({ id: 'b2a-03', type: 'P', sec: 11, title: 'Murakkab bog‘lovchilar', sub: 'Сложные союзы',
  intro: 'Murakkab bog‘lovchilar gapni ravon va uzun qiladi.\nхотя, несмотря на то что — «...sa ham»; как только — «...ishim bilan».\nпока не — «...maguncha»; прежде чем — «...dan oldin»; после того как — «...dan keyin».\nкак будто — «go‘yo».\nBog‘lovchidan oldin doim vergul qo‘yiladi: ..., хотя ...',
  items: [
    P('Хотя я живу в России уже два года, иногда всё равно не понимаю быструю речь.', 'xotya ya zhyvu v rasii uzhe dva goda inagda vsyo ravna nye panimayu bystruyu rech', 'Rossiyada ikki yildan beri yashasam ham, ba’zan baribir tez nutqni tushunmayman.'),
    P('Несмотря на то что за окном шёл сильный дождь, мы пошли гулять в парк.', 'nismatrya na to shto za aknom shol silnyy dozhd my pashli gulyat f park', 'Deraza orqasida kuchli yomg‘ir yog‘ib tursa ham, biz parkka sayr qilgani chiqdik.', 'Несмотря на то что — «хотя»dan rasmiyroq.'),
    P('Как только получу зарплату, сразу отдам тебе долг и куплю билет домой.', 'kak tolka paluchu zarplatu srazu atdam tibye dolk i kuplyu bilyet damoy', 'Maosh olishim bilanoq, qarzingni qaytaraman va uyga chipta olaman.'),
    P('Не уходи, пока не закончишь отчёт, иначе завтра придётся всё переделывать заново.', 'nye uxodi paka nye zakonchish atchyot inache zaftra pridyotsa vsyo piridyelyvat zanova', 'Hisobotni tugatmaguningcha ketma, bo‘lmasa ertaga hammasini qaytadan qilishga to‘g‘ri keladi.', 'Пока не + fe’l = «...maguncha».'),
    P('Прежде чем подписывать договор аренды, внимательно прочитай все пункты и задай вопросы хозяину.', 'pryezhdye chem patpisyvat dagavor arendy vnimatilna prachitay vsye punkty i zaday vaprosy xazyainu', 'Ijara shartnomasini imzolashdan oldin barcha bandlarni diqqat bilan o‘qib chiq va uy egasiga savollar ber.'),
    P('После того как я переехал в Москву, у меня появилось гораздо больше новых знакомых.', 'poslye tavo kak ya pirieyxal v maskvu u minya payavilas gorazda bolshe novyx znakomyx', 'Moskvaga ko‘chib o‘tganimdan keyin menda ancha ko‘p yangi tanishlar paydo bo‘ldi.'),
    P('Он говорит по-русски так, как будто всю жизнь прожил в Петербурге, хотя приехал недавно.', 'on gavarit pa ruski tak kak budta vsyu zhizn prazhyl v pitirburgye xotya priyexal nidavna', 'U rus tilida shunday gapiradiki, go‘yo butun umrini Peterburgda o‘tkazgandek, aslida yaqinda kelgan.', 'Как будто = «go‘yo». Ko‘chada ko‘pincha: «как будто бы», «будто».'),
    P('Так как автобусы сегодня ходят редко, нам лучше выйти из дома заранее, чтобы не опоздать.', 'tak kak aftobusy sivodnya xodyat ryedka nam luchshe vyyti iz doma zaranye shtoby nye apazdat', 'Avtobuslar bugun kam qatnagani uchun, kechikmaslik maqsadida uydan oldinroq chiqqanimiz yaxshi.'),
    P('Если бы я знал, что у вас сегодня праздник, обязательно принёс бы вам что-нибудь.', 'yesli by ya znal shto u vas sivodnya praznik abizatilna prinyos by vam shtonibut', 'Bugun sizlarda bayram ekanini bilganimda, albatta nimadir olib kelgan bo‘lardim.'),
    P('Мы с коллегами договорились встретиться, едва закончится рабочий день, чтобы вместе поехать на шашлыки.', 'my s kalyegami dagavarilis fstryetitsa yedva zakonchitsa rabochiy dyen shtoby vmyestye payexat na shashlyki', 'Hamkasblarim bilan ish kuni tugashi bilanoq uchrashib, birga shashlikka borishga kelishdik.'),
    P('Я не стал спорить с начальником, потому что понимал, что он всё равно не изменит решение.', 'ya nye stal sparit s nachalnikam patamu shto panimal shto on vsyo ravna nye izmenit rishyeniye', 'Men boshliq bilan bahslashmadim, chunki u baribir qarorini o‘zgartirmasligini tushunardim.'),
    P('Лишь бы не было пробок, тогда мы успеем доехать до аэропорта за полчаса до вылета.', 'lish by nye bylo probak tagda my uspyem dayexat da aeraporta za polchasa da vyleta', 'Faqat tirbandlik bo‘lmasa bo‘ldi, unda aeroportga uchishdan yarim soat oldin yetib olamiz.', 'Лишь бы — «faqat ... bo‘lsa bas».'),
    P('Мне кажется, что ты обиделся, хотя ничего плохого я не хотел сказать.', 'mnye kazhetsa shto ty abidyelsya xotya nichivo plaxova ya nye xatyel skazat', 'Menimcha, sen xafa bo‘lding, garchi men yomon narsa aytmoqchi bo‘lmagan edim.'),
  ],
  talk: [
    T('A','Ты уже нашёл работу? Хотя прошло всего две недели, ты выглядишь очень уставшим.','ty uzhe nashol rabotu xotya proshlo fsivo dvye nidyeli ty vyglyadish ochen ustavshym','Ishni topdingmi? Atigi ikki hafta o‘tgan bo‘lsa ham, juda charchagan ko‘rinasan.'),
    T('B','Нашёл, но пока не освоюсь, придётся работать по двенадцать часов.','nashol no paka nye asvayus pridyotsa rabotat pa dvinadtsat chasof','Topdim, lekin ko‘nikib olmagunimcha, kuniga o‘n ikki soatdan ishlashga to‘g‘ri keladi.'),
    T('A','Ничего себе! Прежде чем соглашаться, ты хотя бы спросил про выходные и оплату?','nichivo sibye pryezhdye chem saglashatsa ty xotya by sprasil pra vyxadnyye i aplatu','Voy! Rozi bo‘lishdan oldin hech bo‘lmasa dam olish kunlari va to‘lov haqida so‘radingmi?'),
    T('B','Спросил. После того как мы всё обсудили, начальник пообещал два выходных в неделю.','sprasil poslye tavo kak my vsyo absudili nachalnik paabyeshal dva vyxadnyx v nidyelyu','So‘radim. Hammasini muhokama qilganimizdan keyin boshliq haftada ikki kun dam olish va’da qildi.'),
    T('A','Звучит нормально. Как только получишь первую зарплату, пригласи меня в кафе!','zvuchit narmalna kak tolka paluchish pyervuyu zarplatu priglasi minya f kafye','Yaxshi eshitiladi. Birinchi maoshni olishing bilan meni kafega taklif qil!'),
    T('B','Договорились, хотя я так устаю, как будто целый день таскаю мешки с цементом.','dagavarilis xotya ya tak ustayu kak budta tseliy dyen taskayu myeshki s tsimyentam','Kelishdik, garchi shunchalik charchayman, go‘yo kun bo‘yi sement qoplarini tashiyotgandekman.'),
    T('A','Несмотря на то что работа тяжёлая, платят хорошо, так что держись.','nismatrya na to shto rabota tyazholaya platyat xarasho tak shto dyerzhis','Ish og‘ir bo‘lsa ham, yaxshi to‘lashadi, shuning uchun bardam bo‘l.'),
    T('B','Спасибо! Если бы не ты, я бы, наверное, давно сдался.','spasiba yesli by nye ty ya by naviryna davno zdalsya','Rahmat! Sen bo‘lmaganingda, ehtimol, allaqachon taslim bo‘lgan bo‘lardim.'),
  ]
});

LESSONS.push({ id: 'b2a-04', type: 'P', sec: 11, title: 'Frazeologizmlar va idiomalar', sub: 'Идиомы и устойчивые выражения',
  intro: 'Idiomani so‘zma-so‘z tarjima qilib bo‘lmaydi, butunicha yodlang.\nВ чём дело? — nima gap?; По рукам! — kelishdik!\nРуки не доходят — qo‘lim tegmayapti; как снег на голову — kutilmaganda.\nни свет ни заря — tong qorong‘usida; ломать голову — boshni qotirmoq.\nSo‘zlarni o‘zgartirmang: idioma faqat shu shaklda ishlaydi.',
  items: [
    P('В чём дело? Ты сидишь мрачный весь вечер и ничего не рассказываешь, что у тебя случилось?', 'f chom dyelo ty sidish mrachnyy vyes vyechir i nichivo nye raskazyvayesh shto u tibya sluchilas', 'Nima gap? Kech bo‘yi xafa bo‘lib o‘tiribsan, hech narsa aytmayapsan, senga nima bo‘ldi?', 'В чём дело? — keng tarqalgan savol, «nima bo‘ldi?».'),
    P('По рукам! Раз ты согласен платить за комнату пополам, завтра же заключаем договор.', 'pa rukam raz ty saglasyen platit za komnatu papalam zaftra zhe zaklyuchayem dagavor', 'Kelishdik! Xona uchun yarmini to‘lashga rozi bo‘lsang, ertaga shartnoma tuzamiz.'),
    P('К врачу всё никак не могу записаться: руки не доходят, то работа, то учёба.', 'k vrachu vsyo nikak nye magu zapisatsa ruki nye daxodyat ta rabota ta uchyoba', 'Shifokorga yozilishga hech qo‘lim tegmayapti: goh ish, goh o‘qish.'),
    P('Ваш приезд был как снег на голову: мы вообще не знали, что вы приедете.', 'vash priyezd byl kak snyek na galavu my vaapshe nye znali shto vy priyedite', 'Sizning kelishingiz boshimizga qor yog‘gandek bo‘ldi: biz sizlar kelishingizni umuman bilmagan edik.', 'Как снег на голову — kutilmagan mehmon yoki yangilik.'),
    P('Он встаёт ни свет ни заря, чтобы успеть на первую электричку до центра.', 'on fstayot ni svyet ni zarya shtoby uspyet na pyervuyu ilektrichku da tsentra', 'U birinchi elektrichkaga ulgurish uchun tong qorong‘usidan, juda erta turadi.'),
    P('Эти два брата похожи как две капли воды, их даже родители иногда путают.', 'eti dva brata paxozhy kak dvye kapli vody ix dazhe raditili inagda putayut', 'Bu ikki aka-uka bir tomchi suvdek o‘xshash, hatto ota-onalari ham ularni ba’zan adashtirishadi.'),
    P('Не ломай голову над этой задачей, лучше спроси у преподавателя, он объяснит за минуту.', 'nye lamay galavu nad etay zadachey luchshe sprasi u pripadavatilya on abyasnit za minutu', 'Bu masalaga boshingni qotirma, yaxshisi o‘qituvchidan so‘ra, u bir daqiqada tushuntirib beradi.'),
    P('Не лезь не в своё дело, пожалуйста: мы сами разберёмся, кто кому и сколько должен.', 'nye lyes nye f svayo dyelo pazhalusta my sami razbiryomsya kto kamu i skolka dolzhen', 'Iltimos, o‘zingga tegishli bo‘lmagan ishga aralashma: kim kimga qancha qarzdorligini o‘zimiz hal qilamiz.', 'Ko‘chada ko‘pincha qo‘pol: «Не лезь!» — «aralashma».'),
    P('Мне пришлось работать без выходных целый месяц, и в конце я еле держался на ногах.', 'mnye prishlos rabotat byez vyxadnyx tseliy myesyats i f kontse ya yele dyerzhalsya na nagax', 'Men butun oy dam olish kunlarisiz ishlashga majbur bo‘ldim va oxirida oyoqda zo‘rg‘a turardim.'),
    P('Давай не будем тянуть резину: скажи прямо, ты берёшь эту работу или нет?', 'davay nye budyem tyanut rizinu skazhi pryama ty biryosh etu rabotu ili nyet', 'Cho‘zib o‘tirmaylik: to‘g‘risini ayt, bu ishni olasanmi yoki yo‘qmi?', 'Тянуть резину — «cho‘zmoq, kechiktirmoq».'),
    P('Новый менеджер говорит красиво, но на деле от него толку мало, одни обещания.', 'novyy minedzher gavarit krasiva no na dyelye at nyevo tolku malo adni abishaniya', 'Yangi menejer chiroyli gapiradi, lekin amalda undan naf kam, faqat va’dalar.'),
    P('Не принимай близко к сердцу слова начальника, он просто сегодня встал не с той ноги.', 'nye prinimay blizka k syertsu slova nachalnika on prosta sivodnya fstal nye s toy nagi', 'Boshliqning gaplarini yurakka yaqin olma, u bugun shunchaki ters turib qolgan.', 'Встал не с той ноги — «kayfiyati yo‘q».'),
    P('Давай быстрее, время — деньги, а мы уже минут сорок стоим в этой очереди.', 'davay bystryeye vryemya dyengi a my uzhe minut sorak stoim v etay ocheridi', 'Tezroq bo‘laylik, vaqt — pul, biz esa allaqachon qirq daqiqadan beri bu navbatda turibmiz.'),
  ],
  talk: [
    T('A','Привет! В чём дело? Ты с утра ходишь как в воду опущенный.','privyet f chom dyelo ty s utra xodish kak v vodu apushennyy','Salom! Nima gap? Ertalabdan beri boshing egik yuribsan.'),
    T('B','Да, как снег на голову: хозяйка сказала, что с первого числа комната дорожает.','da kak snyek na galavu xazyayka skazala shto s pyervava chisla komnata darazhayet','Ha, kutilmaganda bo‘ldi: uy egasi birinchi sanadan xona qimmatlashishini aytdi.'),
    T('A','Ничего себе! А ты уже ломал голову, где найти другую квартиру подешевле?','nichivo sibye a ty uzhe lamal galavu gdye nayti druguyu kvartiru padishevle','Voy-bo‘y! Arzonroq boshqa kvartirani qayerdan topishni allaqachon o‘ylab boshingni qotirdingmi?'),
    T('B','Конечно, но руки не доходят: то смена, то учёба, то ещё что-нибудь.','kanyeshna no ruki nye daxodyat ta smyena ta uchyoba ta yishyo shtonibut','Albatta, lekin qo‘lim tegmayapti: goh smena, goh o‘qish, goh yana nimadir.'),
    T('A','Слушай, у моего знакомого освобождается комната, он как раз ищет жильца.','slushay u mayevo znakomava asvabazhdayetsa komnata on kak raz ishchyot zhiltsa','Eshit, tanishimning xonasi bo‘shayapti, u aynan ijarachi qidiryapti.'),
    T('B','Правда? Давай созвонимся, и если цена нормальная, то по рукам!','pravda davay sazvonimsa i yesli tsena narmalnaya ta pa rukam','Rostdanmi? Gaplashib olaylik, narxi yaxshi bo‘lsa, kelishdik!'),
    T('A','Только не тяни резину: хорошие комнаты разбирают за два-три дня.','tolka nye tyani rizinu xarashiye komnaty razbirayut za dva tri dnya','Faqat cho‘zib o‘tirma: yaxshi xonalarni ikki-uch kunda olib qo‘yishadi.'),
    T('B','Понял, позвоню сегодня же. Спасибо, что выручаешь, ты настоящий друг.','panyal pazvanyu sivodnya zhe spasiba shto vyruchayesh ty nastayashiy druk','Tushundim, bugunoq qo‘ng‘iroq qilaman. Yordam berganing uchun rahmat, sen haqiqiy do‘stsan.'),
  ]
});

LESSONS.push({ id: 'b2a-05', type: 'P', sec: 11, title: 'Rasmiy va norasmiy uslub', sub: 'Официальный и неофициальный стиль',
  intro: 'Ты — do‘stlar va tengdoshlar uchun; вы — notanish, katta yoshli va boshliq uchun.\nAriza: «Прошу + infinitiv» — Прошу принять меня на работу.\nXat: Уважаемый/Уважаемая + ism; oxirida «С уважением».\nChatda: спс (rahmat), пжл (iltimos), норм (joyida) — faqat do‘stlarga.',
  items: [
    P('Мы с вами раньше не встречались, поэтому давайте перейдём на «вы» и познакомимся поближе.', 'my s vami ranshe nye vstryechalis paetamu davayte pirijdyom na vy i paznakomimsya pablizhe', 'Biz avval uchrashmagan edik, shuning uchun «siz»ga o‘tib, yaqinroq tanishaylik.', 'Ты — do‘stlarga va bolalarga; вы — notanishlarga va kattalarga.'),
    P('Старшему коллеге лучше говорить «вы», даже если он сам обращается к тебе на «ты».', 'starshymu kalyegye luchshe gavarit vy dazhe yesli on sam abrashayetsa k tibye na ty', 'Katta hamkasbga «siz» deb gapirgan yaxshi, hatto u o‘zi senga «sen» deb murojaat qilsa ham.'),
    P('Прошу предоставить мне отпуск без сохранения заработной платы с пятнадцатого по тридцать первое декабря.', 'proshu pridastavit mnye atpusk byes saxranyeniya zarabotnoy platy s pyatnatsatava pa tritsat pyervoye dikabrya', 'Iltimos, menga 15-dan 31-dekabrgacha ish haqi saqlanmaydigan ta’til bering.', 'Ariza «Прошу...» bilan boshlanadi, keyin infinitiv keladi.'),
    P('Прошу принять меня на должность водителя-экспедитора с испытательным сроком в один месяц.', 'proshu prinyat minya na dolzhnast vaditilya ikspiditora s ispytatilnym srokam v adin myesyats', 'Meni bir oy sinov muddati bilan haydovchi-ekspeditor lavozimiga qabul qilishingizni so‘rayman.'),
    P('Уважаемая Ирина Сергеевна, направляю вам копии документов, о которых мы говорили по телефону.', 'uvazhayemaya irina sirgyeyevna napravlyayu vam kopii dakumyentaf a katorykh my gavarili pa tilifonu', 'Hurmatli Irina Sergeyevna, telefonda gaplashgan hujjatlarimiz nusxalarini sizga yuboryapman.', 'Xat boshida: Уважаемый/Уважаемая + ism va otasining ismi.'),
    P('Заранее благодарю за ответ и надеюсь на дальнейшее сотрудничество с вашей компанией.', 'zaranye blagadaryu za atvyet i nadeyus na dalnyeyshiye satrudnichistva s vashey kampaniyey', 'Javobingiz uchun oldindan rahmat va kompaniyangiz bilan keyingi hamkorlikka umid qilaman.', 'Xat oxirida: «С уважением, ...» deb imzo qo‘yiladi.'),
    P('Спс, что помог вчера с переездом, без тебя я бы до ночи таскал коробки.', 'spasibo shto pamok fchira s piryezdam byes tibya ya by da nochi taskal karopki', 'Rahmat, kecha ko‘chishda yordam berding, sensiz tungacha qutilarni tashirdim.', '«Спс» — «спасибо»ning chatdagi qisqartmasi; faqat do‘stlarga yoziladi.'),
    P('Пжл, не опаздывай завтра, а то нас без записи не пустят к врачу.', 'pazhalusta nye apazdyvay zaftra a to nas byes zapisi nye pustyat k vrachu', 'Iltimos, ertaga kechikma, bo‘lmasa bizni yozuvsiz shifokorga kiritishmaydi.', '«Пжл» — «пожалуйста»ning chatdagi qisqartmasi; rasmiy xatda yozilmaydi.'),
    P('Ну как, всё норм? — Да, норм, просто устал после смены и хочу спать.', 'nu kak vsyo norm da norm prosta ustal poslye smyeny i xachu spat', 'Qalaysan, hammasi joyidami? — Ha, joyida, shunchaki smenadan keyin charchadim va uxlagim keladi.', 'Ko‘chada ko‘pincha: «норм». Rasmiy: «нормально».'),
    P('Здравствуйте! Подскажите, пожалуйста, к кому обратиться по вопросу продления регистрации в вашем районе.', 'zdrastvuyte padskazhite pazhalusta k kamu abratitsa pa vaprosu pradlyeniya rigistratsii v vashem rayonye', 'Assalomu alaykum! Iltimos, tumaningizda ro‘yxatga olishni uzaytirish masalasi bo‘yicha kimga murojaat qilish kerakligini ayting.'),
    P('Привет! Слушай, ты не мог бы одолжить мне пару тысяч до пятницы, пожалуйста?', 'privyet slushay ty nye mog by adalzhit mnye paru tysyach da pyatnitsy pazhalusta', 'Salom! Eshit, juma kunigacha menga bir-ikki ming qarz bera olmaysanmi, iltimos?', 'Rasmiyroq: «Не могли бы вы одолжить мне...»'),
    P('Не могли бы вы подсказать, как заполнить эту анкету, потому что я не очень хорошо читаю по-русски?', 'nye mogli by vy patskazat kak zapalnit etu ankyetu patamu shto ya nye ochen xarasho chitayu pa ruski', 'Bu anketani qanday to‘ldirishni ayta olmaysizmi, chunki men ruscha o‘qishni unchalik yaxshi bilmayman?'),
    P('Извините за беспокойство, я пишу вам по поводу объявления о сдаче комнаты на сайте.', 'izvinite za bispakoystva ya pishu vam pa povodu abyavlyeniya a zdachye komnaty na sayte', 'Bezovta qilganim uchun uzr, saytdagi xona ijaraga berilishi haqidagi e’lon yuzasidan yozyapman.'),
  ],
  talk: [
    T('A','Слушай, мне надо написать заявление на отпуск. Как правильно его оформить?','slushay mnye nada napisat zayavlyeniye na atpusk kak pravilna yevo afarmit','Eshit, menga ta’tilga ariza yozish kerak. Uni qanday to‘g‘ri rasmiylashtirish kerak?'),
    T('B','Сверху справа пиши, кому и от кого, а посередине — слово «заявление».','svyerxu spravo pishi komu i at kavo a pasyeridinye slova zayavlyeniye','Yuqorida o‘ng tomonga kimga va kimdan ekanini yoz, o‘rtaga esa «ariza» so‘zini.'),
    T('A','А дальше просто «прошу предоставить мне отпуск с такого-то числа», да?','a dalshe prosta proshu pridastavit mnye atpusk s takavota chisla da','Keyin shunchaki «falon sanadan boshlab menga ta’til berishingizni so‘rayman», shundaymi?'),
    T('B','Да, а внизу дата и подпись. Директору только на «вы», даже если вы давно знакомы.','da a vnizu data i patpis dirextoru tolka na vy dazhe yesli vy davno znakomy','Ha, pastda esa sana va imzo. Direktorga faqat «siz» deb, hatto uzoq tanish bo‘lsangiz ham.'),
    T('A','Понял. А в рабочем чате с начальником можно написать «спс» или «пжл»?','panyal a v rabochim chatye s nachalnikam mozhna napisat es pe es ili pe zhe el','Tushundim. Ish chatida boshliqqa «спс» yoki «пжл» deb yozsa bo‘ladimi?'),
    T('B','Лучше не надо: с начальником пиши полностью, чтобы не выглядеть небрежно. Сокращения — для друзей.','luchshe nye nada s nachalnikam pishi polnastyu shtoby nye vyglyadet nibryezhna sakrashyeniya dlya druzyey','Yaxshisi yozma: boshliq bilan to‘liq yoz, beparvo ko‘rinmaslik uchun. Qisqartmalar do‘stlar uchun.'),
    T('A','Ясно. А другу в переписке можно просто «норм» и «спс»?','yasna a drugu v pirepiske mozhna prosta norm i es pe es','Tushunarli. Do‘stga yozishmada esa shunchaki «норм» va «спс» desa bo‘ladimi?'),
    T('B','Конечно, друзьям — как угодно. Главное, не перепутай чаты, а то будет неловко!','kanyeshna druzyam kak ugodna glavnaye nye pirepitay chaty a to budyet nilovka','Albatta, do‘stlarga — xohlaganingcha. Muhimi, chatlarni adashtirib yuborma, bo‘lmasa noqulay bo‘ladi!'),
  ]
});

LESSONS.push({ id: 'b2a-06', type: 'P', sec: 11, title: 'Bahs va munozara', sub: 'Дискуссия и спор',
  intro: 'Munozarada fikrni bog‘lovchi iboralar kerak.\nс одной стороны... с другой стороны — bir tomondan... boshqa tomondan.\nболее того — bundan ham ortiq; тем не менее — shunga qaramay; в итоге — oxir-oqibat.\nRozilik: вы правы; e’tiroz: я бы возразил; fikr: на мой взгляд.',
  items: [
    P('С одной стороны, нейросети экономят время, а с другой стороны, многие боятся потерять из-за них работу.', 's adnoy starony nyeyrasyeti ekanamyat vryemya a s drugoy starony mnogiye bayatsa patiryat iz za nix rabotu', 'Bir tomondan, neyrotarmoqlar vaqtni tejaydi, boshqa tomondan, ko‘pchilik ular tufayli ishdan ayrilishdan qo‘rqadi.'),
    P('Дистанционное обучение удобно, более того, оно позволяет учиться тем, кто живёт далеко от университета.', 'distantsionaye abuchyeniye udobna bolyeye tavo ana pazvolyayet uchitsa tyem kto zhivyot dalyeko at universitita', 'Masofaviy ta’lim qulay, bundan ham muhimi, u universitetdan uzoqda yashaydiganlarga o‘qish imkonini beradi.', 'Более того — oldingi fikrni kuchaytiradi.'),
    P('Я не спорю, что зарплата важна, тем не менее для меня интересная работа важнее.', 'ya nye sparyu shto zarplata vazhna tyem nye minyeye dlya minya intyeryesnaya rabota vazhnyeye', 'Maosh muhimligiga qarshi emasman, shunga qaramay men uchun qiziqarli ish muhimroq.', 'Тем не менее — «shunga qaramay», qarama-qarshilikni bildiradi.'),
    P('Вы правы в том, что экзамены стрессовые, однако без них трудно проверить реальные знания.', 'vy pravy v tom shto ekzaminy stryesavyye adnako byes nix trudna pravyerit ryalnyye znaniya', 'Imtihonlar stressli ekani haqida haqsiz, biroq ularsiz haqiqiy bilimni tekshirish qiyin.'),
    P('Во-первых, онлайн-курсы дешевле, во-вторых, их можно проходить в любое время, а в-третьих, не нужно никуда ехать.', 'va pyervyx onlayn kursy dishevle va vtorykh ix mozhna prakhodit v lyuboye vryemya a v tryetix nye nuzhna nikuda yexat', 'Birinchidan, onlayn kurslar arzonroq, ikkinchidan, ularni istalgan vaqtda o‘tish mumkin, uchinchidan, hech qayoqqa borish shart emas.'),
    P('Я с вами не совсем согласен: удалёнка помогает экономить, но сильно мешает общаться с коллегами.', 'ya s vami nye savsyem saglasyen udalyonka pamagayet ekanomit no silna myeshayet abshatsa s kalyegami', 'Men siz bilan to‘liq rozi emasman: masofaviy ish tejashga yordam beradi, lekin hamkasblar bilan muloqotga jiddiy xalaqit beradi.', 'Удалёнка — «masofaviy ish», so‘zlashuv tilida.'),
    P('Допустим, вы правы, но разве компания готова платить больше, если сотрудник работает из дома?', 'dapustim vy pravy no razvye kampaniya gatova platit bolshe yesli satrudnik rabotayet iz doma', 'Faraz qilaylik, haqsiz, lekin xodim uydan ishlasa, kompaniya ko‘proq to‘lashga tayyormi?'),
    P('Это скорее вопрос привычки, чем технологий: старшему поколению сложнее переходить на электронные документы.', 'eta skaryeye vapros privychki chem tyexnalogiy starshymu pakalyeniyu slozhnyeye pirixodit na ilyektronnyye dakumyenty', 'Bu texnologiyadan ko‘ra odat masalasi: katta avlodga elektron hujjatlarga o‘tish qiyinroq.'),
    P('В итоге выигрывает тот, кто умеет учиться всю жизнь, а не только в школе.', 'v itoge vyigryvayet tot kto umyeyet uchitsa vsyu zhizn a nye tolka v shkolye', 'Oxir-oqibat, faqat maktabda emas, butun umr o‘rgana oladigan kishi yutadi.'),
    P('Подводя итог, можно сказать, что технологии — просто инструмент, а результат зависит от человека.', 'padvodya itok mozhna skazat shto tyexnalogii prosta instrumyent a rizultat zavisit at chilavyeka', 'Xulosa qilsam, texnologiyalar shunchaki vosita, natija esa insonga bog‘liq deyish mumkin.'),
    P('Я бы возразил: стажёрам важнее получить опыт, а не высокую зарплату на первом месте работы.', 'ya by vazrazil stazhyoram vazhnyeye paluchit opyt a nye vysokuyu zarplatu na pyervam myestye raboty', 'Men e’tiroz bildirardim: stajyorlar uchun birinchi ish joyida yuqori maosh emas, tajriba olish muhimroq.'),
    P('Всё зависит от обстоятельств: кому-то подходит работа в офисе, а кому-то — гибкий график дома.', 'vsyo zavisit at apstayatyelstf kamuta padxodit rabota v ofisye a kamuta gipkiy grafik doma', 'Hammasi sharoitga bog‘liq: kimgadir ofisda ishlash mos, kimgadir uydagi moslashuvchan jadval.'),
    P('Давайте не будем спорить впустую: давайте сначала определимся, какие аргументы мы вообще считаем убедительными.', 'davayte nye budyem sparit vpustuyu davayte snachala apridilimsya kakiye argumyenty my vapshe shitayem ubiditilnymi', 'Behuda bahslashmaylik: avval qanday dalillarni ishonarli deb hisoblashimizni kelishib olaylik.'),
  ],
  talk: [
    T('A','Слушай, как думаешь, нужно ли разрешать студентам пользоваться нейросетями на экзаменах?','slushay kak dumayesh nuzhna li razreshat studyentam polzavatsa nyeyrasyetyami na ekzaminax','Eshit, sen qanday o‘ylaysan, talabalarga imtihonda neyrotarmoqlardan foydalanishga ruxsat berish kerakmi?'),
    T('B','С одной стороны, они помогают быстро найти информацию, но с другой, экзамен проверяет твои знания.','s adnoy starony ani pamagayut bystra nayti infarmatsiyu no s drugoy ekzamen pravyeryayet tvaii znaniya','Bir tomondan, ular ma’lumotni tez topishga yordam beradi, boshqa tomondan, imtihon sening bilimingni tekshiradi.'),
    T('A','Не совсем согласен: в работе мы всё равно пользуемся такими программами каждый день.','nye savsyem saglasyen v rabotye my vsyo ravna polzuyemsya takimi pragrammami kazhdyy dyen','Butunlay rozi emasman: ishda baribir har kuni shunday dasturlardan foydalanamiz.'),
    T('B','Допустим, но на экзамене важно показать, что ты сам понимаешь материал, а не просто копируешь ответ.','dapustim no na ekzaminye vazhna pakazat shto ty sam panimayesh matiryal a nye prosta kapiruyesh atvyet','Faraz qilaylik, lekin imtihonda materialni o‘zing tushunishingni ko‘rsatish muhim, javobni shunchaki ko‘chirish emas.'),
    T('A','Более того, преподаватели могут давать задания, где нейросеть бесполезна, например, устный разбор.','bolyeye tavo prepadavatili mogut davat zadaniya gdye nyeyrasyet byespolyezna naprimyer ustnyy razbor','Bundan ham ortig‘i, o‘qituvchilar neyrotarmoq foydasiz bo‘ladigan topshiriqlar, masalan, og‘zaki tahlil berishi mumkin.'),
    T('B','Вот именно! Тем не менее запрещать технологии полностью, по-моему, тоже глупо, ведь они никуда не денутся.','vot imyenna tyem nye minyeye zapryeshat tyexnalogii polnastyu pa mayemu tozhe glupa vyed ani nikuda nye dyenutsa','Aynan shu! Shunga qaramay, texnologiyalarni butunlay taqiqlash ham, menimcha, ahmoqlik, ular baribir yo‘qolmaydi.'),
    T('A','Значит, в итоге нужен баланс: можно использовать для подготовки, но не во время проверки.','znachit v itoge nuzhen balans mozhna ispolzavat dlya padgatofki no nye va vryemya pravyerki','Demak, oxir-oqibat muvozanat kerak: tayyorgarlikda foydalanish mumkin, tekshiruv paytida esa yo‘q.'),
    T('B','Согласен. Давай так и напишем в нашем докладе, а то мы уже полчаса спорим.','saglasyen davay tak i napishem v nashem daklade a to my uzhe polchasa sporim','Roziman. Keling, ma’ruzamizga shunday yozamiz, bo‘lmasa yarim soatdan beri bahslashyapmiz.'),
  ]
});

LESSONS.push({ id: 'b2a-07', type: 'P', sec: 11, title: 'So‘z yasalishi va sinonimlar', sub: 'Словообразование и синонимы',
  intro: 'Ma’nodosh so‘zlar uslubi bilan farqlanadi.\nговорить (jarayon) — сказать (natija); болтать — norasmiy; беседовать — rasmiy.\nсмотреть (qarash) — видеть (ko‘rish) — глядеть (kitobiy).\n-тель, -ник — odam; -ость — sifatdan ot; пере-, при-, у- fe’lga ma’no beradi.',
  items: [
    P('Давай поговорим о делах: вчера мы так долго болтали, что я забыл рассказать главное.', 'davay pagavorim a dyelax fchira my tak dolga baltali shto ya zabyl raskazat glavnaye', 'Ishlar haqida gaplashaylik: kecha shunchalik uzoq gap sotdikki, asosiysini aytishni unutibman.', 'Болтать — «gap sotmoq», norasmiy; говорить — neytral.'),
    P('Директор сказал на планёрке, что собрание перенесут на среду, но подробностей никому не объяснил.', 'diryektar skazal na planyorkye shto sabraniye pirinisut na sridu no padrobnastyey nikamu nye abyasnil', 'Direktor rejalashtirish yig‘ilishida majlis chorshanbaga ko‘chirilishini aytdi, lekin tafsilotlarni hech kimga tushuntirmadi.', 'Сказать — bir martalik natija; говорить — jarayon.'),
    P('На переговорах стороны беседовали больше двух часов и в итоге подписали выгодный для всех договор.', 'na pirigavorax staronyy bisyedavali bolshe dvux chasof i v itoge patpisali vygodnyy dlya vsyex dagavor', 'Muzokaralarda tomonlar ikki soatdan ko‘proq suhbatlashdi va oxir-oqibat hamma uchun foydali shartnoma imzoladi.', 'Беседовать — rasmiy, jiddiy suhbat.'),
    P('Он смотрит сериалы на русском каждый вечер, чтобы лучше понимать живую речь без субтитров.', 'on smotrit sirialy na ruskam kazhdyy vyechir shtoby luchshe panimat zhivuyu rech byes subtitrof', 'U jonli nutqni subtitrlarsiz yaxshiroq tushunish uchun har kech ruscha serial ko‘radi.'),
    P('Не глядите на меня так строго: я просто хотел узнать, где находится ближайшая аптека.', 'nye glidite na minya tak stroga ya prasta xatyel uznat gdye naxoditsa blizhayshaya aptyeka', 'Menga bunchalik qattiq qaramang: men shunchaki eng yaqin dorixona qayerdaligini bilmoqchi edim.', 'Глядеть — «tikilib qaramoq», kitobiy yoki ko‘tarinki; смотреть — neytral.'),
    P('Я видел его вчера у метро, но он так спешил, что даже не заметил меня.', 'ya vidyel yevo fchira u mitro no on tak spyeshil shto dazhe nye zamitil minya', 'Men uni kecha metro oldida ko‘rdim, lekin u shunchalik shoshardiki, meni payqamadi ham.', 'Видеть — ko‘z bilan ko‘rish; смотреть — ongli qarash.'),
    P('Помощник преподавателя проверяет домашние задания и отвечает на вопросы студентов в чате группы.', 'pamoshnik pripadavatilya pravyeryayet damashniye zadaniya i atvyechayet na vaprosy studyentaf v chatye gruppy', 'O‘qituvchining yordamchisi uy vazifalarini tekshiradi va guruh chatida talabalarning savollariga javob beradi.', '-ник, -тель: odam nomi — помощник, преподаватель, водитель.'),
    P('Этот поставщик заслуживает доверия: его надёжность давно подтверждена многими клиентами.', 'etat pastafshik zaslushivayet davyeriya yevo nadyozhnast davno patvirzhdina mnogimi kliyentami', 'Bu yetkazib beruvchiga ishonsa bo‘ladi: uning ishonchliligi ko‘plab mijozlar tomonidan allaqachon tasdiqlangan.', '-ость sifatdan ot yasaydi: надёжный — надёжность.'),
    P('Он перепробовал десять профессий, прежде чем нашёл работу, которая ему действительно подходит.', 'on pireprobaval dyesyat prafyessiy pryezhde chem nashol rabotu katoraya yemu dyeystvitilna padxodit', 'U o‘ziga haqiqatan mos ishni topgunicha o‘nta kasbni sinab ko‘rdi.', 'Пере- — «qayta» yoki «hammasini birma-bir».'),
    P('Он приехал в Москву в сентябре, а уехал обратно только после того, как выучил язык.', 'on priyexal v maskvu v sintyabrye a uyexal abratna tolka poslye tavo kak vyuchil yazyk', 'U Moskvaga sentabrda keldi, tilni o‘rganib bo‘lgandan keyingina qaytib ketdi.', 'При- — kelish, у- — ketish: приехать — уехать.'),
    P('Я спросил, сколько стоит аренда, а потом попросил скинуть цену, и хозяин согласился.', 'ya sprasil skolka stoit arenda a potom paprasil skinut tsenu i xazyain saglasilsya', 'Men ijara qancha turishini so‘radim, keyin narxni tushirishni iltimos qildim va uy egasi rozi bo‘ldi.', 'Спросить — savol berish; попросить — iltimos qilish.'),
    P('Это крупная компания: у неё огромный офис в центре и несколько больших складов за городом.', 'eta krupnaya kampaniya u niyo agramnyy ofis v tsentrye i nyeskalka bolshix skladaf za garadam', 'Bu yirik kompaniya: markazda ulkan ofisi va shahar tashqarisida bir nechta katta omborlari bor.', 'Большой — neytral; крупный — yirik; огромный — ulkan.'),
  ],
  talk: [
    T('A','Скажи, чем отличается «говорить» от «сказать»? Мне вчера объясняли, но я запутался.','skazhi chem atlichayetsa gavarit at skazat mnye fchira abyasnyali no ya zaputalsya','Ayt-chi, «говорить» «сказать»dan nimasi bilan farq qiladi? Kecha tushuntirishdi, lekin chalkashib qoldim.'),
    T('B','Говорить — это процесс, а сказать — результат: «Он долго говорил, но ничего не сказал».','gavarit eta pratsess a skazat rizultat on dolga gavaril no nichivo nye skazal','Gapirish — jarayon, aytish — natija: «U uzoq gapirdi, lekin hech narsa aytmadi».'),
    T('A','Понятно! А «болтать»? Я слышал, как девушки в общежитии весь вечер болтали.','panyatna a baltat ya slyshal kak dyevushki v abshezhitii vyes vyechir baltali','Tushunarli! «Болтать» chi? Yotoqxonada qizlar kechasi bilan gap sotayotganini eshitdim.'),
    T('B','Болтать — это разговаривать ни о чём, по-дружески. А «беседовать» — скорее на работе или на встрече.','baltat eta razgavarivat ni a chyom pa druzhyeski a bisyedavat skaryeye na rabotye ili na fstryechye','Болтать — hech narsa haqida do‘stona gaplashish. «Беседовать» esa ko‘proq ishda yoki uchrashuvda.'),
    T('A','А со «смотреть» и «видеть» то же самое? Вчера я смотрел в окно, но никого не видел.','a sa smatryet i vidyet to zhe samaye vchira ya smatryel v akno no nikavo nye vidyel','«Смотреть» va «видеть»da ham shundaymi? Kecha derazaga qaradim, lekin hech kimni ko‘rmadim.'),
    T('B','Точно! Смотреть — действие, видеть — результат. А «глядеть» почти как «смотреть», только звучит книжнее.','tochna smatryet dyeystviye vidyet rizultat a glidyet pachti kak smatryet tolka zvuchit knizhnyeye','To‘g‘ri! Смотреть — harakat, видеть — natija. «Глядеть» deyarli «смотреть»ga o‘xshaydi, faqat kitobiyroq jaranglaydi.'),
    T('A','Теперь понятно. Запишу в блокнот, чтобы не путать, когда буду писать сочинение.','tipyer panyatna zapishu v blaknot shtoby nye putat kagda budu pisat sachinyeniye','Endi tushunarli. Insho yozganimda adashmaslik uchun daftarchaga yozib qo‘yaman.'),
    T('B','Хорошая идея. Ещё полезно учить слова с приставками: пришёл, ушёл, перешёл — сразу видно, куда идёшь.','xarashaya idyeya yishyo palyezna uchit slova s pristafkami prishol ushol pirishol srazu vidna kuda idyosh','Yaxshi fikr. Yana old qo‘shimchali so‘zlarni o‘rganish foydali: пришёл, ушёл, перешёл — qayoqqa ketayotganing darrov ko‘rinadi.'),
  ]
});

LESSONS.push({ id: 'b2a-08', type: 'P', sec: 11, title: 'So‘zlashuv to‘ldirgichlari', sub: 'Слова-связки в разговоре',
  intro: 'Bu so‘zlar gapni yumshatadi, fikrni boshlaydi yoki mavzuni o‘zgartiradi.\nвообще-то — aslida; на самом деле — haqiqatda; честно говоря — to‘g‘risini aytsam.\nкстати — aytgancha; короче — xullas; как бы, типа — «go‘yo, masalan».\nDo‘stlar orasida o‘rinli, rasmiy xat va ariza uchun mos emas. Ko‘p ishlatmang.',
  items: [
    P('Вообще-то я не люблю ходить по магазинам, но сегодня придётся купить зимнюю куртку.', 'vaapshe ta ya nye lyublyu xodit pa magazinam no sivodnya pridyotsa kupit zimnyuyu kurtku', 'Aslida do‘konma-do‘kon yurishni yoqtirmayman, lekin bugun qishki kurtka olishga to‘g‘ri keladi.', 'Вообще-то — «aslida, to‘g‘risi»; ba’zan e’tiroz ohangida ham aytiladi.'),
    P('Я, как бы, не против, но мне нужно сначала посоветоваться с женой.', 'ya kak by nye pratif no mnye nuzhna snachala pasavyetavatsa s zhenoy', 'Men, aytaylik, qarshi emasman, lekin avval xotinim bilan maslahatlashishim kerak.', '«Как бы» gapni yumshatadi; juda ko‘p ishlatilsa, g‘alati eshitiladi.'),
    P('Он, типа, мой начальник, но ведёт себя так, будто он хозяин всей компании.', 'on tipa moy nachalnik no vidyot sibya tak butta on xazyain vsyey kampanii', 'U, deylik, mening boshlig‘im, lekin o‘zini butun kompaniyaning egasidek tutadi.', '«Типа» — yoshlar tili: «go‘yo, deyarli». Rasmiy gapda ishlatilmaydi.'),
    P('На самом деле я приехал в Россию не работать, а учиться в университете.', 'na samam dyelye ya priyexal v rasiyu nye rabotat a uchitsa v universitetye', 'Aslida men Rossiyaga ishlash uchun emas, universitetda o‘qish uchun kelganman.', 'На самом деле — «haqiqatda»; fikrni tuzatganda ishlatiladi.'),
    P('Честно говоря, я не ожидал, что экзамен по русскому будет таким сложным.', 'chyesna gavarya ya nye azhidal shto ekzamyen pa ruskamu budyet takim slozhnym', 'To‘g‘risini aytsam, rus tilidan imtihon bunchalik qiyin bo‘lishini kutmagan edim.'),
    P('Кстати, ты не знаешь, где здесь можно недорого сделать копии паспорта?', 'kstati ty nye znayesh gdye zdyes mozhna nidaroga zdyelat kopii pasparta', 'Aytgancha, bu yerda pasport nusxasini arzon qayerda ko‘chirsa bo‘lishini bilmaysanmi?', 'Кстати — gap orasida esingizga tushgan narsani aytish uchun.'),
    P('Короче, мы договорились: в субботу встречаемся у метро в десять утра и едем на рынок.', 'karoche my dagavarilis f subotu fstryechayemsya u mitro v dyesyat utra i yedyem na rynak', 'Xullas, kelishdik: shanba kuni ertalab soat o‘nda metro oldida uchrashamiz va bozorga boramiz.', 'Короче — suhbatni qisqa xulosa bilan yakunlaydi.'),
    P('Ты ещё здесь? Вообще-то я думал, что ты давно переехал в другой район.', 'ty yishyo zdyes vaapshe ta ya dumal shto ty davno pirieyxal v drugoy rayon', 'Hali shu yerdamisan? Aslida men seni allaqachon boshqa tumanga ko‘chib ketgan deb o‘ylagandim.'),
    P('Это было, как бы сказать, не очень вежливо с твоей стороны, ты не находишь?', 'eta bylo kak by skazat nye ochen vyezhliva s tvayey starony ty nye naxodish', 'Bu, qanday aytsam, sening tomoningdan unchalik odobli bo‘lmadi, shunday deb o‘ylamaysanmi?'),
    P('Короче говоря, зарплату задержали на неделю, и теперь придётся занимать деньги у друзей.', 'karoche gavarya zarplatu zadyerzhali na nidyelyu i tipyer pridyotsa zanimat dyengi u druzyey', 'Xullas, maoshni bir haftaga kechiktirishdi, endi do‘stlardan qarz olishga to‘g‘ri keladi.'),
    P('Типа того: сначала подаёшь заявку на сайте, потом приходишь с документами в офис.', 'tipa tavo snachala padayosh zayavku na sayte potom prixodish s dakumyentami v ofis', 'Taxminan shunday: avval saytda ariza berasan, keyin hujjatlar bilan ofisga borasan.', '«Типа того» — «taxminan shunday», juda norasmiy.'),
    P('А на самом деле он просто боится признаться, что не понял задание.', 'a na samam dyelye on prosta bayitsa priznatsa shto nye panyal zadaniye', 'Aslida esa u shunchaki topshiriqni tushunmaganini tan olishdan qo‘rqadi.'),
  ],
  talk: [
    T('A','Слушай, я вчера, типа, весь день искал твой номер, а ты, оказывается, сменил его.','slushay ya fchira tipa vyes dyen iskal tvoy nomir a ty akazyvayetsa smenil yevo','Eshit, kecha kun bo‘yi raqamingni qidirdim, sen esa, ma’lum bo‘lishicha, uni almashtirgan ekansan.'),
    T('B','Да, вообще-то я писал в чат, но, видимо, ты не прочитал. Извини.','da vaapshe ta ya pisal f chat no vidima ty nye prachital izvini','Ha, aslida chatga yozgandim, lekin, ehtimol, sen o‘qimagansan. Kechir.'),
    T('A','Ладно, ничего. Кстати, как прошла встреча с хозяином квартиры?','ladna nichivo kstati kak proshla fstryecha s xazyainam kvartiry','Mayli, hechqisi yo‘q. Aytgancha, kvartira egasi bilan uchrashuv qanday o‘tdi?'),
    T('B','На самом деле всё прошло неплохо. Короче, он согласился снизить цену на две тысячи.','na samam dyelye vsyo proshlo niplakha karoche on saglasilsya snizit tsenu na dvye tysyachi','Aslida hammasi yomon o‘tmadi. Xullas, u narxni ikki mingga tushirishga rozi bo‘ldi.'),
    T('A','Ничего себе! А я, как бы, думал, что он вообще не любит уступать.','nichivo sibye a ya kak by dumal shto on vaapshe nye lyubit ustupat','Voy-bo‘y! Men esa, aytaylik, u umuman yon bosishni yoqtirmaydi deb o‘ylagandim.'),
    T('B','Я тоже так думал, но, честно говоря, ему просто нужны жильцы до конца года.','ya tozhe tak dumal no chyesna gavarya yemu prosta nuzhny zhiltsy da kantsa goda','Men ham shunday deb o‘ylagandim, lekin, to‘g‘risini aytsam, unga yil oxirigacha shunchaki ijarachilar kerak ekan.'),
    T('A','Понятно. Кстати, мой знакомый как раз ищет комнату рядом с метро.','panyatna kstati moy znakomyy kak raz ishchyot komnatu ryadam s mitro','Tushunarli. Aytgancha, mening tanishim aynan metro yonidan xona qidiryapti.'),
    T('B','Отлично! Давай завтра созвонимся втроём, и я всё ему расскажу.','atlichna davay zaftra sazvonimsa vtroyom i ya vsyo yemu raskazhu','Zo‘r! Ertaga uchovlon qo‘ng‘iroqlashaylik, men unga hammasini aytib beraman.'),
  ]
});

LESSONS.push({ id: 'b2a-d1', type: 'D', sec: 11, title: 'Suhbat: fikr bildirish', sub: 'Диалог · Выражаем своё мнение',
  items: [
    D('Как ты думаешь, стоит ли ехать учиться в другой город?', 'kak ty dumayesh stoit li yexat uchitsa v drugoy gorat', 'Sen qanday o‘ylaysan, boshqa shaharga o‘qishga borishga arziydimi?',
      'На мой взгляд, стоит, если там есть хороший университет и можно найти подработку, но сначала надо всё взвесить.', 'na moy vzglyat stoit yesli tam yest xarashiy universitet i mozhna nayti padrabotku no snachala nada vsyo vzvyesit', 'Menimcha, arziydi, agar u yerda yaxshi universitet bo‘lsa va qo‘shimcha ish topish mumkin bo‘lsa, lekin avval hammasini yaxshilab o‘ylab ko‘rish kerak.', '«На мой взгляд» — «menimcha»; ko‘chada ko‘pincha: «по-моему».'),
    D('Что ты думаешь о том, что дети целыми днями сидят в телефонах?', 'chto ty dumayesh a tom shto dyeti tselymi dnyami sidyat f tilifonax', 'Bolalar kun bo‘yi telefonda o‘tirishi haqida nima deb o‘ylaysan?',
      'Мне кажется, это плохо, потому что они меньше гуляют и общаются, но запрещать всё, по-моему, тоже не выход.', 'mnye kazhetsa eta plaxa patamu shto ani myenshe gulyayut i abshayutsa no zapryeshat vsyo pa mayemu tozhe nye vyxat', 'Menimcha, bu yomon, chunki ular kamroq sayr qiladi va muloqot qiladi, lekin hammasini taqiqlash ham chiqish yo‘li emas.'),
    D('Ты согласен с тем, что работать в офисе лучше, чем дома?', 'ty saglasyen s tyem shto rabotat v ofise luchshe chem doma', 'Ofisda ishlash uydagidan yaxshi degan fikrga qo‘shilasanmi?',
      'Не совсем: дома я экономлю время на дорогу, зато в офисе гораздо легче обсуждать вопросы с коллегами.', 'nye savsyem doma ya ekanomlyu vryemya na daragu zato v ofise gorazda lyexche absuzhdat vaprosy s kalyegami', 'Unchalik emas: uyda yo‘lga ketadigan vaqtni tejayman, ammo ofisda hamkasblar bilan masalalarni muhokama qilish ancha oson.', '«Не совсем» — muloyim e’tiroz, «unchalik emas».'),
    D('Как по-твоему, нужно ли знать русский язык, чтобы жить и работать в России?', 'kak pa tvayemu nuzhna li znat ruskiy yazyk shtoby zhyt i rabotat v rasii', 'Sening fikringcha, Rossiyada yashash va ishlash uchun rus tilini bilish kerakmi?',
      'Безусловно, потому что без языка трудно найти нормальную работу, и тебя легко могут обмануть.', 'byeskuslovna patamu shto byez yazyka trudna nayti narmalnuyu rabotu i tibya lyexka magut abmanut', 'Albatta, chunki tilsiz yaxshi ish topish qiyin va seni osongina aldashi mumkin.'),
    D('Что для тебя важнее при выборе работы: высокая зарплата или удобный график?', 'chto dlya tibya vazhnyeye pri vybore raboty vysokaya zarplata ili udobnyy grafik', 'Ish tanlashda sen uchun nima muhimroq: yuqori maosh yoki qulay jadval?',
      'Для меня важнее график, потому что я учусь, и мне нужно время на занятия, пусть даже платят меньше.', 'dlya minya vazhnyeye grafik patamu shto ya uchus i mnye nuzhna vryemya na zanyatiya pust dazhe platyat myenshe', 'Men uchun jadval muhimroq, chunki o‘qiyman va darslar uchun vaqt kerak, garchi kamroq to‘lashsa ham.'),
    D('Почему, как ты думаешь, многие предпочитают онлайн-курсы обычным занятиям в аудитории?', 'pachemu kak ty dumayesh mnogiye pridpachitayut onlayn kursy abychnym zanyatiyam v auditorii', 'Sen nima deb o‘ylaysan, nega ko‘pchilik auditoriyadagi oddiy darslardan ko‘ra onlayn kurslarni afzal ko‘radi?',
      'Потому что это дешевле и удобнее, хотя, честно говоря, без живого преподавателя трудно сохранять мотивацию.', 'patamu shto eta dishevle i udobnyeye xotya chyesna gavarya byez zhyvova pripadavatilya trudna saxranyat mativatsiyu', 'Chunki bu arzonroq va qulayroq, garchi, to‘g‘risini aytsam, jonli o‘qituvchisiz motivatsiyani saqlash qiyin.'),
    D('Как ты относишься к тому, что бумажные документы постепенно заменяют электронными?', 'kak ty atnosishsa k tomu shto bumazhnyye dakumyenty pastipyenna zamyenyayut ilyektronnymi', 'Qog‘oz hujjatlar asta-sekin elektron hujjatlar bilan almashtirilayotganiga munosabating qanday?',
      'В целом положительно, ведь это экономит время, но, к сожалению, не все умеют пользоваться госуслугами.', 'v tselom palazhitilna vyed eta ekanomit vryemya no k sazhalyeniyu nye vsye umyeyut polzavatsa gasuslugami', 'Umuman ijobiy, chunki bu vaqtni tejaydi, lekin afsuski, hamma ham davlat xizmatlaridan foydalana olmaydi.', 'Госуслуги — davlat xizmatlari portali.'),
    D('Как ты считаешь, стоит ли брать кредит, чтобы купить новый телефон или машину?', 'kak ty shitayesh stoit li birat kridit shtoby kupit novyy tilifon ili mashinu', 'Sening fikringcha, yangi telefon yoki mashina olish uchun kredit olishga arziydimi?',
      'Я бы не советовал: проценты большие, и если вдруг потеряешь работу, проблемы будут серьёзные.', 'ya by nye savyetaval pratsenty bolshiye i yesli vdruk patiryayesh rabotu prablyemy budut siryoznyye', 'Men maslahat bermasdim: foizlar katta, ishdan ayrilib qolsang, jiddiy muammolar bo‘ladi.'),
    D('Как ты думаешь, почему люди так любят смотреть короткие видео в телефоне?', 'kak ty dumayesh pachemu lyudi tak lyubyat smatryet karotkiye vidyeo f tilifonye', 'Sen qanday o‘ylaysan, nega odamlar telefonda qisqa videolarni shunchalik ko‘p ko‘rishni yaxshi ko‘radi?',
      'Наверное, потому что они быстрые и не требуют усилий, но после них трудно сосредоточиться на длинных текстах.', 'naviryna patamu shto ani bystryye i nye trebuyut usiliy no poslye nix trudna sasridatochitsa na dlinnyx tyekstax', 'Ehtimol, ular tez va kuch talab qilmagani uchun, lekin ulardan keyin uzun matnlarga e’tibor qaratish qiyin.'),
    D('Что бы ты посоветовал человеку, который только что приехал в Россию?', 'chto by ty pasavyetaval chilavyeku katoryy tolka shto priyexal v rasiyu', 'Rossiyaga hozirgina kelgan odamga nimani maslahat bergan bo‘lardin?',
      'Я бы посоветовал сразу оформить документы, начать учить язык и найти земляков, которые помогут на первых порах.', 'ya by pasavyetaval srazu afarmit dakumyenty nachat uchit yazyk i nayti zimlyakof katoryye pamogut na pyervyx porax', 'Men darhol hujjatlarni rasmiylashtirish, tilni o‘rganishni boshlash va dastlabki paytlarda yordam beradigan yurtdoshlarni topishni maslahat berardim.', 'Земляк — yurtdosh; ko‘chada tez-tez ishlatiladi.'),
  ]
});

LESSONS.push({ id: 'b2a-d2', type: 'D', sec: 11, title: 'Suhbat: rasmiy vaziyatlar', sub: 'Диалог · Официальные ситуации',
  items: [
    D('Здравствуйте, проходите, пожалуйста. По какому вопросу вы к нам обратились сегодня?', 'zdrastvuyte praxodite pazhalusta pa kakomu vaprosu vy k nam abratilis sivodnya', 'Assalomu alaykum, kiring, iltimos. Bugun bizga qaysi masala bo‘yicha murojaat qildingiz?',
      'Здравствуйте, мне нужно продлить регистрацию по месту пребывания, подскажите, какие документы для этого необходимы.', 'zdrastvuyte mnye nuzhna pradlit rigistratsiyu pa myestu pribyvaniya padskazhite kakiye dakumyenty dlya etava niabxadimy', 'Assalomu alaykum, turar joy bo‘yicha ro‘yxatga olishni uzaytirishim kerak, buning uchun qanday hujjatlar zarurligini ayting.', 'Регистрация по месту пребывания — vaqtinchalik ro‘yxat.'),
    D('Вы записывались на приём заранее или пришли просто так, без электронной записи?', 'vy zapisyvalis na priyom zaranye ili prishli prosta tak byes ilyektronnay zapisi', 'Qabulga oldindan yozilgandingizmi yoki shunchaki, elektron yozuvsiz keldingizmi?',
      'Да, у меня запись на десять тридцать, вот талон, который пришёл мне на телефон.', 'da u minya zapis na dyesyat tritsat vot talon katoryy prishol mnye na tilifon', 'Ha, men o‘n o‘ttizga yozilganman, mana telefonimga kelgan taloni.'),
    D('Предъявите, пожалуйста, паспорт, миграционную карту и документ, подтверждающий ваше место работы.', 'pridyavite pazhalusta pasport migratsionnuyu kartu i dakumyent patvirzhdayushiy vashe myesta raboty', 'Iltimos, pasport, migratsiya kartasi va ish joyingizni tasdiqlovchi hujjatni ko‘rsating.',
      'Конечно, вот паспорт, а миграционная карта лежит в этой папке вместе с патентом и справкой.', 'kanyeshna vot pasport a migratsionnaya karta lezhit v etay papkye vmyestye s patyentam i spravkay', 'Albatta, mana pasport, migratsiya kartasi esa shu papkada patent va ma’lumotnoma bilan birga turibdi.'),
    D('Заполните анкету печатными буквами и обязательно поставьте подпись внизу, где стоит галочка.', 'zapalnite anketu pichatnymi bukvami i abizatilna pastavte patpis vnizu gdye stoit galachka', 'Anketani bosma harflar bilan to‘ldiring va albatta pastda, belgi turgan joyga imzo qo‘ying.',
      'Хорошо, а можно я сначала заполню черновик? Боюсь допустить ошибку в написании фамилии.', 'xarasho a mozhna ya snachala zapalnyu chirnovik bayus dapustit ashipku v napisanii familii', 'Yaxshi, avval qoralamani to‘ldirsam bo‘ladimi? Familiyani yozishda xato qilib qo‘yishdan qo‘rqaman.'),
    D('Расскажите, пожалуйста, о вашем опыте работы и о том, почему вы хотите работать у нас.', 'raskazhite pazhalusta a vashem opytye raboty i a tom pachemu vy xatite rabotat u nas', 'Iltimos, ish tajribangiz va nega bizda ishlamoqchi ekaningiz haqida gapirib bering.',
      'Последние два года я работал на складе, а до этого три года водил грузовик, поэтому хорошо знаю маршруты.', 'paslyedniye dva goda ya rabotal na skladye a da etava tri goda vadil gruzavik paetomu xarasho znayu marshruty', 'Oxirgi ikki yil omborda ishladim, undan oldin uch yil yuk mashinasini haydadim, shuning uchun yo‘nalishlarni yaxshi bilaman.', 'Suhbatda «вы» va to‘liq, bog‘langan gaplar ishlatiladi.'),
    D('К сожалению, у вас не хватает одной справки, поэтому сегодня мы не можем принять документы.', 'k sazhalyeniyu u vas nye xvatayet adnoy spravki paetomu sivodnya my nye mozhem prinyat dakumyenty', 'Afsuski, sizda bitta ma’lumotnoma yetishmayapti, shuning uchun bugun hujjatlarni qabul qila olmaymiz.',
      'Скажите, пожалуйста, какой именно справки не хватает и до какого числа её можно принести?', 'skazhite pazhalusta kakoy imyenna spravki nye xvatayet i da kakova chisla yeyo mozhna prinesti', 'Iltimos, aynan qaysi ma’lumotnoma yetishmayotganini va uni qaysi sanagacha olib kelish mumkinligini ayting.'),
    D('Вы ознакомились с условиями договора и согласны подписать его в таком виде?', 'vy aznakomilis s uslaviyami dagavora i saglasny patpisat yevo f takom vidye', 'Shartnoma shartlari bilan tanishib chiqdingizmi va uni shu ko‘rinishda imzolashga rozimisiz?',
      'Я бы хотел ещё раз внимательно прочитать пункт про штрафы, прежде чем поставить подпись.', 'ya by xatyel yishyo raz vnimatilna prachitat punkt pra shtrafy pryezhdye chem pastavit patpis', 'Imzo qo‘yishdan oldin jarimalar haqidagi bandni yana bir bor diqqat bilan o‘qib chiqmoqchi edim.', 'Imzolashdan oldin bandlarni o‘qish — to‘liq huquqingiz.'),
    D('Добрый день, банк слушает. В чём заключается ваша проблема с картой?', 'dobryy dyen bank slushayet f chom zaklyuchayetsa vasha prablyema s kartay', 'Xayrli kun, bank eshitadi. Kartangiz bilan qanday muammo bor?',
      'Добрый день, вчера моя карта перестала работать, хотя деньги на счёте точно есть, прошу разобраться.', 'dobryy dyen fchira maya karta piristala rabotat xotya dyengi na shotye tochna yest proshu razabratsa', 'Xayrli kun, kecha kartam ishlamay qoldi, garchi hisobda pul aniq bor, iltimos, tekshirib ko‘ring.'),
    D('Вы хотите подать жалобу в трудовую инспекцию или сначала попробуете договориться с работодателем?', 'vy xatite padat zhalobu v trudovuyu inspektsiyu ili snachala paprobuyete dagavaritsa s rabotadatilyem', 'Mehnat inspeksiyasiga shikoyat qilmoqchimisiz yoki avval ish beruvchi bilan kelishib ko‘rasizmi?',
      'Договориться не получилось: работодатель третий месяц не платит зарплату, а у меня есть переписка и табель.', 'dagavaritsa nye paluchilas rabotadatil tryetiy myesyats nye platit zarplatu a u minya yest pirepiska i tabil', 'Kelishib bo‘lmadi: ish beruvchi uchinchi oydirki maosh to‘lamayapti, menda esa yozishmalar va tabel bor.'),
    D('Ваше заявление принято, мы рассмотрим его в течение десяти рабочих дней и свяжемся с вами.', 'vashe zayavlyeniye prinyato my rasmatrim yevo v tichyeniye dyesyati rabochix dnyey i svyazhemsya s vami', 'Arizangiz qabul qilindi, uni o‘n ish kuni ichida ko‘rib chiqamiz va siz bilan bog‘lanamiz.',
      'Спасибо большое. Скажите, пожалуйста, как я смогу узнать результат, если мне не позвонят в течение этого срока?', 'spasiba bolshoye skazhite pazhalusta kak ya smagu uznat rizultat yesli mnye nye pazvanyat v tichyeniye etava sroka', 'Katta rahmat. Iltimos, agar shu muddat ichida qo‘ng‘iroq qilishmasa, natijani qanday bilib olishim mumkin?'),
  ]
});

LESSONS.push({ id: 'b2b-01', type: 'P', sec: 12, title: 'Rossiya madaniyati va urf-odatlar', sub: 'Культура и традиции',
  intro: 'Rossiyada bayramlar va mehmondorchilik odatlari muhim: Новый год (31-dekabr), 9 мая (G‘alaba kuni), Масленица (qishni kuzatish, bliny), баня va дача.\nMehmonga borishda: «в гости» (mehmonga), «к чаю» (choyga). Poyabzalni yechish — odat.\nMisol: Масленица — qish bilan xayrlashuv; на даче — dachada.',
  items: [
    P('На Новый год почти все накрывают большой стол и ждут речь президента по телевизору.', 'na noviy got pachti vsye nakryvayut bolshoy stol i zhdut rech prezidyenta pa tilivizoru', 'Yangi yilda deyarli hamma katta dasturxon yozadi va televizorda prezident nutqini kutadi.', 'Yangi yil — Rossiyada eng katta oilaviy bayram.'),
    P('Девятого мая в каждом городе проходит парад, а люди несут портреты своих дедов.', 'dyevyatava maya v kazhdom garadye prakhodit parat a lyudi nisut partryety svayix dyedov', 'To‘qqizinchi mayda har bir shaharda parad bo‘ladi, odamlar esa buvalarining portretlarini ko‘taradi.', 'Bu G‘alaba kuni; yurishni «Бессмертный полк» deyishadi.'),
    P('На Масленицу ребята пекут блины, катаются с горок и в конце сжигают чучело зимы.', 'na maslyenitsu ribyata pikut blini katayutsya s garok i v kantse szhigayut chuchilo zimy', 'Maslenitsada yigitlar bliny pishiradi, tepaliklardan sirg‘alib tushadi va oxirida qish qo‘g‘irchog‘ini yoqadi.'),
    P('По субботам многие едут в баню, чтобы попариться вениками и посидеть с друзьями.', 'pa subotam mnogiye yedut v banyu shtoby paparitsya vinikami i pasidyet s druzyami', 'Shanba kunlari ko‘pchilik do‘stlari bilan o‘tirib, supurgi bilan terlash uchun hammomga boradi.', 'Banya — rus hammomi, bug‘li xona.'),
    P('Летом у многих есть дача, где выращивают помидоры и жарят шашлыки по выходным.', 'lyetam u mnogix yest dacha gdye vyrashivayut pamidory i zharyat shashlyki pa vyxodnym', 'Yozda ko‘pchilikning dachasi bor, u yerda pomidor o‘stiradi va dam olish kunlari shashlik qiladi.', 'Дача — shahar tashqarisidagi kichik uy va bog‘.'),
    P('Если к русским пришли гости, хозяйка сразу ставит чайник и достаёт всё из холодильника.', 'yesli k ruskim prishli gosti xazyayka srazu stavit chaynik i dastayot vsyo iz xaladilnika', 'Ruslarnikiga mehmon kelsa, bekasi darrov choynak qo‘yadi va muzlatgichdagi hamma narsani dasturxonga qo‘yadi.'),
    P('Когда идёшь в гости, принято приносить к чаю торт или конфеты, а не приходить с пустыми руками.', 'kagda idyosh v gosti prinyata prinasit k chayu tort ili kanfyety a nye prixodit s pustymi rukami', 'Mehmonga borganda choyga tort yoki konfet olib borish odat, quruq qo‘l bilan bormaydi.', 'Ko‘chada ko‘pincha: «Я с тортиком!»'),
    P('Перед входом в квартиру обязательно снимай обувь, и хозяева обычно дают гостям тапочки.', 'pirid vxodam v kvartiru abyazatilna snimay obuf i xazyaeva abychna dayut gostyam tapachki', 'Kvartiraga kirishdan oldin albatta poyabzalingni yech, uy egalari odatda mehmonlarga tapochka berishadi.'),
    P('Сидеть за одним столом и долго разговаривать для русских важнее, чем быстро поесть.', 'sidyet za adnim stalom i dolga razgavarivat dlya ruskix vazhnee chem bystra payest', 'Bitta dasturxonda o‘tirib uzoq suhbatlashish ruslar uchun tez ovqatlanishdan muhimroq.'),
    P('На свадьбах и днях рождения принято произносить длинные тосты за здоровье и за родителей.', 'na svadbax i dnyax razhdyeniya prinyata praiznosit dlinnye tosty za zdaroviye i za radityelyey', 'To‘y va tug‘ilgan kunlarda sog‘liq va ota-onalar uchun uzun tostlar aytish odat.', 'Tost — stol ustidagi so‘z, qadah ko‘tarib aytiladi.'),
    P('В Новый год дарят подарки под ёлкой, и дети верят, что их принёс Дед Мороз.', 'v noviy got daryat padarki pad yolkoy i dyeti veryat shto ix prinyos dyet maroz', 'Yangi yilda sovg‘alar archa ostiga qo‘yiladi, bolalar esa ularni Ded Moroz olib kelgan deb ishonadi.'),
    P('Многие русские по-прежнему отмечают Старый Новый год в ночь на четырнадцатое января.', 'mnogiye ruskiye pa prezhnyemu atmechayut stariy noviy got v noch na chitirnatsatoye yanvarya', 'Ko‘p ruslar hanuz Eski Yangi yilni o‘n to‘rtinchi yanvarga o‘tar kechasi nishonlaydi.', 'Eski uslub (Yuliy kalendari) bo‘yicha.'),
    P('Не удивляйся, если соседи по даче без приглашения принесут тебе банку варенья.', 'ni udivlyaysya yesli sasyedi pa dache byez priglasheniya prinesut tibye banku varyenya', 'Dachadagi qo‘shnilar taklifsiz senga bir banka murabbo olib kelsa, hayron bo‘lma.'),
  ],
  talk: [
    T('A','Слушай, в субботу мы едем на дачу к моей подруге, поедешь с нами?','slushay v subotu my yedyem na dachu k mayey padruge payedyesh s nami','Eshit, shanba kuni biz do‘stimning dachasiga boramiz, biz bilan borasanmi?'),
    T('B','Конечно поеду, только скажи, что мне взять с собой и во сколько выезжать.','kanyeshna payedu tolka skazhi shto mnye vzyat s saboy i va skolka vyezhat','Albatta boraman, faqat ayt-chi, o‘zim bilan nima olishim va soat nechada chiqishimiz kerak.'),
    T('A','Возьми что-нибудь к чаю, а мясо для шашлыка мы с ребятами уже купили.','vazmi shto nibut k chayu a myasa dlya shashlyka my s ribyatami uzhe kupili','Choyga biror narsa ol, shashlik uchun go‘shtni esa yigitlar bilan olib qo‘ydik.'),
    T('B','Хорошо, я куплю торт. А баню там тоже будут топить вечером?','xarasho ya kuplyu tort a banyu tam tozhe budut tapit vyecheram','Yaxshi, men tort olaman. Hammomni ham kechqurun isitishadimi?'),
    T('A','Да, хозяин обещал, что к семи часам всё будет готово, так что не опаздывай.','da xazyain abishal shto k simi chasam vsyo budit gatovo tak shto nye apazdyvay','Ha, uy egasi soat yettigacha hammasi tayyor bo‘ladi deb va‘da berdi, shuning uchun kechikma.'),
    T('B','Не переживай, я приеду вовремя. А мне нужно взять с собой тапочки и полотенце?','ni pirizhivay ya priyedu vavrimya a mnye nuzhno vzyat s saboy tapachki i palatentse','Xavotir olma, o‘z vaqtida kelaman. Yana o‘zim bilan tapochka va sochiq olishim kerakmi?'),
    T('A','Полотенце возьми обязательно, а тапочки там дадут, у них всегда есть запасные.','palatyentse vazmi abyazatilna a tapachki tam dadut u nix vsigda yest zapasnyye','Sochiqni albatta ol, tapochkani esa o‘sha yerda berishadi, ularda doim ortiqchasi bor.'),
    T('B','Отлично, тогда увидимся в субботу утром у метро и вместе поедем на электричке.','atlichna tagda uvidimsya v subotu utram u mitro i vmyeste payedyem na elektrichke','Ajoyib, unda shanba kuni ertalab metro yonida ko‘rishamiz va birga elektrichkada boramiz.'),
  ]
});

LESSONS.push({ id: 'b2b-02', type: 'P', sec: 12, title: 'Karyera va biznes muloqoti', sub: 'Карьера и деловое общение',
  intro: 'Ish bilan bog‘liq asosiy so‘zlar: переговоры (muzokaralar), договор (shartnoma), налог (soliq), самозанятый (o‘zini o‘zi band qilgan), повышение зарплаты (oylik oshishi).\nRasmiy tilda «вы», «давайте» ishlatiladi.\nMisol: Давайте обсудим условия — keling, shartlarni muhokama qilaylik.',
  items: [
    P('Перед собеседованием я внимательно изучил сайт компании и подготовил ответы на частые вопросы.', 'pirid sabisyedavaniyem ya vnimatilna izuchil sayt kampanii i padgatovil atvyety na chastiye vaprosy', 'Suhbatdan oldin kompaniya saytini diqqat bilan o‘rgandim va tez-tez beriladigan savollarga javoblar tayyorladim.', 'Собеседование — ishga qabul suhbati.'),
    P('Прежде чем подписывать договор, обязательно прочитай все пункты и спроси про испытательный срок.', 'prezhde chem padpisyvat dagavor abyazatilna prachitay vsye punkty i sprasi pra ispytatilniy srok', 'Shartnomani imzolashdan oldin hamma bandlarni albatta o‘qi va sinov muddati haqida so‘ra.'),
    P('Работодатель должен платить зарплату вовремя и оформить тебя официально по трудовому договору.', 'rabatadatyel dolzhen platit zarplatu vavrimya i aformit tibya afitsialna pa trudavomu dagavoru', 'Ish beruvchi oylikni o‘z vaqtida to‘lashi va seni mehnat shartnomasi bo‘yicha rasman rasmiylashtirishi kerak.', 'Ko‘chada ko‘pincha: «белая зарплата» — rasmiy oylik.'),
    P('Самозанятые платят небольшой налог и оформляют все доходы через специальное приложение на телефоне.', 'samazanyatyye platyat nibolshoy nalok i aformlyayut vsye daxody chiriz spitsialnaye prilazheniye na tilefone', 'O‘zini o‘zi band qilganlar kichik soliq to‘laydi va barcha daromadni telefondagi maxsus ilova orqali rasmiylashtiradi.', 'Bu rejim hamma fuqarolarga mos kelmaydi, avval soliq xizmati yoki yuristdan so‘ra.'),
    P('Я хочу поговорить с начальником о повышении зарплаты, ведь я взял на себя больше задач.', 'ya xachu pagavarit s nachalnikam a pavyshenii zarplaty vyed ya vzyal na sibya bolshe zadach', 'Men boshliq bilan oylikni oshirish haqida gaplashmoqchiman, chunki men ko‘proq vazifalarni o‘z zimmamga oldim.'),
    P('На переговорах лучше сначала внимательно выслушать партнёра, а потом спокойно назвать свои условия.', 'na piregavorax luchshe snachala vnimatilna vyslushat partnyora a potom spakoyna nazvat svai uslaviya', 'Muzokaralarda avval sherikni diqqat bilan tinglab, keyin xotirjam o‘z shartlaringni aytgan yaxshi.'),
    P('Если клиент просит скидку, можно предложить ему другой срок оплаты или дополнительную услугу.', 'yesli kliyent prosit skidku mozhna pridlazhit yemu drugoy srok aplaty ili dapalnitilnuyu uslugu', 'Agar mijoz chegirma so‘rasa, unga boshqa to‘lov muddati yoki qo‘shimcha xizmat taklif qilish mumkin.'),
    P('Каждый месяц я плачу налоги, поэтому храню все чеки и квитанции в одной папке.', 'kazhdyy myesyats ya plachu nalogi paetomu xranyu vsye cheki i kvitantsii v adnoy papke', 'Har oy soliq to‘layman, shuning uchun barcha chek va kvitansiyalarni bitta papkada saqlayman.'),
    P('Мой начальник часто просит остаться после работы, но переработки нужно оплачивать по закону.', 'moy nachalnik chasto prosit astatsya posle raboty no pirirabotki nuzhno aplachivat pa zakonu', 'Boshlig‘im tez-tez ishdan keyin qolishni so‘raydi, lekin ortiqcha ishlangan soatlar qonun bo‘yicha to‘lanishi kerak.'),
    P('Давайте зафиксируем наши договорённости письменно, чтобы потом не возникло никаких недоразумений.', 'davayte zafiksiruyem nashi dagavaryonnosti pismenna shtoby potom nye vaznyklo nikakix nidarazumeniy', 'Keyinchalik hech qanday tushunmovchilik bo‘lmasligi uchun kelishuvlarimizni yozma ravishda qayd etaylik.'),
    P('Мне предложили работу получше, но придётся переехать в другой город и сменить квартиру.', 'mnye pridlazhili rabotu paluchshe no pridyotsya piriyexat v drugoy gorat i smenit kvartiru', 'Menga yaxshiroq ish taklif qilishdi, lekin boshqa shaharga ko‘chib, kvartirani almashtirishga to‘g‘ri keladi.'),
    P('Резюме лучше делать коротким, на одну страницу, и обязательно указывать свой опыт и навыки.', 'rizyume luchshe dyelat karotkim na adnu stranitsu i abyazatilna ukazyvat svoy opyt i navyki', 'Rezyumeni qisqa, bir sahifada qilgan yaxshi va tajriba hamda ko‘nikmalaringni albatta ko‘rsat.'),
    P('Если работодатель задерживает зарплату больше двух недель, можно написать жалобу в трудовую инспекцию.', 'yesli rabatadatyel zadyerzhivayet zarplatu bolshe dvux nidyel mozhna napisat zhalobu v trudavuyu inspyektsiyu', 'Agar ish beruvchi oylikni ikki haftadan ortiq kechiktirsa, mehnat inspeksiyasiga shikoyat yozish mumkin.'),
  ],
  talk: [
    T('A','Добрый день, Сергей Петрович, у вас есть десять минут? Мне нужно обсудить один важный вопрос.','dobriy dyen sirgey pitrovich u vas yest dyesyat minut mnye nuzhno absudit adin vazhniy vapros','Xayrli kun, Sergey Petrovich, o‘n daqiqangiz bormi? Bitta muhim masalani muhokama qilishim kerak.'),
    T('B','Да, конечно, проходи и садись. Что ты хотел спросить?','da kanyeshna prakhodi i sadis shto ty xatyel sprasit','Ha, albatta, kir va o‘tir. Nima so‘ramoqchi eding?'),
    T('A','Я работаю у вас уже два года, и за это время мои обязанности заметно выросли.','ya rabotayu u vas uzhe dva goda i za eta vryemya mai abyazannosti zamyetna vyrosli','Men sizda ikki yildan beri ishlayman va shu vaqt ichida mening vazifalarim sezilarli ko‘paydi.'),
    T('B','Это правда, ты хорошо справляешься. К чему ты ведёшь?','eta pravda ty xarasho spravlyayeshsya k chimu ty vidyosh','To‘g‘ri, sen yaxshi uddalayapsan. Nimaga shama qilyapsan?'),
    T('A','Я хотел бы обсудить повышение зарплаты, потому что цены выросли, а моя ставка осталась прежней.','ya xatyel by absudit pavyshenie zarplaty patamu shto tseny vyrosli a maya stavka astalas prezhnyey','Men oylikni oshirishni muhokama qilmoqchi edim, chunki narxlar oshdi, mening stavkam esa avvalgidek qoldi.'),
    T('B','Понимаю тебя. Сейчас у компании сложный период, но я готов поговорить с директором.','panimayu tibya syeychas u kampanii slozhniy piriyot no ya gatov pagavarit s dirextaram','Tushunaman. Hozir kompaniyada murakkab davr, lekin men direktor bilan gaplashishga tayyorman.'),
    T('A','Спасибо. Если сейчас нельзя поднять оклад, давайте хотя бы договоримся о премии в конце квартала.','spasibo yesli syeychas nilzya padnyat aklat davayte xatya by dagavarimsya a primii v kantse kvartala','Rahmat. Hozir oylikni ko‘tarib bo‘lmasa, hech bo‘lmasa chorak oxirida mukofot haqida kelishib olaylik.'),
    T('B','Хорошо, мы вернёмся к этому разговору в понедельник, а пока подготовь список своих задач.','xarasho my virnyomsya k etamu pagavoru v panidyelnik a paka padgatov spisak svayix zadach','Yaxshi, bu suhbatga dushanba kuni qaytamiz, hozircha o‘z vazifalaring ro‘yxatini tayyorla.'),
  ]
});

LESSONS.push({ id: 'b2b-03', type: 'P', sec: 12, title: 'Qonun va migratsiya', sub: 'Закон и миграция',
  intro: 'Muhim so‘zlar: разрешение на работу (ish ruxsatnomasi), патент, штраф (jarima), продлить срок (muddatni uzaytirish), юрист, права и обязанности (huquq va majburiyatlar).\nQoidalar o‘zgarib turadi, shuning uchun rasmiy saytdan tekshir.\nMisol: Мне нужно продлить патент.',
  items: [
    P('Чтобы легально работать в России, иностранному гражданину нужно получить патент или разрешение на работу.', 'shtoby ligalna rabotat v rasii inastrannamu grazhdaninu nuzhno paluchit patent ili razrishyenie na rabotu', 'Rossiyada qonuniy ishlash uchun xorijiy fuqaro patent yoki ish ruxsatnomasini olishi kerak.'),
    P('Срок патента нужно продлевать заранее, пока он не закончился, и платить налог вовремя.', 'srok patenta nuzhno pradlivat zaranee paka on nye zakonchilsya i platit nalok vavrimya', 'Patent muddatini u tugamasdan oldin uzaytirish va soliqni o‘z vaqtida to‘lash kerak.'),
    P('Если вовремя не оплатить патент, его могут аннулировать, и работать дальше будет нельзя.', 'yesli vavrimya nye aplatit patent yevo mogut anulirovat i rabotat dalshe budit nilzya', 'Agar patent uchun o‘z vaqtida to‘lamasang, uni bekor qilishi mumkin va keyin ishlash mumkin bo‘lmaydi.'),
    P('Штраф за нарушение миграционных правил может быть большим, поэтому лучше сразу уточнить всё у специалиста.', 'shtraf za narushenie migratsionnyx pravil mozhet byt balshim paetomu luchshe srazu utochnit vsyo u spitsialista', 'Migratsiya qoidalarini buzganlik uchun jarima katta bo‘lishi mumkin, shuning uchun hammasini darrov mutaxassisdan aniqlagan yaxshi.'),
    P('Юриста лучше искать по рекомендации знакомых и обязательно просить письменный договор об услугах.', 'yurista luchshe iskat pa rikamindatsii znakomyx i abyazatilna prasit pismenniy dagavor ab uslugax', 'Yuristni tanishlar tavsiyasi bilan qidirgan va xizmatlar haqida yozma shartnomani albatta so‘ragan yaxshi.'),
    P('У каждого человека есть не только обязанности, но и права, поэтому не бойся задавать вопросы.', 'u kazhdava chilavyeka yest ni tolka abyazannosti no i prava paetomu ni boysya zadavat vaprosy', 'Har bir insonning faqat majburiyatlari emas, huquqlari ham bor, shuning uchun savol berishdan qo‘rqma.'),
    P('Миграционный учёт нужно оформить в течение семи рабочих дней после приезда, а срок лучше уточнить заранее.', 'migratsionniy uchyot nuzhno aformit v ticheniye simi rabochix dnyey posle priyezda a srok luchshe utochnit zaranee', 'Migratsiya hisobini kelgandan keyin yetti ish kuni ichida rasmiylashtirish kerak, muddatni esa oldindan aniqlagan yaxshi.', 'Muddat o‘zgarishi mumkin, rasmiy saytdan tekshir.'),
    P('При проверке документов полиция обязана представиться, а ты вправе спросить, на каком основании тебя остановили.', 'pri pravyerke dakumyentov palitsiya abyazana pridstavitsya a ty vprave sprasit na kakom asnavanii tibya astanavili', 'Hujjatlar tekshirilganda politsiya o‘zini tanishtirishi shart, sen esa seni qanday asosda to‘xtatganini so‘rashga haqlisan.'),
    P('Никогда не отдавай свой паспорт в залог и не соглашайся на работу, если у тебя забирают документы.', 'nikagda nye atdavay svoy pasport v zalok i nye saglashaysya na rabotu yesli u tibya zabirayut dakumyenty', 'Hech qachon pasportingni garovga berma va hujjatlaringni olib qo‘yishsa, ishga rozi bo‘lma.'),
    P('Чтобы продлить срок, лучше заранее собрать все документы и записаться на приём в миграционный центр.', 'shtoby pradlit srok luchshe zaranee sabrat vsye dakumyenty i zapisatsya na priyom v migratsionniy tsentr', 'Muddatni uzaytirish uchun hamma hujjatni oldindan yig‘ib, migratsiya markaziga qabulga yozilgan yaxshi.'),
    P('Я потерял документы, и теперь мне нужно срочно узнать, где получить дубликат и сколько это стоит.', 'ya patiryal dakumyenty i tipyer mnye nuzhno srochna uznat gdye paluchit dublikat i skolka eta stoit', 'Men hujjatlarimni yo‘qotdim va endi dublikatni qayerdan olish mumkinligi va qancha turishini shoshilinch bilishim kerak.'),
    P('Если тебя оштрафовали, внимательно проверь квитанцию и оплати штраф через официальный сайт или банк.', 'yesli tibya ashtrafavali vnimatilna pravyer kvitantsiyu i aplati shtraf chiriz afitsialniy sayt ili bank', 'Agar seni jarimaga tortishgan bo‘lsa, kvitansiyani diqqat bilan tekshir va jarimani rasmiy sayt yoki bank orqali to‘la.'),
    P('Договор аренды и трудовой договор нужно хранить, потому что они могут понадобиться при проверке.', 'dagavor arendy i trudavoy dagavor nuzhno xranit patamu shto ani magut panadobitsya pri pravyerke', 'Ijara shartnomasi va mehnat shartnomasini saqlash kerak, chunki tekshiruvda kerak bo‘lib qolishi mumkin.'),
  ],
  talk: [
